    // ==========================================
    // 3. SECCIÓN: RECETAS Y ESTRUCTURA DE COSTOS
    // ==========================================
    function RecetasCostosView({ productos, setProductos, insumos, calculateProductCost, showToast, setActiveTab }) {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);

      // Formulario de Producto/Receta
      const [nombre, setNombre] = useState("");
      const [categoria, setCategoria] = useState("Gastronomía");
      const [unidadesPorLote, setUnidadesPorLote] = useState(1);
      const [precioVenta, setPrecioVenta] = useState("");
      const [itemsReceta, setItemsReceta] = useState([]);

      // Simulador de margen
      const [margenDeseado, setMargenDeseado] = useState(65); // 65% estándar gastro

      const handleOpenModal = (prod = null) => {
        if (prod) {
          setEditingId(prod.id);
          setNombre(prod.nombre);
          setCategoria(prod.categoria || "Gastronomía");
          setUnidadesPorLote(prod.unidadesPorLote || 1);
          setPrecioVenta(prod.precioVenta || "");
          setItemsReceta(prod.items || []);
        } else {
          setEditingId(null);
          setNombre("");
          setCategoria("Gastronomía");
          setUnidadesPorLote(12);
          setPrecioVenta("");
          setItemsReceta([]);
        }
        setIsModalOpen(true);
      };

      const handleAddItem = () => {
        if (insumos.length === 0) {
          alert("Primero debes registrar insumos en la pestaña de Insumos.");
          return;
        }
        setItemsReceta([...itemsReceta, { insumoId: insumos[0].id, cantidad: 100 }]);
      };

      const handleRemoveItem = (index) => {
        setItemsReceta(itemsReceta.filter((_, i) => i !== index));
      };

      const handleItemChange = (index, field, value) => {
        const copy = [...itemsReceta];
        copy[index][field] = field === "cantidad" ? parseFloat(value) || 0 : value;
        setItemsReceta(copy);
      };

      // Cálculo en tiempo real dentro del modal
      const modalCostos = useMemo(() => {
        let totalLote = 0;
        let ingCost = 0;
        let empCost = 0;

        itemsReceta.forEach(item => {
          const insumo = insumos.find(i => i.id === item.insumoId);
          if (insumo) {
            const c = (insumo.costoUnitario || 0) * (item.cantidad || 0);
            totalLote += c;
            if (insumo.categoria === "Empaque") empCost += c;
            else ingCost += c;
          }
        });

        const unidades = Math.max(1, unidadesPorLote);
        const costoUnitario = totalLote / unidades;
        const precioSugerido = margenDeseado < 100 ? costoUnitario / (1 - (margenDeseado / 100)) : costoUnitario * 2;

        return { totalLote, costoUnitario, ingCost, empCost, precioSugerido };
      }, [itemsReceta, insumos, unidadesPorLote, margenDeseado]);

      const handleSave = (e) => {
        e.preventDefault();
        if (!nombre.trim()) {
          alert("Ingresa un nombre para el producto.");
          return;
        }
        if (itemsReceta.length === 0) {
          alert("Agrega al menos un insumo o empaque a la receta.");
          return;
        }

        const data = {
          nombre: nombre.trim(),
          categoria,
          unidadesPorLote: Math.max(1, parseInt(unidadesPorLote) || 1),
          precioVenta: parseFloat(precioVenta) || parseFloat(modalCostos.precioSugerido.toFixed(2)),
          items: itemsReceta,
        };

        if (editingId) {
          setProductos(prev => prev.map(p => p.id === editingId ? { ...p, ...data } : p));
          showToast("Receta actualizada con éxito.");
        } else {
          setProductos(prev => [...prev, { id: "prod-" + Date.now(), ...data }]);
          showToast("Nueva receta creada y costeada.");
        }
        setIsModalOpen(false);
      };

      const handleDelete = (id, nombreProd) => {
        if (confirm(`¿Eliminar la receta "${nombreProd}"?`)) {
          setProductos(prev => prev.filter(p => p.id !== id));
          showToast("Receta eliminada.", "info");
        }
      };

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Recetas & Estructura de Costos</h2>
              <p className="text-sm text-slate-500 mt-1">Diferencia entre el costo del lote completo y el costo exacto por unidad producida.</p>
            </div>
            <button
              onClick={() => handleOpenModal()}
              className="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-semibold rounded-xl shadow-sm transition"
            >
              <span className="text-lg">+</span> Crear Nueva Receta
            </button>
          </div>

          {/* Grid de Productos / Recetas */}
          {productos.length === 0 ? (
            <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-400">
              <div className="text-4xl mb-3">🧾</div>
              <p className="font-semibold text-slate-700">No hay recetas creadas</p>
              <p className="text-xs text-slate-500 mt-1">Crea tu primera receta para calcular costos por lote y márgenes de ganancia.</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {productos.map(prod => {
                const metricas = calculateProductCost(prod);

                return (
                  <div key={prod.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 flex flex-col justify-between hover:border-amber-300 transition-all">
                    <div>
                      {/* Top Bar de la Tarjeta */}
                      <div className="flex justify-between items-start mb-3">
                        <div>
                          <span className="text-[11px] font-bold uppercase tracking-wider text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                            {prod.categoria}
                          </span>
                          <h3 className="text-xl font-bold text-slate-900 mt-1">{prod.nombre}</h3>
                        </div>
                        <div className="flex items-center gap-1">
                          <button
                            onClick={() => handleOpenModal(prod)}
                            className="p-1.5 text-slate-400 hover:text-amber-600 rounded-lg"
                            title="Editar"
                          >
                            ✏️
                          </button>
                          <button
                            onClick={() => handleDelete(prod.id, prod.nombre)}
                            className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg"
                            title="Eliminar"
                          >
                            🗑️
                          </button>
                        </div>
                      </div>

                      {/* Diferenciación Clave: Lote vs Unidad */}
                      <div className="grid grid-cols-2 gap-3 my-4 bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                        <div>
                          <p className="text-[11px] font-bold uppercase text-slate-500">Costo del Lote</p>
                          <p className="text-xl font-extrabold text-slate-900 font-mono mt-0.5">{formatMoney(metricas.totalLote)}</p>
                          <p className="text-[11px] text-slate-500">Rinde: <span className="font-bold text-slate-700">{prod.unidadesPorLote} unidades</span></p>
                        </div>

                        <div className="border-l border-slate-200 pl-3">
                          <p className="text-[11px] font-bold uppercase text-slate-500">Costo Unitario Exacto</p>
                          <p className="text-xl font-extrabold text-amber-600 font-mono mt-0.5">{formatMoney(metricas.costoUnitario)}</p>
                          <p className="text-[11px] text-slate-500">por cada 1 unidad</p>
                        </div>
                      </div>

                      {/* Desglose de Insumos & Empaques */}
                      <div className="text-xs space-y-1 mb-4">
                        <p className="font-bold text-slate-700 mb-1.5 flex justify-between">
                          <span>Composición de la Receta:</span>
                          <span className="text-slate-400 font-normal">{prod.items?.length || 0} ingredientes / empaques</span>
                        </p>
                        <div className="max-h-32 overflow-y-auto pr-1 space-y-1">
                          {(prod.items || []).map((it, idx) => {
                            const insumo = insumos.find(i => i.id === it.insumoId);
                            const costoItem = (insumo?.costoUnitario || 0) * (it.cantidad || 0);
                            const pct = metricas.totalLote > 0 ? ((costoItem / metricas.totalLote) * 100).toFixed(1) : 0;

                            return (
                              <div key={idx} className="flex justify-between items-center py-1 border-b border-slate-100 text-slate-600">
                                <span>{insumo?.nombre || "Insumo eliminado"} ({it.cantidad} {insumo?.unidad})</span>
                                <span className="font-mono font-medium">{formatMoney(costoItem)} <span className="text-slate-400 text-[10px]">({pct}%)</span></span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                    {/* Precios y Margen de Utilidad */}
                    <div className="pt-4 border-t border-slate-200 grid grid-cols-3 gap-2 text-center">
                      <div className="bg-slate-50 p-2 rounded-xl">
                        <span className="text-[10px] uppercase font-bold text-slate-500 block">P. Venta</span>
                        <span className="text-sm font-extrabold text-slate-900 font-mono">{formatMoney(prod.precioVenta)}</span>
                      </div>
                      <div className="bg-slate-50 p-2 rounded-xl">
                        <span className="text-[10px] uppercase font-bold text-slate-500 block">Ganancia $</span>
                        <span className="text-sm font-extrabold text-emerald-600 font-mono">+{formatMoney(metricas.gananciaUnitaria)}</span>
                      </div>
                      <div className="bg-slate-50 p-2 rounded-xl">
                        <span className="text-[10px] uppercase font-bold text-slate-500 block">Margen %</span>
                        <span className="text-sm font-extrabold text-indigo-600 font-mono">{metricas.margenPorcentaje.toFixed(1)}%</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* MODAL CONSTRUCTOR DE RECETAS */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 border border-slate-200 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-slate-900">
                    {editingId ? "Editar Receta & Costeo" : "Crear Nueva Receta"}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleSave} className="space-y-5">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div className="sm:col-span-2">
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre del Producto</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej: Torta de Chocolate, Box de Cookies..."
                        value={nombre}
                        onChange={e => setNombre(e.target.value)}
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Categoría</label>
                      <input
                        type="text"
                        value={categoria}
                        onChange={e => setCategoria(e.target.value)}
                        placeholder="Ej: Postres, Panes"
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  {/* Unidades por Lote */}
                  <div className="bg-amber-50/70 p-4 rounded-xl border border-amber-200">
                    <label className="block text-xs font-bold text-amber-900 uppercase mb-1">
                      Rendimiento del Lote (Unidades que produce una tanda completa)
                    </label>
                    <div className="flex items-center gap-3">
                      <input
                        type="number"
                        min="1"
                        required
                        value={unidadesPorLote}
                        onChange={e => setUnidadesPorLote(Math.max(1, parseInt(e.target.value) || 1))}
                        className="w-32 px-3 py-2 rounded-lg border border-amber-200 text-sm font-bold bg-white"
                      />
                      <span className="text-xs text-amber-900">
                        El costo de todos los insumos de abajo se dividirá entre <strong>{unidadesPorLote}</strong> para darte el costo por unidad.
                      </span>
                    </div>
                  </div>

                  {/* Constructor de Insumos */}
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <label className="text-xs font-bold text-slate-700 uppercase">Insumos y Materiales de Empaque</label>
                      <button
                        type="button"
                        onClick={handleAddItem}
                        className="text-xs font-bold text-amber-600 hover:text-amber-700 bg-amber-50 px-3 py-1 rounded-lg border border-amber-200"
                      >
                        + Agregar Insumo/Empaque
                      </button>
                    </div>

                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                      {itemsReceta.map((item, index) => {
                        const targetInsumo = insumos.find(i => i.id === item.insumoId);
                        const cost = (targetInsumo?.costoUnitario || 0) * (item.cantidad || 0);

                        return (
                          <div key={index} className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                            <select
                              value={item.insumoId}
                              onChange={e => handleItemChange(index, "insumoId", e.target.value)}
                              className="flex-1 px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs bg-white"
                            >
                              {insumos.map(ins => (
                                <option key={ins.id} value={ins.id}>
                                  {ins.nombre} ({ins.categoria}) - {formatMoney(ins.costoUnitario)}/{ins.unidad}
                                </option>
                              ))}
                            </select>

                            <input
                              type="number"
                              step="any"
                              value={item.cantidad}
                              onChange={e => handleItemChange(index, "cantidad", e.target.value)}
                              placeholder="Cant."
                              className="w-24 px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs bg-white font-mono"
                            />

                            <span className="text-xs text-slate-500 w-12">{targetInsumo?.unidad}</span>

                            <span className="text-xs font-bold text-slate-700 w-20 text-right font-mono">
                              {formatMoney(cost)}
                            </span>

                            <button
                              type="button"
                              onClick={() => handleRemoveItem(index)}
                              className="text-slate-400 hover:text-rose-600 p-1 font-bold text-base"
                            >
                              &times;
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Resumen Financiero en Vivo */}
                  <div className="bg-slate-900 text-white p-4 rounded-xl space-y-3">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                      <div>
                        <span className="text-[10px] text-slate-400 uppercase font-bold block">Costo Lote</span>
                        <span className="text-lg font-bold font-mono">{formatMoney(modalCostos.totalLote)}</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-amber-400 uppercase font-bold block">Costo Unitario</span>
                        <span className="text-lg font-bold font-mono text-amber-400">{formatMoney(modalCostos.costoUnitario)}</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-emerald-400 uppercase font-bold block">Sugerido ({margenDeseado}%)</span>
                        <span className="text-lg font-bold font-mono text-emerald-400">{formatMoney(modalCostos.precioSugerido)}</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 uppercase font-bold block">Precio Real</span>
                        <input
                          type="number"
                          step="any"
                          placeholder={modalCostos.precioSugerido.toFixed(2)}
                          value={precioVenta}
                          onChange={e => setPrecioVenta(e.target.value)}
                          className="w-24 px-2 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-bold text-white text-center focus:outline-none font-mono"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2 rounded-xl text-sm font-semibold bg-amber-500 hover:bg-amber-600 text-white shadow-sm"
                    >
                      Guardar Receta
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 4. SECCIÓN: REGISTRO DE VENTAS E HISTORIAL
    // ==========================================
    function VentasHistorialView({ ventas, setVentas, productos, calculateProductCost, showToast }) {
      // Formulario rápido
      const [productoId, setProductoId] = useState("");
      const [cantidad, setCantidad] = useState(1);
      const [precioUnitario, setPrecioUnitario] = useState("");
      const [fecha, setFecha] = useState(new Date().toISOString().split("T")[0]);

      // Filtros
      const [filtroPeriodo, setFiltroPeriodo] = useState("Todos");
      const [busqueda, setBusqueda] = useState("");

      // Al cambiar producto, auto-llenar precio
      useEffect(() => {
        const prod = productos.find(p => p.id === productoId);
        if (prod) {
          setPrecioUnitario(prod.precioVenta || "");
        }
      }, [productoId, productos]);

      const handleRegistrarVenta = (e) => {
        e.preventDefault();
        const cant = parseInt(cantidad) || 0;
        const pu = parseFloat(precioUnitario) || 0;

        if (!productoId || cant <= 0 || pu <= 0) {
          alert("Por favor completa los campos de la venta.");
          return;
        }

        const prod = productos.find(p => p.id === productoId);
        const metricas = prod ? calculateProductCost(prod) : { costoUnitario: 0 };

        const nuevaVenta = {
          id: "v-" + Date.now(),
          productoId,
          cantidad: cant,
          precioUnitario: pu,
          costoUnitario: metricas.costoUnitario,
          fecha: fecha || new Date().toISOString().split("T")[0],
        };

        setVentas(prev => [nuevaVenta, ...prev]);
        showToast(`Venta registrada: ${cant}x ${prod?.nombre}`);
        setCantidad(1);
      };

      const handleDeleteVenta = (id) => {
        if (confirm("¿Deseas eliminar este registro de venta?")) {
          setVentas(prev => prev.filter(v => v.id !== id));
          showToast("Venta eliminada del historial.", "info");
        }
      };

      // Filtrado por fecha
      const ventasFiltradas = ventas.filter(v => {
        const prod = productos.find(p => p.id === v.productoId);
        const matchNombre = prod ? prod.nombre.toLowerCase().includes(busqueda.toLowerCase()) : false;

        if (!matchNombre && busqueda) return false;

        const hoyStr = new Date().toISOString().split("T")[0];
        if (filtroPeriodo === "Hoy") {
          return v.fecha === hoyStr;
        } else if (filtroPeriodo === "Mes") {
          return v.fecha && v.fecha.slice(0, 7) === hoyStr.slice(0, 7);
        } else if (filtroPeriodo === "Año") {
          return v.fecha && v.fecha.slice(0, 4) === hoyStr.slice(0, 4);
        }
        return true;
      });

      // Totales del periodo
      const totalesPeriodo = useMemo(() => {
        let totalIngresos = 0;
        let totalCostos = 0;
        let unidades = 0;

        ventasFiltradas.forEach(v => {
          const ing = (v.precioUnitario || 0) * (v.cantidad || 0);
          const cos = (v.costoUnitario || 0) * (v.cantidad || 0);
          totalIngresos += ing;
          totalCostos += cos;
          unidades += v.cantidad || 0;
        });

        const ganancia = totalIngresos - totalCostos;
        const margen = totalIngresos > 0 ? (ganancia / totalIngresos) * 100 : 0;

        return { totalIngresos, totalCostos, ganancia, margen, unidades };
      }, [ventasFiltradas]);

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Registro de Ventas e Historial</h2>
              <p className="text-sm text-slate-500 mt-1">Ingresa tickets de venta rápidamente y consulta el historial con filtros de fecha.</p>
            </div>
          </div>

          {/* FORMULARIO RÁPIDO DE VENTA */}
          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <h3 className="font-bold text-slate-900 text-sm mb-3">Registrar Nueva Venta (Cero Fricción)</h3>
            <form onSubmit={handleRegistrarVenta} className="grid grid-cols-1 sm:grid-cols-5 gap-3">
              <div className="sm:col-span-2">
                <select
                  required
                  value={productoId}
                  onChange={e => setProductoId(e.target.value)}
                  className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-semibold bg-white focus:outline-none focus:ring-2 focus:ring-amber-500"
                >
                  <option value="">-- Selecciona Producto --</option>
                  {productos.map(p => (
                    <option key={p.id} value={p.id}>{p.nombre} ({formatMoney(p.precioVenta)})</option>
                  ))}
                </select>
              </div>

              <div>
                <input
                  type="number"
                  min="1"
                  required
                  placeholder="Cantidad"
                  value={cantidad}
                  onChange={e => setCantidad(e.target.value)}
                  className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-bold bg-white focus:outline-none focus:ring-2 focus:ring-amber-500"
                />
              </div>

              <div>
                <input
                  type="number"
                  step="any"
                  required
                  placeholder="Precio Unitario"
                  value={precioUnitario}
                  onChange={e => setPrecioUnitario(e.target.value)}
                  className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-bold bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 font-mono"
                />
              </div>

              <div>
                <button
                  type="submit"
                  className="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-sm transition"
                >
                  + Registrar Venta
                </button>
              </div>
            </form>
          </div>

          {/* RESUMEN DEL PERIODO FILTRADO */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-400 uppercase">Facturación Total</span>
              <p className="text-xl font-extrabold text-slate-900 font-mono mt-1">{formatMoney(totalesPeriodo.totalIngresos)}</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-slate-400 uppercase">Costo Insumos</span>
              <p className="text-xl font-extrabold text-slate-600 font-mono mt-1">{formatMoney(totalesPeriodo.totalCostos)}</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-emerald-600 uppercase">Ganancia Neta</span>
              <p className="text-xl font-extrabold text-emerald-600 font-mono mt-1">{formatMoney(totalesPeriodo.ganancia)}</p>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold text-indigo-600 uppercase">Margen Real</span>
              <p className="text-xl font-extrabold text-indigo-600 font-mono mt-1">{totalesPeriodo.margen.toFixed(1)}%</p>
            </div>
          </div>

          {/* FILTROS Y TABLA DE HISTORIAL */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3">
              <div className="flex items-center gap-2">
                {["Todos", "Hoy", "Mes", "Año"].map(p => (
                  <button
                    key={p}
                    onClick={() => setFiltroPeriodo(p)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                      filtroPeriodo === p ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                    }`}
                  >
                    {p === "Todos" ? "Todo el Historial" : p}
                  </button>
                ))}
              </div>

              <input
                type="text"
                placeholder="Filtrar por producto..."
                value={busqueda}
                onChange={e => setBusqueda(e.target.value)}
                className="px-3 py-1.5 rounded-lg border border-slate-200 text-xs w-full sm:w-60 focus:outline-none"
              />
            </div>

            {ventasFiltradas.length === 0 ? (
              <div className="p-12 text-center text-slate-400">
                <div className="text-3xl mb-2">💰</div>
                <p className="font-semibold text-slate-700">No hay ventas en este período</p>
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200 text-xs uppercase tracking-wider">
                    <tr>
                      <th className="py-3 px-4">Fecha</th>
                      <th className="py-3 px-4">Producto</th>
                      <th className="py-3 px-4 text-center">Cant.</th>
                      <th className="py-3 px-4 text-right">Precio Venta</th>
                      <th className="py-3 px-4 text-right">Total Facturado</th>
                      <th className="py-3 px-4 text-right">Ganancia Neta</th>
                      <th className="py-3 px-4 text-center">Acciones</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {ventasFiltradas.map(v => {
                      const prod = productos.find(p => p.id === v.productoId);
                      const totalVenta = (v.precioUnitario || 0) * (v.cantidad || 0);
                      const totalCosto = (v.costoUnitario || 0) * (v.cantidad || 0);
                      const ganancia = totalVenta - totalCosto;

                      return (
                        <tr key={v.id} className="hover:bg-slate-50/70 transition">
                          <td className="py-3 px-4 text-xs text-slate-500 font-mono">{v.fecha}</td>
                          <td className="py-3 px-4 font-semibold text-slate-800">{prod?.nombre || "Producto eliminado"}</td>
                          <td className="py-3 px-4 text-center font-bold text-slate-700">{v.cantidad}</td>
                          <td className="py-3 px-4 text-right font-mono text-slate-600">{formatMoney(v.precioUnitario)}</td>
                          <td className="py-3 px-4 text-right font-mono font-bold text-slate-900">{formatMoney(totalVenta)}</td>
                          <td className="py-3 px-4 text-right font-mono font-bold text-emerald-600">+{formatMoney(ganancia)}</td>
                          <td className="py-3 px-4 text-center">
                            <button
                              onClick={() => handleDeleteVenta(v.id)}
                              className="text-slate-400 hover:text-rose-600 text-xs font-semibold"
                            >
                              Eliminar
                            </button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. SECCIÓN: DASHBOARD & ANALÍTICA SAAS
    // ==========================================
    function DashboardView({ insumos, productos, ventas, producciones, calculateProductCost, setActiveTab }) {
      const [timeRange, setTimeRange] = useState("mes"); // dia, mes, anio, todo
      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      // Métricas Principales
      const metrics = useMemo(() => {
        const hoyStr = new Date().toISOString().split("T")[0];
        const mesStr = hoyStr.slice(0, 7);
        const anioStr = hoyStr.slice(0, 4);

        const ventasFiltradas = ventas.filter(v => {
          if (timeRange === "dia") return v.fecha === hoyStr;
          if (timeRange === "mes") return v.fecha && v.fecha.slice(0, 7) === mesStr;
          if (timeRange === "anio") return v.fecha && v.fecha.slice(0, 4) === anioStr;
          return true;
        });

        let ingresosBrutos = 0;
        let cogs = 0;
        let unidadesVendidas = 0;

        ventasFiltradas.forEach(v => {
          const subtotal = (v.precioUnitario || 0) * (v.cantidad || 0);
          const costo = (v.costoUnitario || 0) * (v.cantidad || 0);
          ingresosBrutos += subtotal;
          cogs += costo;
          unidadesVendidas += v.cantidad || 0;
        });

        const gananciaNeta = ingresosBrutos - cogs;
        const margenPorcentaje = ingresosBrutos > 0 ? (gananciaNeta / ingresosBrutos) * 100 : 0;

        // Análisis por producto (Rentabilidad y Más Vendidos)
        const porProducto = {};
        ventas.forEach(v => {
          if (!porProducto[v.productoId]) {
            porProducto[v.productoId] = { unidades: 0, facturado: 0, costoTotal: 0 };
          }
          porProducto[v.productoId].unidades += v.cantidad || 0;
          porProducto[v.productoId].facturado += (v.precioUnitario || 0) * (v.cantidad || 0);
          porProducto[v.productoId].costoTotal += (v.costoUnitario || 0) * (v.cantidad || 0);
        });

        const rankingList = productos.map(prod => {
          const stats = porProducto[prod.id] || { unidades: 0, facturado: 0, costoTotal: 0 };
          const c = calculateProductCost(prod);
          const gananciaTotal = stats.facturado - stats.costoTotal;

          return {
            id: prod.id,
            nombre: prod.nombre,
            unidadesVendidas: stats.unidades,
            facturado: stats.facturado,
            gananciaTotal,
            margenPorcentaje: c.margenPorcentaje,
            gananciaUnitaria: c.gananciaUnitaria,
            costoUnitario: c.costoUnitario,
            precioVenta: prod.precioVenta,
          };
        });

        // Top más rentable en $ y %
        const topRentableDinero = [...rankingList].sort((a, b) => b.gananciaUnitaria - a.gananciaUnitaria)[0];
        const topRentableMargen = [...rankingList].sort((a, b) => b.margenPorcentaje - a.margenPorcentaje)[0];
        const topMasVendido = [...rankingList].sort((a, b) => b.unidadesVendidas - a.unidadesVendidas)[0];

        return {
          ingresosBrutos,
          cogs,
          gananciaNeta,
          margenPorcentaje,
          unidadesVendidas,
          rankingList,
          topRentableDinero,
          topRentableMargen,
          topMasVendido,
          ventasFiltradas
        };
      }, [ventas, productos, timeRange]);

      // Renderizar Gráfico de Chart.js
      useEffect(() => {
        if (!chartRef.current) return;

        // Agrupar ventas por fecha
        const ventasPorFecha = {};
        const fechasOrdenadas = [...ventas]
          .sort((a, b) => new Date(a.fecha) - new Date(b.fecha))
          .slice(-14); // últimos 14 registros

        fechasOrdenadas.forEach(v => {
          const f = v.fecha || "Sin fecha";
          if (!ventasPorFecha[f]) {
            ventasPorFecha[f] = { ingresos: 0, ganancias: 0 };
          }
          const subtotal = (v.precioUnitario || 0) * (v.cantidad || 0);
          const costo = (v.costoUnitario || 0) * (v.cantidad || 0);
          ventasPorFecha[f].ingresos += subtotal;
          ventasPorFecha[f].ganancias += (subtotal - costo);
        });

        const labels = Object.keys(ventasPorFecha);
        const dataIngresos = labels.map(l => ventasPorFecha[l].ingresos);
        const dataGanancias = labels.map(l => ventasPorFecha[l].ganancias);

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const ctx = chartRef.current.getContext("2d");
        chartInstanceRef.current = new Chart(ctx, {
          type: "bar",
          data: {
            labels: labels.length ? labels : ["Sin datos"],
            datasets: [
              {
                label: "Ventas Brutas ($)",
                data: dataIngresos.length ? dataIngresos : [0],
                backgroundColor: "rgba(217, 119, 6, 0.8)",
                borderRadius: 6,
              },
              {
                label: "Ganancia Neta ($)",
                data: dataGanancias.length ? dataGanancias : [0],
                backgroundColor: "rgba(34, 197, 94, 0.85)",
                borderRadius: 6,
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: "top" }
            },
            scales: {
              y: { beginAtZero: true }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }
        };
      }, [ventas, timeRange]);

      return (
        <div className="space-y-8">
          {/* Top Banner de Bienvenida y Selector Temporal */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Panel de Control & Finanzas</h2>
              <p className="text-sm text-slate-500 mt-1">Visión consolidada de tus ingresos, costos de producción y rentabilidad.</p>
            </div>

            <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl">
              {[
                { id: "dia", label: "Hoy" },
                { id: "mes", label: "Este Mes" },
                { id: "anio", label: "Este Año" },
                { id: "todo", label: "Histórico" },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTimeRange(t.id)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                    timeRange === t.id ? "bg-white text-slate-900 shadow-sm" : "text-slate-600 hover:text-slate-900"
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </div>

          {/* KPI CARDS SAAS */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold uppercase text-slate-500">Ingresos Brutos</span>
              <p className="text-2xl font-extrabold text-slate-900 font-mono mt-1">{formatMoney(metrics.ingresosBrutos)}</p>
              <span className="text-[11px] text-slate-400">Total facturado en el periodo</span>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold uppercase text-slate-500">Costo de Insumos (COGS)</span>
              <p className="text-2xl font-extrabold text-slate-700 font-mono mt-1">{formatMoney(metrics.cogs)}</p>
              <span className="text-[11px] text-slate-400">Materias primas y empaque</span>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm bg-gradient-to-br from-emerald-50/50 to-white">
              <span className="text-xs font-bold uppercase text-emerald-700">Utilidad Neta Real</span>
              <p className="text-2xl font-extrabold text-emerald-600 font-mono mt-1">{formatMoney(metrics.gananciaNeta)}</p>
              <span className="text-[11px] text-emerald-600/80 font-medium">Margen promedio: {metrics.margenPorcentaje.toFixed(1)}%</span>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold uppercase text-amber-700">Volumen de Producción</span>
              <p className="text-2xl font-extrabold text-amber-600 font-mono mt-1">{metrics.unidadesVendidas} <span className="text-sm font-normal text-slate-500">unid.</span></p>
              <span className="text-[11px] text-slate-400">Vendidas en este rango</span>
            </div>
          </div>

          {/* GRÁFICO HISTÓRICO DE VENTAS VS GANANCIAS */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h3 className="font-bold text-slate-900 text-base mb-1">Evolución de Ventas vs. Ganancia Neta</h3>
            <p className="text-xs text-slate-500 mb-4">Compara el dinero ingresado con el beneficio neto real obtenido.</p>
            <div className="h-64 w-full">
              <canvas ref={chartRef}></canvas>
            </div>
          </div>

          {/* ANÁLISIS DE RENTABILIDAD & MÁS VENDIDO */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* Tarjeta Producto Mayor Margen $ */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-[11px] font-bold uppercase text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200">
                👑 Mayor Utilidad por Unidad ($)
              </span>
              <h4 className="font-bold text-slate-900 text-lg mt-3">
                {metrics.topRentableDinero?.nombre || "Sin datos"}
              </h4>
              <p className="text-xs text-slate-500 mt-1">Es el producto que deja más dinero en caja por cada unidad vendida.</p>
              <div className="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center font-mono">
                <span className="text-xs text-slate-500">Ganancia:</span>
                <span className="text-base font-extrabold text-emerald-600">
                  +{formatMoney(metrics.topRentableDinero?.gananciaUnitaria)}
                </span>
              </div>
            </div>

            {/* Tarjeta Producto Mayor Margen % */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-[11px] font-bold uppercase text-indigo-700 bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-200">
                ⭐ Mayor Margen Porcentual (%)
              </span>
              <h4 className="font-bold text-slate-900 text-lg mt-3">
                {metrics.topRentableMargen?.nombre || "Sin datos"}
              </h4>
              <p className="text-xs text-slate-500 mt-1">El producto más eficiente en relación costo-precio.</p>
              <div className="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center font-mono">
                <span className="text-xs text-slate-500">Margen:</span>
                <span className="text-base font-extrabold text-indigo-600">
                  {metrics.topRentableMargen?.margenPorcentaje.toFixed(1)}%
                </span>
              </div>
            </div>

            {/* Tarjeta Producto Más Vendido */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-[11px] font-bold uppercase text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-full border border-amber-200">
                🔥 Mayor Aceptación (Top Ventas)
              </span>
              <h4 className="font-bold text-slate-900 text-lg mt-3">
                {metrics.topMasVendido?.nombre || "Sin datos"}
              </h4>
              <p className="text-xs text-slate-500 mt-1">El producto preferido por tus clientes en volumen.</p>
              <div className="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center font-mono">
                <span className="text-xs text-slate-500">Unidades vendidas:</span>
                <span className="text-base font-extrabold text-amber-600">
                  {metrics.topMasVendido?.unidadesVendidas || 0} unid.
                </span>
              </div>
            </div>
          </div>

          {/* TABLA COMPARATIVA DE RENTABILIDAD TOTAL */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-5 border-b border-slate-200">
              <h3 className="font-bold text-slate-900 text-base">Tabla de Rentabilidad y Aceptación por Producto</h3>
              <p className="text-xs text-slate-500 mt-0.5">Analiza el aporte individual de cada producto a la utilidad del negocio.</p>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead className="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200 text-xs uppercase tracking-wider">
                  <tr>
                    <th className="py-3 px-4">Producto</th>
                    <th className="py-3 px-4 text-right">Costo Unit.</th>
                    <th className="py-3 px-4 text-right">P. Venta</th>
                    <th className="py-3 px-4 text-right">Margen %</th>
                    <th className="py-3 px-4 text-center">Unid. Vendidas</th>
                    <th className="py-3 px-4 text-right">Facturación</th>
                    <th className="py-3 px-4 text-right">Ganancia Acumulada</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {metrics.rankingList.map(item => (
                    <tr key={item.id} className="hover:bg-slate-50/70 transition">
                      <td className="py-3 px-4 font-semibold text-slate-800">{item.nombre}</td>
                      <td className="py-3 px-4 text-right font-mono text-xs text-slate-500">{formatMoney(item.costoUnitario)}</td>
                      <td className="py-3 px-4 text-right font-mono text-xs font-semibold text-slate-800">{formatMoney(item.precioVenta)}</td>
                      <td className="py-3 px-4 text-right font-mono font-bold text-indigo-600">{item.margenPorcentaje.toFixed(1)}%</td>
                      <td className="py-3 px-4 text-center font-bold text-slate-700">{item.unidadesVendidas}</td>
                      <td className="py-3 px-4 text-right font-mono font-semibold text-slate-900">{formatMoney(item.facturado)}</td>
                      <td className="py-3 px-4 text-right font-mono font-bold text-emerald-600">+{formatMoney(item.gananciaTotal)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // Montar Aplicación
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
