<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GastroFlow - Gestión de Costos, Inventario y Producción</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fbf7ee',
              100: '#f5edd6',
              500: '#d97706',
              600: '#b45309',
              700: '#92400e',
            },
            primary: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js para visualizaciones financieras -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Estilos de barra de scroll sutil */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <!-- SCRIPT DE LA APLICACIÓN REACT -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- DATOS DEMO INICIALES (MODO EJEMPLO) ---
    const INITIAL_INSUMOS = [
      { id: "ins-1", nombre: "Harina de Trigo Especial", categoria: "Materia Prima", unidad: "g", costoUnitario: 0.0018, stock: 8500, stockMinimo: 2000 },
      { id: "ins-2", nombre: "Mantequilla sin Sal", categoria: "Materia Prima", unidad: "g", costoUnitario: 0.012, stock: 3200, stockMinimo: 1000 },
      { id: "ins-3", nombre: "Chispas de Chocolate 60%", categoria: "Materia Prima", unidad: "g", costoUnitario: 0.015, stock: 2400, stockMinimo: 800 },
      { id: "ins-4", nombre: "Azúcar Morena", categoria: "Materia Prima", unidad: "g", costoUnitario: 0.0022, stock: 4500, stockMinimo: 1500 },
      { id: "ins-5", nombre: "Huevos de Campo", categoria: "Materia Prima", unidad: "unidad", costoUnitario: 0.25, stock: 60, stockMinimo: 24 },
      { id: "ins-6", nombre: "Caja Kraft 6 Galletas", categoria: "Empaque", unidad: "unidad", costoUnitario: 0.45, stock: 80, stockMinimo: 30 },
      { id: "ins-7", nombre: "Sticker Logo Laminado", categoria: "Empaque", unidad: "unidad", costoUnitario: 0.08, stock: 250, stockMinimo: 50 },
      { id: "ins-8", nombre: "Carne de Res Molida 80/20", categoria: "Materia Prima", unidad: "g", costoUnitario: 0.011, stock: 4000, stockMinimo: 1500 },
      { id: "ins-9", nombre: "Pan Brioche Artesanal", categoria: "Materia Prima", unidad: "unidad", costoUnitario: 0.60, stock: 40, stockMinimo: 15 },
      { id: "ins-10", nombre: "Caja Clamshell Hamburguesa", categoria: "Empaque", unidad: "unidad", costoUnitario: 0.35, stock: 50, stockMinimo: 20 },
    ];

    const INITIAL_PRODUCTOS = [
      {
        id: "prod-1",
        nombre: "Pack 6 Galletas Choco-Chips",
        categoria: "Pastelería",
        unidadesPorLote: 6, // 1 lote rinde 6 packs (ej: 36 galletas en total)
        precioVenta: 7.50,
        items: [
          { insumoId: "ins-1", cantidad: 600 },   // 600g harina
          { insumoId: "ins-2", cantidad: 350 },   // 350g mantequilla
          { insumoId: "ins-3", cantidad: 300 },   // 300g chocolate
          { insumoId: "ins-4", cantidad: 250 },   // 250g azúcar
          { insumoId: "ins-5", cantidad: 3 },     // 3 huevos
          { insumoId: "ins-6", cantidad: 6 },     // 6 cajas
          { insumoId: "ins-7", cantidad: 6 },     // 6 stickers
        ]
      },
      {
        id: "prod-2",
        nombre: "Hamburguesa Smash Doble",
        categoria: "Gastronomía",
        unidadesPorLote: 10, // 1 lote = 10 hamburguesas
        precioVenta: 8.90,
        items: [
          { insumoId: "ins-8", cantidad: 1800 }, // 1800g carne (180g por hamburguesa)
          { insumoId: "ins-9", cantidad: 10 },   // 10 panes
          { insumoId: "ins-10", cantidad: 10 },  // 10 cajas
          { insumoId: "ins-7", cantidad: 10 },   // 10 stickers
        ]
      }
    ];

    const INITIAL_VENTAS = [
      { id: "v-1", productoId: "prod-1", cantidad: 4, precioUnitario: 7.50, costoUnitario: 2.76, fecha: new Date(Date.now() - 86400000 * 2).toISOString().split('T')[0] },
      { id: "v-2", productoId: "prod-2", cantidad: 8, precioUnitario: 8.90, costoUnitario: 3.12, fecha: new Date(Date.now() - 86400000).toISOString().split('T')[0] },
      { id: "v-3", productoId: "prod-1", cantidad: 5, precioUnitario: 7.50, costoUnitario: 2.76, fecha: new Date().toISOString().split('T')[0] },
      { id: "v-4", productoId: "prod-2", cantidad: 12, precioUnitario: 8.90, costoUnitario: 3.12, fecha: new Date().toISOString().split('T')[0] },
    ];

    // Helper de formato monetario
    const formatMoney = (amount) => {
      return "$" + Number(amount || 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    function App() {
      // Estado de navegación
      const [activeTab, setActiveTab] = useState("dashboard");

      // Datos persistentes en LocalStorage
      const [insumos, setInsumos] = useState(() => {
        const saved = localStorage.getItem("gf_insumos");
        return saved ? JSON.parse(saved) : INITIAL_INSUMOS;
      });

      const [productos, setProductos] = useState(() => {
        const saved = localStorage.getItem("gf_productos");
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTOS;
      });

      const [ventas, setVentas] = useState(() => {
        const saved = localStorage.getItem("gf_ventas");
        return saved ? JSON.parse(saved) : INITIAL_VENTAS;
      });

      const [producciones, setProducciones] = useState(() => {
        const saved = localStorage.getItem("gf_producciones");
        return saved ? JSON.parse(saved) : [];
      });

      // Notificaciones Toast
      const [toast, setToast] = useState(null);
      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Guardado automático en localStorage
      useEffect(() => {
        localStorage.setItem("gf_insumos", JSON.stringify(insumos));
      }, [insumos]);

      useEffect(() => {
        localStorage.setItem("gf_productos", JSON.stringify(productos));
      }, [productos]);

      useEffect(() => {
        localStorage.setItem("gf_ventas", JSON.stringify(ventas));
      }, [ventas]);

      useEffect(() => {
        localStorage.setItem("gf_producciones", JSON.stringify(producciones));
      }, [producciones]);

      // Alertas de Stock Bajo
      const stockAlerts = useMemo(() => {
        return insumos.filter(i => i.stock <= i.stockMinimo);
      }, [insumos]);

      // Función para calcular costo de un producto
      const calculateProductCost = (prod) => {
        let totalLote = 0;
        let costoIngredientes = 0;
        let costoEmpaques = 0;

        (prod.items || []).forEach(item => {
          const insumo = insumos.find(i => i.id === item.insumoId);
          if (insumo) {
            const costoItem = (insumo.costoUnitario || 0) * (item.cantidad || 0);
            totalLote += costoItem;
            if (insumo.categoria === "Empaque") {
              costoEmpaques += costoItem;
            } else {
              costoIngredientes += costoItem;
            }
          }
        });

        const unidades = prod.unidadesPorLote > 0 ? prod.unidadesPorLote : 1;
        const costoUnitario = totalLote / unidades;
        const precioVenta = prod.precioVenta || 0;
        const gananciaUnitaria = precioVenta - costoUnitario;
        const margenPorcentaje = precioVenta > 0 ? (gananciaUnitaria / precioVenta) * 100 : 0;

        return {
          totalLote,
          costoUnitario,
          costoIngredientes,
          costoEmpaques,
          gananciaUnitaria,
          margenPorcentaje,
        };
      };

      // Restablecer aplicación (Modo Virgen o Recarga de Demostración)
      const resetToVirgin = () => {
        if (confirm("¿Deseas vaciar todos los datos y dejar la aplicación en modo virgen (en blanco)?")) {
          setInsumos([]);
          setProductos([]);
          setVentas([]);
          setProducciones([]);
          showToast("Aplicación restablecida en modo virgen.", "info");
        }
      };

      const loadDemoData = () => {
        if (confirm("¿Deseas recargar los datos de ejemplo predeterminados?")) {
          setInsumos(INITIAL_INSUMOS);
          setProductos(INITIAL_PRODUCTOS);
          setVentas(INITIAL_VENTAS);
          setProducciones([]);
          showToast("Datos de ejemplo cargados con éxito.");
        }
      };

      const exportBackup = () => {
        const data = { insumos, productos, ventas, producciones, exportDate: new Date() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `GastroFlow_Backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        showToast("Copia de seguridad exportada con éxito.");
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl text-white font-medium text-sm transition-all transform animate-bounce ${
              toast.type === "error" ? "bg-rose-600" : toast.type === "info" ? "bg-slate-800" : "bg-emerald-600"
            }`}>
              <span>{toast.message}</span>
            </div>
          )}

          {/* TOPBAR / NAVBAR */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center h-16">
                {/* Logo & Marca */}
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-white shadow-md shadow-amber-500/20 font-bold text-xl">
                    🥗
                  </div>
                  <div>
                    <span className="font-extrabold text-slate-900 tracking-tight text-lg">Gastro<span className="text-amber-600">Flow</span></span>
                    <span className="hidden sm:inline-block ml-2 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-amber-50 text-amber-700 border border-amber-200 rounded-full">Costos & Lotes</span>
                  </div>
                </div>

                {/* Navegación Desktop */}
                <nav className="hidden md:flex space-x-1">
                  {[
                    { id: "dashboard", label: "Dashboard", icon: "📊" },
                    { id: "insumos", label: "Insumos & Empaques", icon: "📦" },
                    { id: "inventario", label: "Inventario & Producción", icon: "⚡", badge: stockAlerts.length > 0 ? stockAlerts.length : null },
                    { id: "recetas", label: "Recetas & Costeo", icon: "🧾" },
                    { id: "ventas", label: "Ventas & Historial", icon: "💰" },
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`relative flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-semibold transition-all ${
                        activeTab === tab.id
                          ? "bg-amber-50 text-amber-900 shadow-sm border border-amber-200/60"
                          : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"
                      }`}
                    >
                      <span>{tab.icon}</span>
                      <span>{tab.label}</span>
                      {tab.badge && (
                        <span className="ml-1 px-1.5 py-0.2 text-[11px] font-bold bg-rose-500 text-white rounded-full">
                          {tab.badge}
                        </span>
                      )}
                    </button>
                  ))}
                </nav>

                {/* Utilidades de Respaldo y Modo Virgen */}
                <div className="flex items-center gap-2">
                  <div className="relative group">
                    <button
                      title="Opciones de Base de Datos"
                      className="p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-lg text-sm flex items-center gap-1.5 border border-slate-200"
                    >
                      ⚙️ <span className="hidden sm:inline text-xs font-semibold">Datos</span>
                    </button>
                    <div className="absolute right-0 mt-1 w-48 bg-white border border-slate-200 rounded-xl shadow-lg p-1.5 hidden group-hover:block z-50">
                      <button
                        onClick={exportBackup}
                        className="w-full text-left px-3 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50 rounded-lg flex items-center gap-2"
                      >
                        💾 Exportar Respaldo
                      </button>
                      <button
                        onClick={loadDemoData}
                        className="w-full text-left px-3 py-2 text-xs font-medium text-amber-700 hover:bg-amber-50 rounded-lg flex items-center gap-2"
                      >
                        🔄 Cargar Datos Demo
                      </button>
                      <hr className="my-1 border-slate-100" />
                      <button
                        onClick={resetToVirgin}
                        className="w-full text-left px-3 py-2 text-xs font-medium text-rose-600 hover:bg-rose-50 rounded-lg flex items-center gap-2"
                      >
                        🗑️ Limpiar Todo (Virgen)
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Mobile Tabbar */}
            <div className="md:hidden flex overflow-x-auto px-2 py-2 border-t border-slate-100 space-x-1">
              {[
                { id: "dashboard", label: "Dashboard", icon: "📊" },
                { id: "insumos", label: "Insumos", icon: "📦" },
                { id: "inventario", label: "Producción", icon: "⚡" },
                { id: "recetas", label: "Recetas", icon: "🧾" },
                { id: "ventas", label: "Ventas", icon: "💰" },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold ${
                    activeTab === tab.id ? "bg-amber-500 text-white" : "text-slate-600 bg-slate-100"
                  }`}
                >
                  <span>{tab.icon}</span>
                  <span>{tab.label}</span>
                </button>
              ))}
            </div>
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === "dashboard" && (
              <DashboardView
                insumos={insumos}
                productos={productos}
                ventas={ventas}
                producciones={producciones}
                calculateProductCost={calculateProductCost}
                setActiveTab={setActiveTab}
              />
            )}

            {activeTab === "insumos" && (
              <InsumosView
                insumos={insumos}
                setInsumos={setInsumos}
                showToast={showToast}
              />
            )}

            {activeTab === "inventario" && (
              <InventarioProduccionView
                insumos={insumos}
                setInsumos={setInsumos}
                productos={productos}
                producciones={producciones}
                setProducciones={setProducciones}
                showToast={showToast}
              />
            )}

            {activeTab === "recetas" && (
              <RecetasCostosView
                productos={productos}
                setProductos={setProductos}
                insumos={insumos}
                calculateProductCost={calculateProductCost}
                showToast={showToast}
                setActiveTab={setActiveTab}
              />
            )}

            {activeTab === "ventas" && (
              <VentasHistorialView
                ventas={ventas}
                setVentas={setVentas}
                productos={productos}
                calculateProductCost={calculateProductCost}
                showToast={showToast}
              />
            )}
          </main>

          {/* FOOTER */}
          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
            GastroFlow SaaS &bull; Diseñado para Gastronomía, Obradores y Pequeños Negocios &bull; Todos los datos se guardan automáticamente en tu navegador.
          </footer>
        </div>
      );
    }

    // ==========================================
    // 1. SECCIÓN: INSUMOS (MATERIA PRIMA Y EMPAQUE)
    // ==========================================
    function InsumosView({ insumos, setInsumos, showToast }) {
      const [filtroCategoria, setFiltroCategoria] = useState("Todos");
      const [busqueda, setBusqueda] = useState("");
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);

      // Formulario
      const [nombre, setNombre] = useState("");
      const [categoria, setCategoria] = useState("Materia Prima");
      const [unidad, setUnidad] = useState("g");
      const [costoUnitario, setCostoUnitario] = useState("");
      const [stock, setStock] = useState("");
      const [stockMinimo, setStockMinimo] = useState("");

      // Calculadora de compra mayorista
      const [usarCalculadora, setUsarCalculadora] = useState(false);
      const [precioPaquete, setPrecioPaquete] = useState("");
      const [tamanoPaquete, setTamanoPaquete] = useState("");

      const handleCalcularCostoUnitario = () => {
        const p = parseFloat(precioPaquete);
        const t = parseFloat(tamanoPaquete);
        if (p > 0 && t > 0) {
          const resultado = p / t;
          setCostoUnitario(resultado.toFixed(6));
        }
      };

      const handleOpenModal = (insumo = null) => {
        if (insumo) {
          setEditingId(insumo.id);
          setNombre(insumo.nombre);
          setCategoria(insumo.categoria);
          setUnidad(insumo.unidad);
          setCostoUnitario(insumo.costoUnitario);
          setStock(insumo.stock);
          setStockMinimo(insumo.stockMinimo);
        } else {
          setEditingId(null);
          setNombre("");
          setCategoria("Materia Prima");
          setUnidad("g");
          setCostoUnitario("");
          setStock(0);
          setStockMinimo(500);
        }
        setUsarCalculadora(false);
        setPrecioPaquete("");
        setTamanoPaquete("");
        setIsModalOpen(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!nombre.trim() || !costoUnitario || parseFloat(costoUnitario) <= 0) {
          alert("Por favor ingresa un nombre y un costo unitario válido.");
          return;
        }

        const data = {
          nombre: nombre.trim(),
          categoria,
          unidad,
          costoUnitario: parseFloat(costoUnitario),
          stock: parseFloat(stock) || 0,
          stockMinimo: parseFloat(stockMinimo) || 0,
        };

        if (editingId) {
          setInsumos(prev => prev.map(item => item.id === editingId ? { ...item, ...data } : item));
          showToast("Insumo actualizado con éxito.");
        } else {
          const nuevo = { id: "ins-" + Date.now(), ...data };
          setInsumos(prev => [...prev, nuevo]);
          showToast("Nuevo insumo registrado.");
        }
        setIsModalOpen(false);
      };

      const handleDelete = (id, nombreInsumo) => {
        if (confirm(`¿Estás seguro de eliminar el insumo "${nombreInsumo}"?`)) {
          setInsumos(prev => prev.filter(item => item.id !== id));
          showToast("Insumo eliminado.", "info");
        }
      };

      const insumosFiltrados = insumos.filter(item => {
        const matchCat = filtroCategoria === "Todos" || item.categoria === filtroCategoria;
        const matchBusq = item.nombre.toLowerCase().includes(busqueda.toLowerCase());
        return matchCat && matchBusq;
      });

      return (
        <div className="space-y-6">
          {/* Header de la sección */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Gestión de Insumos & Empaques</h2>
              <p className="text-sm text-slate-500 mt-1">Registra materias primas comestibles y elementos de presentación con su costo base.</p>
            </div>
            <button
              onClick={() => handleOpenModal()}
              className="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-semibold rounded-xl shadow-sm transition-all"
            >
              <span className="text-lg">+</span> Nuevo Insumo
            </button>
          </div>

          {/* Filtros y Búsqueda */}
          <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-2 w-full sm:w-auto">
              {["Todos", "Materia Prima", "Empaque"].map(cat => (
                <button
                  key={cat}
                  onClick={() => setFiltroCategoria(cat)}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                    filtroCategoria === cat
                      ? "bg-slate-900 text-white"
                      : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-100"
                  }`}
                >
                  {cat === "Todos" ? "Todos los Insumos" : cat}
                </button>
              ))}
            </div>
            <div className="w-full sm:w-72">
              <input
                type="text"
                placeholder="Buscar insumo..."
                value={busqueda}
                onChange={(e) => setBusqueda(e.target.value)}
                className="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white"
              />
            </div>
          </div>

          {/* Tabla de Insumos */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            {insumosFiltrados.length === 0 ? (
              <div className="p-12 text-center text-slate-400">
                <div className="text-4xl mb-3">📦</div>
                <p className="font-semibold text-slate-700">No hay insumos registrados</p>
                <p className="text-xs text-slate-500 mt-1">Haz clic en "+ Nuevo Insumo" para empezar a costear tus productos.</p>
              </div>
            ) : (
              <div className="overflow-x-auto">

    // ==========================================
    // 2. SECCIÓN: INVENTARIO & PRODUCCIÓN INTELIGENTE
    // ==========================================
    function InventarioProduccionView({ insumos, setInsumos, productos, producciones, setProducciones, showToast }) {
      // Estado para compra rápida de stock
      const [insumoEntradaId, setInsumoEntradaId] = useState("");
      const [cantidadEntrada, setCantidadEntrada] = useState("");

      // Estado para Producción por Lotes
      const [selectedProductoId, setSelectedProductoId] = useState("");
      const [lotesAProducir, setLotesAProducir] = useState(1);

      // Entrada rápida de inventario
      const handleEntradaStock = (e) => {
        e.preventDefault();
        const cant = parseFloat(cantidadEntrada);
        if (!insumoEntradaId || cant <= 0) {
          alert("Selecciona un insumo e ingresa una cantidad válida.");
          return;
        }

        setInsumos(prev => prev.map(ins => {
          if (ins.id === insumoEntradaId) {
            return { ...ins, stock: (ins.stock || 0) + cant };
          }
          return ins;
        }));

        const target = insumos.find(i => i.id === insumoEntradaId);
        showToast(`Stock actualizado: +${cant} ${target?.unidad} de ${target?.nombre}`);
        setCantidadEntrada("");
      };

      // Cálculo de Validación Inteligente de Stock
      const productoSeleccionado = productos.find(p => p.id === selectedProductoId);

      const validacionStock = useMemo(() => {
        if (!productoSeleccionado || lotesAProducir <= 0) return null;

        const detalle = (productoSeleccionado.items || []).map(item => {
          const insumo = insumos.find(i => i.id === item.insumoId);
          const cantidadRequerida = (item.cantidad || 0) * lotesAProducir;
          const stockActual = insumo ? insumo.stock : 0;
          const falta = Math.max(0, cantidadRequerida - stockActual);
          const esSuficiente = stockActual >= cantidadRequerida;

          return {
            insumoId: item.insumoId,
            nombre: insumo ? insumo.nombre : "Insumo no encontrado",
            unidad: insumo ? insumo.unidad : "",
            requerida: cantidadRequerida,
            disponible: stockActual,
            falta,
            esSuficiente
          };
        });

        const hayFaltantes = detalle.some(d => !d.esSuficiente);

        return { detalle, hayFaltantes };
      }, [productoSeleccionado, lotesAProducir, insumos]);

      // Confirmar Producción y Descontar Stock
      const handleConfirmarProduccion = () => {
        if (!validacionStock) return;
        if (validacionStock.hayFaltantes) {
          alert("No puedes procesar la producción. Faltan insumos en el inventario.");
          return;
        }

        // Descontar del inventario
        setInsumos(prev => prev.map(insumo => {
          const itemReq = validacionStock.detalle.find(d => d.insumoId === insumo.id);
          if (itemReq) {
            return { ...insumo, stock: Math.max(0, insumo.stock - itemReq.requerida) };
          }
          return insumo;
        }));

        // Registrar en historial de producción
        const nuevaProd = {
          id: "prod-log-" + Date.now(),
          productoNombre: productoSeleccionado.nombre,
          lotes: lotesAProducir,
          unidadesTotales: (productoSeleccionado.unidadesPorLote || 1) * lotesAProducir,
          fecha: new Date().toLocaleString("es-ES"),
        };
        setProducciones(prev => [nuevaProd, ...prev]);

        showToast(`¡Lote producido con éxito! Se descontó el inventario correspondiente.`);
        setLotesAProducir(1);
      };

      return (
        <div className="space-y-8">
          {/* Header */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Inventario & Producción por Lotes</h2>
              <p className="text-sm text-slate-500 mt-1">Supervisa existencias, registra compras y valida la disponibilidad antes de hornear o ensamblar.</p>
            </div>
            {/* Formulario Rápido de Compra / Entrada de Stock */}
            <form onSubmit={handleEntradaStock} className="flex flex-wrap items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
              <span className="text-xs font-bold text-slate-700 px-2">+ Entrada:</span>
              <select
                value={insumoEntradaId}
                onChange={e => setInsumoEntradaId(e.target.value)}
                className="px-3 py-1.5 rounded-lg border border-slate-200 text-xs bg-white focus:outline-none"
              >
                <option value="">Selecciona insumo...</option>
                {insumos.map(i => (
                  <option key={i.id} value={i.id}>{i.nombre} ({i.unidad})</option>
                ))}
              </select>
              <input
                type="number"
                step="any"
                placeholder="Cantidad"
                value={cantidadEntrada}
                onChange={e => setCantidadEntrada(e.target.value)}
                className="w-24 px-3 py-1.5 rounded-lg border border-slate-200 text-xs bg-white focus:outline-none"
              />
              <button
                type="submit"
                className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg transition"
              >
                Sumar Stock
              </button>
            </form>
          </div>

          {/* SIMULADOR Y VALIDADOR INTELIGENTE DE PRODUCCIÓN */}
          <div className="bg-gradient-to-br from-amber-500/10 via-white to-amber-500/5 rounded-2xl border border-amber-200/80 p-6 shadow-sm">
            <div className="flex items-center gap-2 mb-4">
              <span className="text-2xl">⚡</span>
              <div>
                <h3 className="text-lg font-bold text-slate-900">Validador Inteligente de Producción</h3>
                <p className="text-xs text-slate-600">Comprueba si tienes insumos suficientes antes de iniciar el lote y descuéntalos de una sola vez.</p>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
              <div className="md:col-span-2">
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Producto a Elaborar</label>
                <select
                  value={selectedProductoId}
                  onChange={e => setSelectedProductoId(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none"
                >
                  <option value="">-- Elige una receta para validar --</option>
                  {productos.map(p => (
                    <option key={p.id} value={p.id}>
                      {p.nombre} (1 Lote = {p.unidadesPorLote} unidades)
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Cantidad de Lotes</label>
                <div className="flex items-center gap-2">
                  <input
                    type="number"
                    min="1"
                    step="1"
                    value={lotesAProducir}
                    onChange={e => setLotesAProducir(Math.max(1, parseInt(e.target.value) || 1))}
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-bold bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none"
                  />
                  <span className="text-xs text-slate-500 font-semibold whitespace-nowrap">
                    = {(productoSeleccionado?.unidadesPorLote || 0) * lotesAProducir} unid.
                  </span>
                </div>
              </div>
            </div>

            {/* TABLA DE VALIDACIÓN EN TIEMPO REAL */}
            {validacionStock && (
              <div className="space-y-4">
                <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                  <table className="w-full text-left text-xs sm:text-sm">
                    <thead className="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
                      <tr>
                        <th className="py-2.5 px-4">Insumo Requerido</th>
                        <th className="py-2.5 px-4 text-center">Necesario ({lotesAProducir} lotes)</th>
                        <th className="py-2.5 px-4 text-center">Disponible</th>
                        <th className="py-2.5 px-4 text-center">Estado</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {validacionStock.detalle.map(d => (
                        <tr key={d.insumoId} className={d.esSuficiente ? "hover:bg-slate-50" : "bg-rose-50/50"}>
                          <td className="py-2.5 px-4 font-semibold text-slate-800">{d.nombre}</td>
                          <td className="py-2.5 px-4 text-center font-mono font-medium">{d.requerida.toLocaleString()} {d.unidad}</td>
                          <td className="py-2.5 px-4 text-center font-mono">{d.disponible.toLocaleString()} {d.unidad}</td>
                          <td className="py-2.5 px-4 text-center">
                            {d.esSuficiente ? (
                              <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">
                                ✓ Suficiente
                              </span>
                            ) : (
                              <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800">
                                ⚠ Faltan {d.falta.toLocaleString()} {d.unidad}
                              </span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                {/* BOTÓN O ALERTA DE PRODUCCIÓN */}
                {validacionStock.hayFaltantes ? (
                  <div className="p-4 rounded-xl bg-rose-100 border border-rose-200 text-rose-900 flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div className="flex items-center gap-2 text-sm font-semibold">
                      <span className="text-xl">🛑</span>
                      <span>No es posible producir: El inventario disponible es insuficiente para completar el lote.</span>
                    </div>
                    <button
                      disabled
                      className="px-5 py-2.5 bg-rose-300 text-rose-700 font-bold text-xs rounded-xl cursor-not-allowed uppercase"
                    >
                      Producción Bloqueada
                    </button>
                  </div>
                ) : (
                  <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div className="flex items-center gap-2 text-sm font-semibold">
                      <span className="text-xl">✅</span>
                      <span>¡Todo listo! Tienes suficiente inventario para producir {lotesAProducir} lote(s) ({(productoSeleccionado.unidadesPorLote || 0) * lotesAProducir} unidades).</span>
                    </div>
                    <button
                      onClick={handleConfirmarProduccion}
                      className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-md transition-all flex-shrink-0"
                    >
                      Confirmar y Descontar Stock
                    </button>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* TABLA PRINCIPAL DE NIVELES DE INVENTARIO */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-5 border-b border-slate-200 flex justify-between items-center">
              <h3 className="font-bold text-slate-900 text-base">Niveles de Stock Actuales</h3>
              <span className="text-xs text-slate-500 font-medium">Actualizado en tiempo real</span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead className="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200 text-xs uppercase tracking-wider">
                  <tr>
                    <th className="py-3 px-4">Insumo</th>
                    <th className="py-3 px-4">Tipo</th>
                    <th className="py-3 px-4 text-center">Disponible</th>
                    <th className="py-3 px-4 text-center">Mínimo</th>
                    <th className="py-3 px-4">Nivel Visual</th>
                    <th className="py-3 px-4 text-center">Alerta</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {insumos.map(item => {
                    const pct = Math.min(100, Math.round(((item.stock || 0) / ((item.stockMinimo || 1) * 2)) * 100));
                    const isLow = item.stock <= item.stockMinimo;
                    const isZero = item.stock <= 0;

                    return (
                      <tr key={item.id} className="hover:bg-slate-50/70 transition">
                        <td className="py-3 px-4 font-semibold text-slate-800">{item.nombre}</td>
                        <td className="py-3 px-4 text-xs text-slate-500">{item.categoria}</td>
                        <td className="py-3 px-4 text-center font-bold text-slate-900 font-mono">
                          {Number(item.stock).toLocaleString()} <span className="text-xs text-slate-400 font-normal">{item.unidad}</span>
                        </td>
                        <td className="py-3 px-4 text-center text-slate-500 font-mono text-xs">
                          {Number(item.stockMinimo).toLocaleString()} {item.unidad}
                        </td>
                        <td className="py-3 px-4 w-48">
                          <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                            <div
                              className={`h-2 rounded-full transition-all duration-500 ${
                                isZero ? "bg-rose-500 w-1" : isLow ? "bg-amber-500" : "bg-emerald-500"
                              }`}
                              style={{ width: `${pct}%` }}
                            ></div>
                          </div>
                        </td>
                        <td className="py-3 px-4 text-center">
                          {isZero ? (
                            <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-700">Agotado</span>
                          ) : isLow ? (
                            <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-700">Stock Bajo</span>
                          ) : (
                            <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700">Normal</span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
