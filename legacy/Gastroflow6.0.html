    // =========================================================================
    // 5. RECETARIO & COSTEO (EDICIÓN COMPLETA + ESCALADOR)
    // =========================================================================
    function RecetasView({ recetas, setRecetas, insumos, configuracion, dispararToast }) {
      const [recetaAbierta, setRecetaAbierta] = useState(recetas[0]?.id || null);
      const [escala, setEscala] = useState(1);
      const [recetaParaEditar, setRecetaParaEditar] = useState(null);
      const [modalNuevaReceta, setModalNuevaReceta] = useState(false);

      const calcularCostoDetallado = (receta, factorEscala = 1) => {
        const costoIngredientes = (receta.ingredientes || []).reduce((sum, ing) => {
          const ins = (insumos || []).find(i => i.id === ing.insumoId);
          return sum + (ins ? ins.costoUnitario * (ing.cantidad * factorEscala) : 0);
        }, 0);

        const costoMerma = costoIngredientes * ((receta.mermaPorcentaje || 0) / 100);
        const subtotalMateriaPrima = costoIngredientes + costoMerma;

        const costoEnergia = (receta.procesosEquipos || []).reduce((sum, eq) => {
          const kwhConsumidos = (eq.potenciaWatts / 1000) * (((eq.minutosUso || 0) * factorEscala) / 60);
          return sum + (kwhConsumidos * (configuracion?.costoKwhCOP || 820));
        }, 0);

        const horasTrabajo = (((receta.tiempoMinutos || 0) * factorEscala) / 60);
        const costoManoObra = horasTrabajo * (configuracion?.salarioDeseadoHoraCOP || 18000);

        const costoCIF = (subtotalMateriaPrima + costoEnergia) * ((configuracion?.cifPorcentaje || 10) / 100);
        const costoTotalProduccion = subtotalMateriaPrima + costoEnergia + costoManoObra + costoCIF;

        const precioSugerido = (receta.precioVentaSugerido || 0) * factorEscala;
        const gananciaNeta = precioSugerido - costoTotalProduccion;
        const margenPorcentual = precioSugerido > 0 ? (gananciaNeta / precioSugerido) * 100 : 0;

        return {
          costoIngredientes,
          costoMerma,
          subtotalMateriaPrima,
          costoEnergia,
          costoManoObra,
          costoCIF,
          costoTotalProduccion,
          precioSugerido,
          gananciaNeta,
          margenPorcentual,
          porcionesTotales: Math.round((receta.porcionesRendimiento || 1) * factorEscala)
        };
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-serif-brand font-bold text-stone-900">Recetario Estándar & Costeo Real</h2>
              <p className="text-xs text-stone-500">
                Tarifa eléctrica (${configuracion?.costoKwhCOP || 820}/kWh) y mano de obra (${configuracion?.salarioDeseadoHoraCOP || 18000}/h).
              </p>
            </div>

            <div className="flex items-center space-x-3">
              <div className="flex items-center space-x-1 bg-white px-3 py-1.5 rounded-2xl border border-stone-200">
                <span className="text-xs font-bold text-stone-500 mr-1">Escala Balanza:</span>
                {[1, 1.5, 2, 3].map(fact => (
                  <button
                    key={fact}
                    onClick={() => setEscala(fact)}
                    className={`px-2 py-0.5 rounded-lg text-xs font-black transition ${
                      escala === fact ? 'bg-amber-600 text-white shadow-xs' : 'text-stone-600 hover:bg-stone-100'
                    }`}
                  >
                    x{fact}
                  </button>
                ))}
              </div>

              <button
                onClick={() => setModalNuevaReceta(true)}
                className="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-sm transition flex items-center space-x-1"
              >
                <span>+ Nueva Receta</span>
              </button>
            </div>
          </div>

          <div className="space-y-4">
            {(recetas || []).map(r => {
              const analisis = calcularCostoDetallado(r, escala);
              const estaAbierta = recetaAbierta === r.id;

              return (
                <div key={r.id} className="bg-white rounded-2xl border border-stone-200 shadow-xs overflow-hidden transition-all">
                  <div
                    onClick={() => setRecetaAbierta(estaAbierta ? null : r.id)}
                    className="p-5 cursor-pointer hover:bg-stone-50 flex items-center justify-between gap-4 transition select-none"
                  >
                    <div className="flex items-center space-x-3">
                      <div className="w-10 h-10 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-sm">
                        🍰
                      </div>
                      <div>
                        <h3 className="font-bold text-stone-900 text-base">{r.nombre}</h3>
                        <p className="text-xs text-stone-500">
                          {analisis.porcionesTotales} porciones {escala !== 1 && `(Escalado x${escala})`} • {Math.round((r.tiempoMinutos || 0) * escala)} mins
                        </p>
                      </div>
                    </div>

                    <div className="flex items-center space-x-4 sm:space-x-6">
                      <div className="text-right hidden sm:block">
                        <span className="text-[10px] uppercase font-bold text-stone-400 block">Costo Total</span>
                        <span className="font-bold text-stone-800 text-sm">{formatCOP(analisis.costoTotalProduccion)}</span>
                      </div>
                      <div className="text-right">
                        <span className="text-[10px] uppercase font-bold text-stone-400 block">PVP Sugerido</span>
                        <span className="font-black text-amber-700 text-base">{formatCOP(analisis.precioSugerido)}</span>
                      </div>
                      <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${analisis.margenPorcentual >= 30 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                        {Math.round(analisis.margenPorcentual)}% Margen
                      </span>

                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          setRecetaParaEditar(r);
                        }}
                        className="p-2 text-stone-400 hover:text-amber-800 hover:bg-amber-100 rounded-lg transition"
                        title="Editar Ficha Técnica de la Receta"
                      >
                        <Icons.Edit />
                      </button>

                      <span className="text-stone-400 font-bold">{estaAbierta ? '▲' : '▼'}</span>
                    </div>
                  </div>

                  {estaAbierta && (
                    <div className="p-6 bg-stone-50/70 border-t border-stone-200 space-y-6 text-xs">
                      <p className="text-stone-600 italic">{r.descripcion}</p>

                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <h4 className="font-bold text-stone-800 uppercase tracking-wider text-[11px]">
                            Ingredientes para Balanza {escala !== 1 && `(Calculado para x${escala})`}
                          </h4>
                          {escala !== 1 && (
                            <span className="text-[11px] bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded-full">
                              Multiplicador x{escala} activo
                            </span>
                          )}
                        </div>
                        <div className="bg-white rounded-xl border border-stone-200 overflow-hidden">
                          <table className="w-full text-left">
                            <thead className="bg-stone-100/70 text-stone-500 font-bold border-b border-stone-200">
                              <tr>
                                <th className="p-2.5">Ingrediente</th>
                                <th className="p-2.5 text-center">Peso Exacto a Medir</th>
                                <th className="p-2.5 text-right">Costo Insumo</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-stone-100">
                              {(r.ingredientes || []).map((ing, i) => {
                                const ins = (insumos || []).find(item => item.id === ing.insumoId);
                                const cantidadEscalada = ing.cantidad * escala;
                                const costo = ins ? ins.costoUnitario * cantidadEscalada : 0;
                                return (
                                  <tr key={i}>
                                    <td className="p-2.5 font-medium text-stone-800">{ins?.nombre || 'Insumo'}</td>
                                    <td className="p-2.5 text-center font-black text-amber-900 text-sm">
                                      {cantidadEscalada} {ins?.unidad}
                                    </td>
                                    <td className="p-2.5 text-right font-bold text-stone-800">{formatCOP(costo)}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-white p-4 rounded-xl border border-stone-200 space-y-2">
                          <h4 className="font-bold text-stone-800 uppercase tracking-wider text-[11px]">Energía & Tiempo de Cocina</h4>
                          <div className="space-y-1.5 text-stone-600">
                            {(r.procesosEquipos || []).map((eq, idx) => (
                              <div key={idx} className="flex justify-between">
                                <span>• {eq.nombre} ({Math.round((eq.minutosUso || 0) * escala)}m):</span>
                                <span className="font-medium">
                                  {formatCOP(((eq.potenciaWatts / 1000) * (((eq.minutosUso || 0) * escala) / 60)) * (configuracion?.costoKwhCOP || 820))}
                                </span>
                              </div>
                            ))}
                            <div className="flex justify-between pt-1 border-t border-stone-100">
                              <span>Mano de Obra ({Math.round((r.tiempoMinutos || 0) * escala)} min @ ${configuracion?.salarioDeseadoHoraCOP || 18000}/h):</span>
                              <span className="font-bold text-stone-900">{formatCOP(analisis.costoManoObra)}</span>
                            </div>
                          </div>
                        </div>

                        <div className="bg-amber-50/60 p-4 rounded-xl border border-amber-200/80 space-y-2">
                          <h4 className="font-bold text-amber-900 uppercase tracking-wider text-[11px]">Rentabilidad del Lote</h4>
                          <div className="space-y-1 text-stone-700">
                            <div className="flex justify-between">
                              <span>Materia Prima + Merma ({r.mermaPorcentaje}%):</span>
                              <span>{formatCOP(analisis.subtotalMateriaPrima)}</span>
                            </div>
                            <div className="flex justify-between">
                              <span>Costos Indirectos CIF ({configuracion?.cifPorcentaje || 10}%):</span>
                              <span>{formatCOP(analisis.costoCIF)}</span>
                            </div>
                            <div className="flex justify-between font-bold text-stone-900 pt-1 border-t border-amber-200">
                              <span>Costo Total Producción:</span>
                              <span>{formatCOP(analisis.costoTotalProduccion)}</span>
                            </div>
                            <div className="flex justify-between font-black text-emerald-800 text-sm pt-1">
                              <span>Ganancia Neta Real:</span>
                              <span>{formatCOP(analisis.gananciaNeta)}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {(recetaParaEditar || modalNuevaReceta) && (
            <ModalEditarReceta
              receta={recetaParaEditar}
              insumos={insumos}
              onCerrar={() => {
                setRecetaParaEditar(null);
                setModalNuevaReceta(false);
              }}
              onGuardar={(recetaActualizada) => {
                if (recetaParaEditar) {
                  setRecetas((recetas || []).map(r => r.id === recetaActualizada.id ? recetaActualizada : r));
                  dispararToast(`Receta '${recetaActualizada.nombre}' actualizada`);
                } else {
                  setRecetas([...(recetas || []), recetaActualizada]);
                  dispararToast(`Receta '${recetaActualizada.nombre}' creada`);
                }
                setRecetaParaEditar(null);
                setModalNuevaReceta(false);
              }}
            />
          )}
        </div>
      );
    }

    function ModalEditarReceta({ receta, insumos, onCerrar, onGuardar }) {
      const esEdicion = !!receta;

      const [nombre, setNombre] = useState(receta?.nombre || "");
      const [descripcion, setDescripcion] = useState(receta?.descripcion || "");
      const [porcionesRendimiento, setPorcionesRendimiento] = useState(receta?.porcionesRendimiento || 10);
      const [tiempoMinutos, setTiempoMinutos] = useState(receta?.tiempoMinutos || 60);
      const [mermaPorcentaje, setMermaPorcentaje] = useState(receta?.mermaPorcentaje || 3);
      const [precioVentaSugerido, setPrecioVentaSugerido] = useState(receta?.precioVentaSugerido || 80000);

      const [ingredientes, setIngredientes] = useState(receta?.ingredientes ? [...receta.ingredientes] : [
        { insumoId: (insumos && insumos[0]) ? insumos[0].id : "", cantidad: 100 }
      ]);

      const [procesosEquipos, setProcesosEquipos] = useState(receta?.procesosEquipos ? [...receta.procesosEquipos] : [
        { nombre: "Horno Convector (180°C)", potenciaWatts: 2200, minutosUso: 45 }
      ]);

      const agregarIngrediente = () => {
        setIngredientes([...ingredientes, { insumoId: (insumos && insumos[0]) ? insumos[0].id : "", cantidad: 100 }]);
      };

      const eliminarIngrediente = (index) => {
        setIngredientes(ingredientes.filter((_, idx) => idx !== index));
      };

      const actualizarIngrediente = (index, campo, valor) => {
        const nuevos = [...ingredientes];
        nuevos[index] = { ...nuevos[index], [campo]: valor };
        setIngredientes(nuevos);
      };

      const agregarEquipo = () => {
        setProcesosEquipos([...procesosEquipos, { nombre: "Batidora Planetaria", potenciaWatts: 600, minutosUso: 20 }]);
      };

      const eliminarEquipo = (index) => {
        setProcesosEquipos(procesosEquipos.filter((_, idx) => idx !== index));
      };

      const actualizarEquipo = (index, campo, valor) => {
        const nuevos = [...procesosEquipos];
        nuevos[index] = { ...nuevos[index], [campo]: valor };
        setProcesosEquipos(nuevos);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!nombre) return alert("Escribe el nombre de la receta");

        const resultado = {
          id: receta?.id || `rec-${Date.now()}`,
          nombre,
          descripcion,
          porcionesRendimiento: Number(porcionesRendimiento),
          tiempoMinutos: Number(tiempoMinutos),
          mermaPorcentaje: Number(mermaPorcentaje),
          precioVentaSugerido: Number(precioVentaSugerido),
          ingredientes: ingredientes.map(i => ({ insumoId: i.insumoId, cantidad: Number(i.cantidad) })),
          procesosEquipos: procesosEquipos.map(eq => ({
            nombre: eq.nombre,
            potenciaWatts: Number(eq.potenciaWatts),
            minutosUso: Number(eq.minutosUso)
          }))
        };

        onGuardar(resultado);
      };

      return (
        <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-stone-200 max-h-[90vh] overflow-y-auto">
            <h3 className="font-serif-brand font-bold text-xl text-stone-900">
              {esEdicion ? `Editar Ficha Técnica: ${receta.nombre}` : 'Crear Nueva Receta'}
            </h3>
            <p className="text-xs text-stone-500 mt-0.5">Define ingredientes exactos, consumo de hornos y precio sugerido.</p>

            <form onSubmit={handleSubmit} className="mt-4 space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-stone-700 block mb-1">Nombre de la Receta *</label>
                  <input
                    type="text"
                    required
                    value={nombre}
                    onChange={e => setNombre(e.target.value)}
                    placeholder="Ej. Tarta de Frutos Rojos"
                    className="w-full border border-stone-300 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-amber-500"
                  />
                </div>
                <div>
                  <label className="font-bold text-stone-700 block mb-1">PVP Sugerido al Público ($ COP)</label>
                  <input
                    type="number"
                    value={precioVentaSugerido}
                    onChange={e => setPrecioVentaSugerido(e.target.value)}
                    className="w-full border border-stone-300 rounded-xl p-2.5 font-bold text-amber-900"
                  />
                </div>
              </div>

              <div>
                <label className="font-bold text-stone-700 block mb-1">Descripción Breve</label>
                <input
                  type="text"
                  value={descripcion}
                  onChange={e => setDescripcion(e.target.value)}
                  placeholder="Detalles sobre sabor, técnica o acabado..."
                  className="w-full border border-stone-300 rounded-xl p-2.5 outline-none"
                />
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="font-bold text-stone-700 block mb-1">Porciones</label>
                  <input
                    type="number"
                    min="1"
                    value={porcionesRendimiento}
                    onChange={e => setPorcionesRendimiento(e.target.value)}
                    className="w-full border border-stone-300 rounded-xl p-2.5 text-center font-bold"
                  />
                </div>
                <div>
                  <label className="font-bold text-stone-700 block mb-1">Tiempo (Minutos)</label>
                  <input
                    type="number"
                    value={tiempoMinutos}
                    onChange={e => setTiempoMinutos(e.target.value)}
                    className="w-full border border-stone-300 rounded-xl p-2.5 text-center font-bold"
                  />
                </div>
                <div>
                  <label className="font-bold text-stone-700 block mb-1">Merma Técnica (%)</label>
                  <input
                    type="number"
                    value={mermaPorcentaje}
                    onChange={e => setMermaPorcentaje(e.target.value)}
                    className="w-full border border-stone-300 rounded-xl p-2.5 text-center font-bold text-rose-700"
                  />
                </div>
              </div>

              <div className="p-4 bg-stone-50 rounded-2xl border border-stone-200/80 space-y-2">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-stone-800 uppercase tracking-wider text-[11px]">Ingredientes de la Receta</span>
                  <button
                    type="button"
                    onClick={agregarIngrediente}
                    className="text-amber-800 hover:text-amber-900 font-bold text-xs"
                  >
                    + Agregar Ingrediente
                  </button>
                </div>

                <div className="space-y-2">
                  {ingredientes.map((ing, idx) => {
                    const insActual = (insumos || []).find(i => i.id === ing.insumoId);
                    return (
                      <div key={idx} className="flex items-center space-x-2">
                        <select
                          value={ing.insumoId}
                          onChange={e => actualizarIngrediente(idx, "insumoId", e.target.value)}
                          className="flex-1 border border-stone-300 rounded-xl p-2 bg-white"
                        >
                          {(insumos || []).map(i => (
                            <option key={i.id} value={i.id}>{i.nombre} ({i.unidad})</option>
                          ))}
                        </select>
                        <input
                          type="number"
                          placeholder="Cantidad"
                          value={ing.cantidad}
                          onChange={e => actualizarIngrediente(idx, "cantidad", e.target.value)}
                          className="w-24 border border-stone-300 rounded-xl p-2 text-center font-bold"
                        />
                        <span className="text-stone-500 font-semibold w-8">{insActual?.unidad}</span>
                        <button
                          type="button"
                          onClick={() => eliminarIngrediente(idx)}
                          className="p-2 text-rose-500 hover:bg-rose-100 rounded-lg transition"
                        >
                          <Icons.Trash />
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="p-4 bg-stone-50 rounded-2xl border border-stone-200/80 space-y-2">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-stone-800 uppercase tracking-wider text-[11px]">Equipos Eléctricos & Hornos</span>
                  <button
                    type="button"
                    onClick={agregarEquipo}
                    className="text-amber-800 hover:text-amber-900 font-bold text-xs"
                  >
                    + Agregar Equipo
                  </button>
                </div>

                <div className="space-y-2">
                  {procesosEquipos.map((eq, idx) => (
                    <div key={idx} className="flex items-center space-x-2">
                      <input
                        type="text"
                        placeholder="Nombre Equipo"
                        value={eq.nombre}
                        onChange={e => actualizarEquipo(idx, "nombre", e.target.value)}
                        className="flex-1 border border-stone-300 rounded-xl p-2 bg-white"
                      />
                      <input
                        type="number"
                        placeholder="Watts"
                        value={eq.potenciaWatts}
                        onChange={e => actualizarEquipo(idx, "potenciaWatts", e.target.value)}
                        className="w-24 border border-stone-300 rounded-xl p-2 text-center"
                        title="Potencia en Watts"
                      />
                      <input
                        type="number"
                        placeholder="Minutos"
                        value={eq.minutosUso}
                        onChange={e => actualizarEquipo(idx, "minutosUso", e.target.value)}
                        className="w-24 border border-stone-300 rounded-xl p-2 text-center"
                        title="Minutos de uso"
                      />
                      <button
                        type="button"
                        onClick={() => eliminarEquipo(idx)}
                        className="p-2 text-rose-500 hover:bg-rose-100 rounded-lg transition"
                      >
                        <Icons.Trash />
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex items-center justify-end space-x-3 pt-3 border-t border-stone-100">
                <button
                  type="button"
                  onClick={onCerrar}
                  className="px-4 py-2 font-bold text-stone-500 hover:bg-stone-100 rounded-xl"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 font-bold bg-amber-600 hover:bg-amber-700 text-white rounded-xl shadow-md"
                >
                  {esEdicion ? 'Guardar Ficha Técnica' : 'Crear Receta'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 6. AUDITORÍA E HISTORIAL
    // =========================================================================
    function AuditoriaView({ historialMermas, pedidos, recetas }) {
      const [busquedaHistorial, setBusquedaHistorial] = useState("");
      const [subPestana, setSubPestana] = useState("mermas");

      const totalPerdidasMermas = (historialMermas || []).reduce((sum, m) => sum + (m.costoPerdidoCOP || 0), 0);

      const resumenPorMotivo = useMemo(() => {
        const mapa = {};
        (historialMermas || []).forEach(m => {
          mapa[m.motivo] = (mapa[m.motivo] || 0) + (m.costoPerdidoCOP || 0);
        });
        return Object.entries(mapa).map(([motivo, total]) => ({ motivo, total }));
      }, [historialMermas]);

      const pedidosArchivados = (pedidos || []).filter(p => p.estado === 'completado' || p.estado === 'cancelado');
      const pedidosFiltrados = pedidosArchivados.filter(p => {
        const txt = (busquedaHistorial || "").toLowerCase();
        return (p.cliente || "").toLowerCase().includes(txt) || (p.telefono || "").includes(txt) || (p.id || "").toLowerCase().includes(txt);
      });

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-serif-brand font-bold text-stone-900">Auditoría & Historial</h2>
              <p className="text-xs text-stone-500">Trazabilidad de desperdicios económicos y archivo histórico de clientes.</p>
            </div>

            <div className="flex items-center space-x-1 bg-stone-100 p-1 rounded-xl">
              <button
                onClick={() => setSubPestana("mermas")}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                  subPestana === "mermas" ? "bg-white text-stone-900 shadow-xs" : "text-stone-500"
                }`}
              >
                📉 Libro de Mermas
              </button>
              <button
                onClick={() => setSubPestana("pedidos")}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                  subPestana === "pedidos" ? "bg-white text-stone-900 shadow-xs" : "text-stone-500"
                }`}
              >
                📦 Clientes & Encargos Pasados
              </button>
            </div>
          </div>

          {subPestana === "mermas" && (
            <div className="space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-white p-5 rounded-2xl border border-rose-200/80 shadow-xs">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-rose-600">Dinero Perdido en Mermas</span>
                  <p className="text-2xl font-black text-rose-600 mt-1">{formatCOP(totalPerdidasMermas)}</p>
                  <span className="text-[11px] text-stone-400 font-medium">{(historialMermas || []).length} registros dados de baja</span>
                </div>

                <div className="col-span-2 bg-white p-5 rounded-2xl border border-stone-200 shadow-xs">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-stone-500 block mb-2">Causas Principales de Merma</span>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {resumenPorMotivo.map((rm, idx) => (
                      <div key={idx} className="bg-stone-50 p-2.5 rounded-xl border border-stone-100 text-xs">
                        <strong className="text-stone-800 block truncate">{rm.motivo}</strong>
                        <span className="font-black text-rose-600">{formatCOP(rm.total)}</span>
                      </div>
                    ))}
                    {resumenPorMotivo.length === 0 && (
                      <span className="text-xs text-stone-400">Sin registros de merma acumulados.</span>
                    )}
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-2xl border border-stone-200 shadow-xs overflow-hidden">
                <div className="p-4 bg-stone-50/80 border-b border-stone-200">
                  <h3 className="font-bold text-stone-800 text-sm">Historial Cronológico de Mermas</h3>
                  <p className="text-xs text-stone-500">Detalle de insumos desechados con su impacto monetario real.</p>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-stone-100/70 text-stone-600 font-bold border-b border-stone-200">
                      <tr>
                        <th className="p-3">Fecha y Hora</th>
                        <th className="p-3">Insumo Desechado</th>
                        <th className="p-3 text-center">Cantidad</th>
                        <th className="p-3">Motivo / Causa</th>
                        <th className="p-3 text-right">Pérdida ($ COP)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-stone-100">
                      {(historialMermas || []).map(m => (
                        <tr key={m.id} className="hover:bg-stone-50">
                          <td className="p-3 text-stone-500">{new Date(m.fecha).toLocaleString('es-CO')}</td>
                          <td className="p-3 font-bold text-stone-900">{m.insumoNombre}</td>
                          <td className="p-3 text-center font-bold text-stone-700">{m.cantidad} {m.unidad}</td>
                          <td className="p-3 text-stone-600">{m.motivo}</td>
                          <td className="p-3 text-right font-black text-rose-600">{formatCOP(m.costoPerdidoCOP)}</td>
                        </tr>
                      ))}
                      {(historialMermas || []).length === 0 && (
                        <tr>
                          <td colSpan="5" className="p-8 text-center text-stone-400">No hay mermas registradas.</td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {subPestana === "pedidos" && (
            <div className="space-y-4">
              <div className="flex items-center space-x-2">
                <input
                  type="text"
                  placeholder="Buscar por cliente, teléfono o código..."
                  value={busquedaHistorial}
                  onChange={e => setBusquedaHistorial(e.target.value)}
                  className="bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none w-full sm:w-96"
                />
              </div>

              <div className="bg-white rounded-2xl border border-stone-200 shadow-xs overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-stone-50 text-stone-600 font-bold border-b border-stone-200">
                      <tr>
                        <th className="p-3">Código</th>
                        <th className="p-3">Cliente</th>
                        <th className="p-3">Teléfono</th>
                        <th className="p-3">Fecha Entrega</th>
                        <th className="p-3">Productos Elaborados</th>
                        <th className="p-3 text-right">Total Cobrado</th>
                        <th className="p-3 text-center">Estado</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-stone-100">
                      {pedidosFiltrados.map(p => (
                        <tr key={p.id} className="hover:bg-stone-50">
                          <td className="p-3 font-bold text-stone-400">{p.id}</td>
                          <td className="p-3 font-bold text-stone-900">{p.cliente}</td>
                          <td className="p-3 text-stone-500">{p.telefono || 'Sin teléfono'}</td>
                          <td className="p-3 text-stone-600">{p.fechaEntrega}</td>
                          <td className="p-3 text-stone-700">
                            {(p.items || []).map((it, idx) => {
                              const r = (recetas || []).find(rec => rec.id === it.recetaId);
                              return <span key={idx} className="block">• {it.cantidad}x {r?.nombre || 'Producto'}</span>;
                            })}
                          </td>
                          <td className="p-3 text-right font-black text-stone-900">{formatCOP(p.totalCobrado)}</td>
                          <td className="p-3 text-center">
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                              p.estado === 'completado' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                            }`}>
                              {p.estado === 'completado' ? 'Entregado' : 'Cancelado'}
                            </span>
                          </td>
                        </tr>
                      ))}
                      {pedidosFiltrados.length === 0 && (
                        <tr>
                          <td colSpan="7" className="p-8 text-center text-stone-400">
                            No se encontraron encargos pasados en el archivo.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Modal de Tarifas y Copia de Respaldo
    function ModalAjustesTarifas({ configuracion, setConfiguracion, onCerrar, onDescargarRespaldo, onRestaurarRespaldo, dispararToast }) {
      const [kwh, setKwh] = useState(configuracion?.costoKwhCOP || 820);
      const [salario, setSalario] = useState(configuracion?.salarioDeseadoHoraCOP || 18000);
      const [cif, setCif] = useState(configuracion?.cifPorcentaje || 10);
      const fileInputRef = useRef(null);

      const guardar = (e) => {
        e.preventDefault();
        setConfiguracion({
          costoKwhCOP: Number(kwh),
          salarioDeseadoHoraCOP: Number(salario),
          cifPorcentaje: Number(cif)
        });
        onCerrar();
        dispararToast("Tarifas actualizadas en todo el taller");
      };

      return (
        <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-stone-200">
            <h3 className="font-serif-brand font-bold text-lg text-stone-900">Ajustes & Copia de Respaldo</h3>
            <p className="text-xs text-stone-500 mt-0.5">Tarifas del taller y seguridad de tus datos.</p>

            <form onSubmit={guardar} className="mt-4 space-y-3 text-xs">
              <div>
                <label className="font-bold text-stone-700 block mb-1">Costo Tarifa Eléctrica ($ COP por kWh)</label>
                <input
                  type="number"
                  value={kwh}
                  onChange={e => setKwh(Number(e.target.value))}
                  className="w-full border border-stone-300 rounded-xl p-2.5 font-bold text-stone-900"
                />
                <span className="text-[10px] text-stone-400">Tarifa comercial EPM / Enel / Celsia</span>
              </div>

              <div>
                <label className="font-bold text-stone-700 block mb-1">Salario Hora del Pastelero ($ COP / hora)</label>
                <input
                  type="number"
                  value={salario}
                  onChange={e => setSalario(Number(e.target.value))}
                  className="w-full border border-stone-300 rounded-xl p-2.5 font-bold text-emerald-800"
                />
              </div>

              <div>
                <label className="font-bold text-stone-700 block mb-1">Margen Gastos Menores CIF (%)</label>
                <input
                  type="number"
                  value={cif}
                  onChange={e => setCif(Number(e.target.value))}
                  className="w-full border border-stone-300 rounded-xl p-2.5 font-bold text-stone-900"
                />
              </div>

              <div className="pt-3 border-t border-stone-200 space-y-2">
                <span className="font-bold text-stone-800 text-[11px] block uppercase tracking-wider">Copia de Seguridad de Datos</span>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={onDescargarRespaldo}
                    className="p-2 bg-stone-100 hover:bg-stone-200 text-stone-800 rounded-xl font-bold flex items-center justify-center space-x-1.5 transition text-[11px]"
                  >
                    <Icons.Download />
                    <span>Descargar JSON</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => fileInputRef.current?.click()}
                    className="p-2 bg-stone-100 hover:bg-stone-200 text-stone-800 rounded-xl font-bold flex items-center justify-center space-x-1.5 transition text-[11px]"
                  >
                    <Icons.Upload />
                    <span>Restaurar JSON</span>
                  </button>
                  <input
                    type="file"
                    ref={fileInputRef}
                    onChange={onRestaurarRespaldo}
                    accept=".json"
                    className="hidden"
                  />
                </div>
              </div>

              <div className="flex items-center justify-end space-x-2 pt-3 border-t border-stone-100">
                <button type="button" onClick={onCerrar} className="px-3 py-2 font-bold text-stone-500 hover:bg-stone-100 rounded-xl">Cancelar</button>
                <button type="submit" className="px-4 py-2 font-bold bg-amber-600 hover:bg-amber-700 text-white rounded-xl shadow-md">
                  Guardar Tarifas
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MONTAJE FINAL REACT 18 ---
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
