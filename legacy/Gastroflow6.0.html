        { id: "ins-8", nombre: "Caja Pastelería Microcorrugado + Cinta", unidad: "und", costoUnitario: 4500, stockActual: 12, stockMinimo: 10, presentacionNombre: "Paquete 10 und", presentacionCantidad: 10, precioPresentacion: 45000, proveedor: "Empaques Andinos" }

        }
      ]

    // --- CARGADOR SEGURO DE LOCALSTORAGE (Previene pantallas blancas) ---
    const safeLoad = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        if (!item) return fallback;
        const parsed = JSON.parse(item);
        if (parsed === null || parsed === undefined) return fallback;
        if (Array.isArray(fallback) && !Array.isArray(parsed)) return fallback;
        return parsed;
      } catch (e) {
        console.warn("Storage warning, cargando valores predeterminados:", e);
        return fallback;
      }
    };

    // --- COMPONENTE PRINCIPAL APP ---
    function App() {
      const STORAGE_KEY = "gf_master_v12";

      const [insumos, setInsumos] = useState(() => safeLoad(`${STORAGE_KEY}_insumos`, SEED_DATA.insumos));
      const [recetas, setRecetas] = useState(() => safeLoad(`${STORAGE_KEY}_recetas`, SEED_DATA.recetas));
      const [pedidos, setPedidos] = useState(() => safeLoad(`${STORAGE_KEY}_pedidos`, SEED_DATA.pedidos));
      const [configuracion, setConfiguracion] = useState(() => safeLoad(`${STORAGE_KEY}_config`, SEED_DATA.configuracion));
      const [historialMermas, setHistorialMermas] = useState(() => safeLoad(`${STORAGE_KEY}_mermas`, SEED_DATA.historialMermas));

      const [activeTab, setActiveTab] = useState("dashboard");

      const [showNotificationMenu, setShowNotificationMenu] = useState(false);
      const [insumoParaComprar, setInsumoParaComprar] = useState(null);
      const [filtroPedidoLibreta, setFiltroPedidoLibreta] = useState(null);
      const [modalConfig, setModalConfig] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      useEffect(() => {
        try { localStorage.setItem(`${STORAGE_KEY}_insumos`, JSON.stringify(insumos)); } catch (e) {}
      }, [insumos]);
      useEffect(() => {
        try { localStorage.setItem(`${STORAGE_KEY}_recetas`, JSON.stringify(recetas)); } catch (e) {}
      }, [recetas]);
      useEffect(() => {
        try { localStorage.setItem(`${STORAGE_KEY}_pedidos`, JSON.stringify(pedidos)); } catch (e) {}
      }, [pedidos]);
      useEffect(() => {
        try { localStorage.setItem(`${STORAGE_KEY}_config`, JSON.stringify(configuracion)); } catch (e) {}
      }, [configuracion]);
      useEffect(() => {
        try { localStorage.setItem(`${STORAGE_KEY}_mermas`, JSON.stringify(historialMermas)); } catch (e) {}
      }, [historialMermas]);

      const dispararToast = (mensaje) => {
        setToastMsg(mensaje);
        setTimeout(() => setToastMsg(null), 3500);
      };

      const descargarRespaldo = () => {
        const datosBackup = {
          version: "GastroFlow_v12",
          fechaExportacion: new Date().toISOString(),
          insumos,
          recetas,
          pedidos,
          configuracion,
          historialMermas
        };
        const blob = new Blob([JSON.stringify(datosBackup, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const fechaStr = new Date().toISOString().split('T')[0];
        a.href = url;
        a.download = `GastroFlow_Respaldo_${fechaStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
        dispararToast("¡Copia de respaldo descargada con éxito!");
      };

      const restaurarRespaldo = (e) => {
        const archivo = e.target.files[0];
        if (!archivo) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.insumos && data.recetas && data.pedidos) {
              setInsumos(data.insumos);
              setRecetas(data.recetas);
              setPedidos(data.pedidos);
              if (data.configuracion) setConfiguracion(data.configuracion);
              if (data.historialMermas) setHistorialMermas(data.historialMermas);
              dispararToast("¡Datos restaurados con éxito desde el archivo!");
              setModalConfig(false);
            } else {
              alert("El archivo no contiene un formato de respaldo válido para GastroFlow.");
            }
          } catch (err) {
            alert("Error al leer el archivo de respaldo. Asegúrate de que sea un archivo JSON válido.");
          }
        };
        reader.readAsText(archivo);
      };

      const insumosCriticos = useMemo(() => (insumos || []).filter(i => i.stockActual <= i.stockMinimo), [insumos]);
      const hoyStr = new Date().toISOString().split('T')[0];
      const pedidosHoy = useMemo(() => (pedidos || []).filter(p => p.fechaEntrega === hoyStr && p.estado !== 'completado' && p.estado !== 'cancelado'), [pedidos, hoyStr]);

      return (
        <div className="min-h-screen flex flex-col bg-[#FDFBF7]">
          {toastMsg && (

                <div>

                  </h1>

                </div>

              {/* NAVEGACIÓN 6 PESTAÑAS */}
              <nav className="hidden lg:flex items-center space-x-1">
                {[
                  { id: "dashboard", label: "Dashboard", icon: Icons.TrendingUp },
                  { id: "pedidos", label: "Libreta de Encargos", icon: Icons.BookOpen },
                  { id: "cocina", label: "Preparación & Cocina", icon: Icons.ChefHat },
                  { id: "inventario", label: "Bodega e Insumos", icon: Icons.Box },
                  { id: "recetas", label: "Recetario & Costeo", icon: Icons.Scale },
                  { id: "auditoria", label: "Auditoría e Historial", icon: Icons.History }
                ].map(tab => (

                    key={tab.id}

                    className={`px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 ${

                        : "text-stone-600 hover:text-stone-900 hover:bg-stone-100"

    // =========================================================================
    // 1. DASHBOARD & AGENDA
    // =========================================================================
    function DashboardView({ pedidos, recetas, insumos, historialMermas, onNavegar }) {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const totalVentas = (pedidos || [])
        .filter(p => p.estado !== 'cancelado')
        .reduce((sum, p) => sum + (p.totalCobrado || 0), 0);

      const saldosPendientes = (pedidos || [])
        .filter(p => p.estado !== 'cancelado' && p.estado !== 'completado')
        .reduce((sum, p) => sum + ((p.totalCobrado || 0) - (p.abono || 0)), 0);

      const valorBodega = (insumos || []).reduce((sum, i) => sum + (i.stockActual * i.costoUnitario), 0);
      const perdidasMermas = (historialMermas || []).reduce((sum, m) => sum + (m.costoPerdidoCOP || 0), 0);

      const hoyStr = new Date().toISOString().split('T')[0];
      const agendaHoy = (pedidos || []).filter(p => p.fechaEntrega === hoyStr && p.estado !== 'cancelado');

      // Gráfica protegida contra fallos de Chart.js
      useEffect(() => {
        if (!chartRef.current || typeof Chart === 'undefined') return;

        try {
          if (chartInstance.current) chartInstance.current.destroy();

          const ctx = chartRef.current.getContext('2d');
          const etiquetas = (recetas || []).map(r => r.nombre.length > 20 ? r.nombre.substring(0, 20) + '...' : r.nombre);

          const costos = (recetas || []).map(r => {
            return (r.ingredientes || []).reduce((sum, ing) => {
              const ins = (insumos || []).find(i => i.id === ing.insumoId);
              return sum + (ins ? ins.costoUnitario * ing.cantidad : 0);
            }, 0);
          });

          const ventas = (recetas || []).map(r => r.precioVentaSugerido || 0);

          chartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: etiquetas,
              datasets: [
                { label: 'Precio Sugerido Venta ($)', data: ventas, backgroundColor: 'rgba(217, 119, 6, 0.85)', borderRadius: 6 },
                { label: 'Costo Insumos Directos ($)', data: costos, backgroundColor: 'rgba(239, 68, 68, 0.75)', borderRadius: 6 }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11, family: 'Plus Jakarta Sans' } } },
                tooltip: {
                  callbacks: { label: (ctx) => `${ctx.dataset.label}: ${formatCOP(ctx.raw)}` }
                }
              },
              scales: {
                y: { beginAtZero: true, ticks: { callback: (v) => '$' + (v / 1000) + 'k' } }
              }
            }
          });
        } catch (err) {
          console.warn("No se pudo inicializar Chart.js:", err);
        }

        return () => {
          if (chartInstance.current) {
            try { chartInstance.current.destroy(); } catch (e) {}
          }
        };
      }, [recetas, insumos]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-gradient-to-r from-amber-900 to-stone-900 text-white p-6 rounded-3xl shadow-lg">
            <div>
              <span className="text-amber-400 font-bold text-xs uppercase tracking-widest">Resumen Financiero & Taller</span>
              <h2 className="text-2xl sm:text-3xl font-serif-brand font-bold mt-1">GastroFlow Artisan</h2>
              <p className="text-stone-300 text-xs sm:text-sm mt-1">Supervisión en tiempo real de bodega, agenda y finanzas.</p>
            </div>
            <button
              onClick={() => onNavegar("pedidos")}
              className="bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold px-4 py-2.5 rounded-xl text-xs transition shadow-md flex items-center space-x-2 self-start sm:self-auto"
            >
              <Icons.BookOpen />
              <span>Abrir Libreta de Encargos</span>
            </button>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-xs">
              <span className="text-[11px] font-bold uppercase tracking-wider text-stone-500">Total Encargos</span>
              <p className="text-xl sm:text-2xl font-black text-stone-900 mt-1">{formatCOP(totalVentas)}</p>
              <span className="text-[11px] text-emerald-600 font-semibold">Incluye abonos y liquidados</span>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-xs">
              <span className="text-[11px] font-bold uppercase tracking-wider text-stone-500">Saldos por Cobrar</span>
              <p className="text-xl sm:text-2xl font-black text-amber-600 mt-1">{formatCOP(saldosPendientes)}</p>
              <span className="text-[11px] text-stone-400 font-medium">Por recibir contra entrega</span>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-xs">
              <span className="text-[11px] font-bold uppercase tracking-wider text-stone-500">Valor de Bodega</span>
              <p className="text-xl sm:text-2xl font-black text-stone-900 mt-1">{formatCOP(valorBodega)}</p>
              <span className="text-[11px] text-stone-400 font-medium">{(insumos || []).length} materias primas</span>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-xs">
              <span className="text-[11px] font-bold uppercase tracking-wider text-rose-600">Pérdidas por Mermas</span>
              <p className="text-xl sm:text-2xl font-black text-rose-600 mt-1">{formatCOP(perdidasMermas)}</p>
              <button onClick={() => onNavegar("auditoria")} className="text-[11px] text-stone-500 hover:text-stone-900 font-bold underline">
                Ver auditoría &rarr;
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-5 bg-white p-5 rounded-2xl border border-stone-200 shadow-xs flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between pb-3 border-b border-stone-100">
                  <h3 className="font-bold text-stone-800 text-sm flex items-center space-x-2">
                    <Icons.History />
                    <span>Entregas de Hoy ({hoyStr})</span>
                  </h3>
                  <span className="text-xs font-bold text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded-full">
                    {agendaHoy.length} pendientes
                  </span>
                </div>

                <div className="mt-4 space-y-3">
                  {agendaHoy.length === 0 ? (
                    <div className="py-10 text-center text-stone-400">
                      <p className="text-sm font-medium">No tienes entregas agendadas para hoy.</p>
                      <button onClick={() => onNavegar("pedidos")} className="mt-2 text-xs text-amber-800 font-bold hover:underline">
                        Crear nuevo encargo &rarr;
                      </button>
                    </div>
                  ) : (
                    agendaHoy.map(p => (
                      <div
                        key={p.id}
                        onClick={() => onNavegar("pedidos", p.id)}
                        className="p-3 rounded-xl border border-stone-100 bg-stone-50/70 hover:bg-amber-50/60 hover:border-amber-200 transition cursor-pointer flex items-center justify-between"
                      >
                        <div>
                          <div className="flex items-center space-x-2">
                            <span className="text-xs font-bold text-stone-900">{p.cliente}</span>
                            <span className={`text-[10px] px-2 py-0.2 rounded font-bold ${
                              p.estado === 'en_preparacion' ? 'bg-amber-100 text-amber-800' : 'bg-stone-200 text-stone-700'
                            }`}>
                              {p.estado === 'en_preparacion' ? 'En Horno/Mesa' : 'Pendiente'}
                            </span>
                          </div>
                          <p className="text-[11px] text-stone-500 mt-0.5">Hora: <strong className="text-stone-700">{p.horaEntrega}</strong> • Tel: {p.telefono}</p>
                        </div>
                        <div className="text-right">
                          <p className="text-xs font-bold text-stone-900">{formatCOP(p.totalCobrado)}</p>
                          <p className="text-[10px] text-amber-700 font-semibold">Resta: {formatCOP(p.totalCobrado - p.abono)}</p>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>

              <div className="pt-4 border-t border-stone-100 mt-4 flex items-center justify-between text-xs">
                <span className="text-stone-400">¿Revisar compras de ingredientes?</span>
                <button onClick={() => onNavegar("cocina")} className="text-amber-800 font-bold hover:underline flex items-center space-x-1">
                  <Icons.ChefHat />
                  <span>Mesa de Cocina & WhatsApp</span>
                </button>
              </div>
            </div>

            <div className="lg:col-span-7 bg-white p-5 rounded-2xl border border-stone-200 shadow-xs flex flex-col justify-between">
              <div>
                <h3 className="font-bold text-stone-800 text-sm flex items-center space-x-2">
                  <Icons.TrendingUp />
                  <span>Margen Bruto de Materia Prima por Receta</span>
                </h3>
                <p className="text-xs text-stone-500 mt-0.5">Precio de venta público sugerido frente a los insumos directos.</p>
                <div className="h-64 mt-4 relative">
                  <canvas ref={chartRef}></canvas>
                </div>
              </div>
              <div className="pt-3 border-t border-stone-100 text-xs text-stone-400 flex items-center justify-between">
                <span>Calculado automáticamente según precios vigentes</span>
                <button onClick={() => onNavegar("recetas")} className="text-amber-700 font-semibold hover:underline">
                  Ajustar recetario &rarr;
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 2. LIBRETA DE ENCARGOS
    // =========================================================================
    function PedidosView({ pedidos, setPedidos, recetas, insumos, setInsumos, filtroPedidoId, setFiltroPedidoId, dispararToast }) {
      const [mostrarModalNuevo, setMostrarModalNuevo] = useState(false);
      const [modalPaseCocina, setModalPaseCocina] = useState(null);
      const [pedidoParaWhatsApp, setPedidoParaWhatsApp] = useState(null);
      const [filtroTexto, setFiltroTexto] = useState("");

      useEffect(() => {
        if (filtroPedidoId) setFiltroTexto(filtroPedidoId);
      }, [filtroPedidoId]);

      const [formCliente, setFormCliente] = useState("");
      const [formTelefono, setFormTelefono] = useState("");
      const [formFecha, setFormFecha] = useState(new Date().toISOString().split('T')[0]);
      const [formHora, setFormHora] = useState("15:00");
      const [formRecetaId, setFormRecetaId] = useState(recetas[0]?.id || "");
      const [formCantidad, setFormCantidad] = useState(1);
      const [formTotal, setFormTotal] = useState(0);
      const [formAbono, setFormAbono] = useState(0);
      const [formNotas, setFormNotas] = useState("");

      useEffect(() => {
        const rec = (recetas || []).find(r => r.id === formRecetaId);
        if (rec) {
          const sug = (rec.precioVentaSugerido || 0) * formCantidad;
          setFormTotal(sug);
          setFormAbono(Math.round(sug * 0.5));
        }
      }, [formRecetaId, formCantidad, recetas]);

      const guardarPedido = (e) => {
        e.preventDefault();
        if (!formCliente) return alert("Escribe el nombre del cliente");

        const nuevo = {
          id: `PED-${Math.floor(100 + Math.random() * 900)}`,
          cliente: formCliente,
          telefono: formTelefono,
          fechaEntrega: formFecha,
          horaEntrega: formHora,
          items: [{ recetaId: formRecetaId, cantidad: Number(formCantidad) }],
          totalCobrado: Number(formTotal),
          abono: Number(formAbono),
          estado: "pendiente",
          notas: formNotas
        };

        setPedidos([nuevo, ...(pedidos || [])]);
        setMostrarModalNuevo(false);
        dispararToast(`¡Encargo de ${formCliente} agendado con éxito!`);

        setFormCliente("");
        setFormTelefono("");
        setFormNotas("");
      };

      const cambiarEstado = (id, nuevoEstado) => {
        setPedidos((pedidos || []).map(p => p.id === id ? { ...p, estado: nuevoEstado } : p));
        dispararToast(`Estado de encargo actualizado a: ${nuevoEstado}`);
      };

      const pedidosFiltrados = (pedidos || []).filter(p => {
        const txt = (filtroTexto || "").toLowerCase();
        return (p.cliente || "").toLowerCase().includes(txt) || (p.id || "").toLowerCase().includes(txt) || (p.telefono || "").includes(txt);
      });

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-serif-brand font-bold text-stone-900">Libreta de Encargos</h2>
              <p className="text-xs text-stone-500">Control de pedidos personalizados, saldos y confirmaciones por WhatsApp.</p>
            </div>

            <div className="flex items-center space-x-2">
              <input
                type="text"
                placeholder="Buscar cliente o código..."
                value={filtroTexto}
                onChange={e => { setFiltroTexto(e.target.value); if (filtroPedidoId) setFiltroPedidoId(null); }}
                className="bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none w-48 sm:w-64"
              />
              <button
                onClick={() => setMostrarModalNuevo(true)}
                className="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-sm transition flex items-center space-x-1"
              >
                <span>+ Nuevo Encargo</span>
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            {pedidosFiltrados.map(p => {
              const saldo = (p.totalCobrado || 0) - (p.abono || 0);
              const esHoy = p.fechaEntrega === new Date().toISOString().split('T')[0];
              const sinAnticipo = (p.abono || 0) === 0;

              return (
                <div
                  key={p.id}
                  className={`bg-white rounded-2xl border p-5 transition-shadow relative flex flex-col justify-between ${
                    filtroPedidoId === p.id ? 'border-amber-500 ring-2 ring-amber-300 shadow-md' : 'border-stone-200 hover:shadow-md'
                  }`}
                >
                  <div>
                    <div className="flex items-start justify-between">
                      <div>
                        <span className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">{p.id}</span>
                        <h3 className="text-base font-bold text-stone-900 leading-tight mt-0.5">{p.cliente}</h3>
                        <p className="text-xs text-stone-500">Tel: {p.telefono || 'Sin teléfono'}</p>
                      </div>

                      <span className={`text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-full ${
                        p.estado === 'completado' ? 'bg-emerald-100 text-emerald-800' :
                        p.estado === 'en_preparacion' ? 'bg-amber-100 text-amber-800 animate-pulse' :
                        p.estado === 'cancelado' ? 'bg-rose-100 text-rose-800' : 'bg-stone-100 text-stone-700'
                      }`}>
                        {p.estado === 'pendiente' && 'Pendiente'}
                        {p.estado === 'en_preparacion' && 'En Cocina'}
                        {p.estado === 'completado' && 'Entregado'}
                        {p.estado === 'cancelado' && 'Cancelado'}
                      </span>
                    </div>

                    {sinAnticipo && p.estado !== 'cancelado' && p.estado !== 'completado' && (
                      <div className="mt-2.5 bg-amber-50 border border-amber-200 text-amber-900 text-[10px] font-bold px-2 py-1 rounded-lg flex items-center space-x-1.5">
                        <Icons.Alert />
                        <span>⚠️ Sin anticipo recibido (Riesgo en cocina)</span>
                      </div>
                    )}

                    <div className="mt-3 py-2 border-y border-stone-100 space-y-1 text-xs">
                      <div className="flex items-center justify-between">
                        <span className="text-stone-500">Fecha de Entrega:</span>
                        <span className={`font-bold ${esHoy ? 'text-amber-800 bg-amber-100 px-1.5 py-0.5 rounded' : 'text-stone-800'}`}>
                          {p.fechaEntrega} ({p.horaEntrega})
                        </span>
                      </div>
                      <div className="text-stone-700 font-medium">
                        {(p.items || []).map((it, idx) => {
                          const r = (recetas || []).find(rec => rec.id === it.recetaId);
                          return (
                            <p key={idx} className="flex justify-between">
                              <span>• {it.cantidad}x {r?.nombre || 'Producto'}</span>
                            </p>
                          );
                        })}
                      </div>
                      {p.notas && (
                        <p className="text-[11px] text-amber-900 bg-amber-50/70 p-2 rounded-lg italic mt-1 border border-amber-100">
                          "{p.notas}"
                        </p>
                      )}
                    </div>

                    <div className="mt-3 flex items-center justify-between text-xs">
                      <div>
                        <span className="text-stone-400 text-[10px] uppercase font-bold block">Cobro Total</span>
                        <span className="text-sm font-extrabold text-stone-900">{formatCOP(p.totalCobrado)}</span>
                      </div>
                      <div className="text-right">

      const nombresRecetas = (pedido.items || []).map(it => {
        const r = (recetas || []).find(rec => rec.id === it.recetaId);

      const mensajePorDefecto = `¡Hola ${pedido.cliente}! 🧁 Te saludamos de nuestro taller de repostería.\n\n` +
        `Te confirmamos los detalles de tu encargo:\n` +

        `• *Fecha de Entrega:* ${pedido.fechaEntrega} a las ${pedido.horaEntrega}\n` +
        `• *Total:* ${formatCOP(pedido.totalCobrado)}\n` +
        `• *Abono recibido:* ${formatCOP(pedido.abono)}\n` +
        `• *Saldo pendiente contra entrega:* ${formatCOP(saldo)}\n` +
        (pedido.notas ? `• *Notas:* "${pedido.notas}"\n` : '') +
        `\n(Puedes realizar la transferencia del saldo a nuestra cuenta Nequi/Daviplata o cancelar en efectivo al recibir).\n` +
        `\n¡Ya estamos organizando todo con mucho cariño para que quede delicioso! ✨`;

      const [textoMensaje, setTextoMensaje] = useState(mensajePorDefecto);

      const copiarAlPortapapeles = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(textoMensaje).then(() => {
            dispararToast("¡Mensaje personalizado copiado al portapapeles!");
          }).catch(() => fallbackCopiar());
        } else {
          fallbackCopiar();
        }
      };

      const fallbackCopiar = () => {
        const ta = document.createElement("textarea");
        ta.value = textoMensaje;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        dispararToast("¡Mensaje copiado al portapapeles!");
      };

      const abrirWhatsAppDirecto = () => {
        const telLimpio = pedido.telefono ? pedido.telefono.replace(/\D/g, '') : '';
        if (telLimpio.length >= 10) {
          const url = `https://wa.me/57${telLimpio.startsWith('57') ? telLimpio : telLimpio}?text=${encodeURIComponent(textoMensaje)}`;
          window.open(url, '_blank');
          onCerrar();
        } else {
          copiarAlPortapapeles();
          alert("El cliente no tiene un teléfono móvil válido registrado. El texto ha sido copiado para que lo pegues manualmente.");
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-xs flex items-center justify-center p-4">

                  <span>Editor de Mensaje al Cliente</span>
                </span>
                <h3 className="font-serif-brand font-bold text-xl text-stone-900 mt-1">Confirmación: {pedido.cliente}</h3>
              </div>

              <button
                type="button"
                onClick={copiarAlPortapapeles}

              <div className="flex items-center space-x-2 w-full sm:w-auto justify-end">

                <button

    function ModalPaseCocina({ pedido, recetas, insumos, onCerrar, onConfirmar }) {
      const analisisInsumos = useMemo(() => {
        const total = {};
        (pedido.items || []).forEach(it => {
          const rec = (recetas || []).find(r => r.id === it.recetaId);
          if (rec) {
            (rec.ingredientes || []).forEach(ing => {
              const req = ing.cantidad * it.cantidad;
              total[ing.insumoId] = (total[ing.insumoId] || 0) + req;
            });
          }
        });

        return Object.keys(total).map(id => {
          const ins = (insumos || []).find(i => i.id === id) || { nombre: 'Insumo', unidad: '', stockActual: 0 };
          const necesario = total[id];
          const falta = Math.max(0, necesario - ins.stockActual);
          return { ...ins, necesario, falta, suficiente: ins.stockActual >= necesario };
        });
      }, [pedido, recetas, insumos]);

      const hayFaltantes = analisisInsumos.some(i => !i.suficiente);

      return (
        <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-stone-200">
            <div className="flex items-start justify-between">
              <div>
                <span className="text-xs font-bold text-amber-800 bg-amber-100 px-2 py-0.5 rounded-full uppercase">Control Previo de Bodega</span>

              </div>
              <button onClick={onCerrar} className="text-stone-400 hover:text-stone-600 font-bold text-lg">&times;</button>
            </div>

            <p className="text-xs text-stone-500 mt-1">Al confirmar, se descontará automáticamente el stock requerido de tus materias primas.</p>

            <div className="mt-4 border border-stone-200 rounded-2xl overflow-hidden max-h-60 overflow-y-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-stone-50 text-stone-500 font-bold border-b border-stone-200">
                  <tr>
                    <th className="p-2.5">Insumo</th>
                    <th className="p-2.5 text-center">Requerido</th>
                    <th className="p-2.5 text-center">En Bodega</th>
                    <th className="p-2.5 text-right">Estado</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-100">
                  {analisisInsumos.map(item => (
                    <tr key={item.id} className={item.suficiente ? '' : 'bg-rose-50/60'}>
                      <td className="p-2.5 font-medium text-stone-800">{item.nombre}</td>
                      <td className="p-2.5 text-center font-bold">{item.necesario} {item.unidad}</td>
                      <td className="p-2.5 text-center text-stone-600">{item.stockActual} {item.unidad}</td>
                      <td className="p-2.5 text-right font-bold">
                        {item.suficiente ? <span className="text-emerald-700">✅ OK</span> : <span className="text-rose-600">Falta {item.falta} {item.unidad}</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {hayFaltantes ? (
              <div className="mt-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800 flex items-start space-x-2">
                <Icons.Alert />
                <div>
                  <strong className="block font-bold">Insumos insuficientes:</strong>
                  Puedes iniciar la preparación igualmente si compraste insumos hoy sin registrar, pero tu stock quedará en 0.
                </div>
              </div>
            ) : (
              <div className="mt-4 p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 flex items-center space-x-2">
                <Icons.Check />
                <span>¡Tienes todos los insumos disponibles en bodega para este encargo!</span>
              </div>
            )}

            <div className="flex items-center justify-end space-x-3 pt-5 border-t border-stone-100 mt-4">
              <button onClick={onCerrar} className="px-4 py-2.5 text-xs font-bold text-stone-500 hover:bg-stone-100 rounded-xl">Volver</button>
              <button onClick={onConfirmar} className="px-5 py-2.5 text-xs font-bold bg-amber-600 hover:bg-amber-700 text-white rounded-xl shadow-md">
                Confirmar y Descontar de Bodega
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. PREPARACIÓN & COCINA (DOBLE VISTA: Mesa de Trabajo vs Abastecimiento)
    // =========================================================================
    function CocinaView({ pedidos, recetas, insumos, dispararToast }) {
      const [vistaCocina, setVistaCocina] = useState("mesa");
      const [incluirPendientes, setIncluirPendientes] = useState(true);

      const pedidosEnCocina = (pedidos || []).filter(p => p.estado === 'en_preparacion');
      const pedidosPendientes = (pedidos || []).filter(p => p.estado === 'pendiente');

      const pedidosParaAbastecimiento = useMemo(() => {
        return incluirPendientes ? [...pedidosEnCocina, ...pedidosPendientes] : pedidosEnCocina;
      }, [pedidosEnCocina, pedidosPendientes, incluirPendientes]);

      const insumosRequeridosConsolidados = useMemo(() => {
        const total = {};
        pedidosParaAbastecimiento.forEach(p => {
          (p.items || []).forEach(it => {
            const rec = (recetas || []).find(r => r.id === it.recetaId);
            if (rec) {
              (rec.ingredientes || []).forEach(ing => {
                total[ing.insumoId] = (total[ing.insumoId] || 0) + (ing.cantidad * it.cantidad);
              });
            }
          });
        });

        return Object.keys(total).map(id => {
          const ins = (insumos || []).find(i => i.id === id) || {
            nombre: 'Insumo', unidad: '', stockActual: 0,
            presentacionNombre: 'Unidad', presentacionCantidad: 1, precioPresentacion: 0
          };
          const totalReq = total[id];
          const stockActual = ins.stockActual || 0;
          const falta = Math.max(0, totalReq - stockActual);

          const presCant = ins.presentacionCantidad > 0 ? ins.presentacionCantidad : 1;
          const paquetesAComprar = falta > 0 ? Math.ceil(falta / presCant) : 0;
          const totalComprado = paquetesAComprar * presCant;
          const sobranteEnBodega = totalComprado > 0 ? totalComprado - falta : 0;
          const costoEstimadoCompra = paquetesAComprar * (ins.precioPresentacion || 0);

          return { ...ins, totalReq, stockActual, falta, paquetesAComprar, sobranteEnBodega, costoEstimadoCompra };
        });
      }, [pedidosParaAbastecimiento, recetas, insumos]);

      const insumosFaltantes = insumosRequeridosConsolidados.filter(i => i.falta > 0);
      const totalPresupuestoCompras = insumosFaltantes.reduce((sum, i) => sum + i.costoEstimadoCompra, 0);

      const generarTextoWhatsApp = () => {
        const fecha = new Date().toLocaleDateString('es-CO');
        let txt = `🧁 *LISTA DE COMPRAS - GASTROFLOW*\n`;
        txt += `📅 *Fecha:* ${fecha}\n`;
        txt += `🎯 *Encargos a Producir:* ${pedidosParaAbastecimiento.length} pedidos activos\n\n`;

        if (insumosFaltantes.length === 0) {
          txt += `✅ *¡Buenas noticias!* Dispones de todos los insumos necesarios en bodega.\n`;
        } else {
          txt += `🛒 *INSUMOS A COMPRAR (Ajustado a empaques reales):*\n`;
          insumosFaltantes.forEach(i => {
            txt += `\n• *${i.nombre}*\n`;
            txt += `  - Requerido para cocina: ${i.totalReq} ${i.unidad} (Faltante: ${i.falta} ${i.unidad})\n`;
            txt += `  - 👉 *Comprar:* ${i.paquetesAComprar}x [${i.presentacionNombre}] (~${formatCOP(i.costoEstimadoCompra)})\n`;
            if (i.sobranteEnBodega > 0) {
              txt += `  - (Quedarán ~${i.sobranteEnBodega} ${i.unidad} de reserva en bodega)\n`;
            }
          });
          txt += `\n💰 *Presupuesto Total Estimado:* ${formatCOP(totalPresupuestoCompras)}\n`;
        }

        txt += `\n---\n_Generado automáticamente desde GastroFlow Artisan_`;
        return txt;
      };

      const copiarAlPortapapeles = () => {
        const texto = generarTextoWhatsApp();
        const fallbackCopiar = () => {
          const ta = document.createElement("textarea");
          ta.value = texto;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          dispararToast("¡Lista de compras copiada al portapapeles!");
        };

        if (navigator.clipboard) {
          navigator.clipboard.writeText(texto)
            .then(() => dispararToast("¡Lista de compras copiada al portapapeles!"))
            .catch(() => fallbackCopiar());
        } else {
          fallbackCopiar();
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-serif-brand font-bold text-stone-900">Mesa de Preparación & Cocina</h2>
              <p className="text-xs text-stone-500">Planificador de producción por tanda y compras consolidadas para WhatsApp.</p>
            </div>

            <div className="flex items-center space-x-1 bg-stone-100 p-1 rounded-xl">
              <button
                onClick={() => setVistaCocina("mesa")}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 ${
                  vistaCocina === "mesa" ? "bg-white text-stone-900 shadow-xs" : "text-stone-500"
                }`}
              >
                <Icons.Scale />
                <span>Mesa de Trabajo (Por Tanda)</span>
              </button>
              <button
                onClick={() => setVistaCocina("compras")}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 ${
                  vistaCocina === "compras" ? "bg-white text-stone-900 shadow-xs" : "text-stone-500"
                }`}
              >
                <Icons.Box />
                <span>Abastecimiento & Lista Compras</span>
              </button>
            </div>
          </div>

          {/* VISTA 1: MESA DE TRABAJO (POR TANDA INDIVIDUAL) */}
          {vistaCocina === "mesa" && (
            <div className="space-y-6">
              <div className="bg-amber-50/60 border border-amber-200/80 p-4 rounded-2xl flex items-center justify-between text-xs">
                <div>
                  <strong className="text-amber-900 font-bold block text-sm">Pesaje frente a la Balanza</strong>
                  <p className="text-stone-600 mt-0.5">
                    Aquí ves lo que lleva específicamente cada pedido individual para hornearlo sin mezclar ingredientes de otros lotes.
                  </p>
                </div>
                <span className="text-amber-800 font-extrabold bg-amber-100 px-3 py-1 rounded-full">
                  {pedidosEnCocina.length} pedidos en preparación
                </span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {pedidosEnCocina.map(p => (
                  <div key={p.id} className="bg-white rounded-2xl border border-stone-200 p-5 shadow-xs space-y-4">
                    <div className="flex items-start justify-between pb-3 border-b border-stone-100">
                      <div>
                        <span className="text-[10px] font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full uppercase">
                          En Mesa de Trabajo
                        </span>
                        <h3 className="text-base font-bold text-stone-900 mt-1">{p.cliente} ({p.id})</h3>
                        <p className="text-xs text-stone-500">Entrega: {p.fechaEntrega} a las {p.horaEntrega}</p>
                      </div>
                      <span className="text-xs font-bold text-stone-700">{(p.items || []).length} receta(s)</span>
                    </div>

                    {(p.items || []).map((it, idx) => {
                      const rec = (recetas || []).find(r => r.id === it.recetaId);
                      return (
                        <div key={idx} className="bg-stone-50 rounded-xl p-3 border border-stone-100 space-y-2">
                          <div className="flex items-center justify-between">
                            <strong className="text-stone-800 text-xs">{it.cantidad}x {rec?.nombre || 'Producto'}</strong>
                            <span className="text-[10px] text-stone-400 font-semibold">{rec?.tiempoMinutos || 0} mins</span>
                          </div>

                          <div className="bg-white rounded-lg border border-stone-200 overflow-hidden">
                            <table className="w-full text-left text-xs">
                              <thead className="bg-stone-100/60 text-stone-500 font-bold">
                                <tr>
                                  <th className="p-2">Ingrediente para este tazón</th>
                                  <th className="p-2 text-right">Peso / Cantidad</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-stone-100">
                                {(rec?.ingredientes || []).map((ing, iIdx) => {
                                  const ins = (insumos || []).find(i => i.id === ing.insumoId);
                                  const cantidadLote = ing.cantidad * it.cantidad;
                                  return (
                                    <tr key={iIdx}>
                                      <td className="p-2 text-stone-700">{ins?.nombre || 'Insumo'}</td>
                                      <td className="p-2 text-right font-black text-amber-900 text-sm">
                                        {cantidadLote} {ins?.unidad}
                                      </td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      );
                    })}

                    {p.notas && (
                      <p className="text-xs text-amber-900 bg-amber-50 p-2.5 rounded-xl italic border border-amber-100">
                        "{p.notas}"
                      </p>
                    )}
                  </div>
                ))}

                {pedidosEnCocina.length === 0 && (
                  <div className="col-span-full py-12 text-center text-stone-400 bg-white rounded-2xl border border-stone-200">
                    <Icons.ChefHat />
                    <p className="mt-2 text-sm font-semibold">No tienes pedidos en preparación activa.</p>
                    <p className="text-xs text-stone-400 mt-0.5">Ve a la Libreta de Encargos y pulsa 'Validar & Pasar a Cocina' en el pedido que vayas a preparar.</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* VISTA 2: ABASTECIMIENTO GLOBAL */}
          {vistaCocina === "compras" && (
            <div className="space-y-6">
              <div className="flex items-center justify-between bg-white p-4 rounded-2xl border border-stone-200">
                <label className="text-xs text-stone-700 flex items-center space-x-2 cursor-pointer font-bold">
                  <input
                    type="checkbox"
                    checked={incluirPendientes}
                    onChange={e => setIncluirPendientes(e.target.checked)}
                    className="rounded text-amber-600 focus:ring-amber-500"
                  />
                  <span>Incluir pedidos en estado 'Pendiente' (Para surtido previo)</span>
                </label>

                <button
                  onClick={copiarAlPortapapeles}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-md transition flex items-center space-x-2"
                >
                  <Icons.WhatsApp />
                  <span>Copiar Lista para WhatsApp</span>
                </button>
              </div>

              {insumosFaltantes.length > 0 && (
                <div className="bg-gradient-to-r from-emerald-900 to-stone-900 text-white p-5 rounded-2xl shadow-md flex items-center justify-between">
                  <div>
                    <span className="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Presupuesto Requerido</span>
                    <p className="text-xs text-stone-300 mt-0.5">Dinero total para comprar los paquetes comerciales faltantes:</p>
                  </div>
                  <div className="text-right">
                    <span className="text-xs text-stone-400 block font-semibold">{insumosFaltantes.length} productos</span>
                    <span className="text-2xl font-black text-emerald-400">{formatCOP(totalPresupuestoCompras)}</span>
                  </div>
                </div>
              )}

              <div className="bg-white rounded-2xl border border-stone-200 shadow-xs overflow-hidden">
                <div className="p-4 bg-stone-50/80 border-b border-stone-200 flex items-center justify-between">
                  <h3 className="font-bold text-stone-800 text-sm">Consolidado Total de Materia Prima vs Bodega</h3>
                  <span className="text-xs font-bold text-stone-600 bg-white px-3 py-1 rounded-full border border-stone-200">
                    {insumosFaltantes.length} faltantes
                  </span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-stone-100/70 text-stone-600 font-bold border-b border-stone-200">
                      <tr>
                        <th className="p-3">Insumo</th>
                        <th className="p-3 text-center">Consumo Total</th>
                        <th className="p-3 text-center">En Bodega</th>
                        <th className="p-3 text-center">Falta Neta</th>
                        <th className="p-3 text-center">Presentación Comercial</th>
                        <th className="p-3 text-right">👉 Comprar Exacto</th>
                        <th className="p-3 text-right">Sobrante Estimado</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-stone-100">
                      {insumosRequeridosConsolidados.map(item => (
                        <tr key={item.id} className={item.falta > 0 ? 'bg-amber-50/40 hover:bg-amber-50' : 'hover:bg-stone-50'}>
                          <td className="p-3 font-semibold text-stone-900">{item.nombre}</td>
                          <td className="p-3 text-center font-bold text-stone-800">{item.totalReq} {item.unidad}</td>
                          <td className="p-3 text-center text-stone-500">{item.stockActual} {item.unidad}</td>
                          <td className="p-3 text-center font-bold">
                            {item.falta > 0 ? <span className="text-rose-600">{item.falta} {item.unidad}</span> : <span className="text-emerald-600">Suficiente</span>}
                          </td>
                          <td className="p-3 text-center text-stone-600">
                            {item.presentacionNombre} ({item.presentacionCantidad} {item.unidad})
                          </td>
                          <td className="p-3 text-right font-black">
                            {item.paquetesAComprar > 0 ? (
                              <span className="text-amber-800 bg-amber-100 px-2 py-1 rounded-md">
                                {item.paquetesAComprar}x {item.presentacionNombre}
                              </span>
                            ) : (
                              <span className="text-stone-400 font-normal">0</span>
                            )}
                          </td>
                          <td className="p-3 text-right text-stone-500">
                            {item.sobranteEnBodega > 0 ? `+${item.sobranteEnBodega} ${item.unidad}` : '-'}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 4. BODEGA E INSUMOS (EDICIÓN COMPLETA + ACCIONES)
    // =========================================================================
    function InventarioBodegaView({ insumos, setInsumos, historialMermas, setHistorialMermas, insumoParaComprar, setInsumoParaComprar, dispararToast }) {
      const [modalCompra, setModalCompra] = useState(null);
      const [modalMerma, setModalMerma] = useState(null);
      const [modalNuevoInsumo, setModalNuevoInsumo] = useState(false);
      const [insumoParaEditar, setInsumoParaEditar] = useState(null);
      const [filtro, setFiltro] = useState("");

      useEffect(() => {
        if (insumoParaComprar) {
          setModalCompra(insumoParaComprar);
          setInsumoParaComprar(null);
        }
      }, [insumoParaComprar, setInsumoParaComprar]);

      const insumosFiltrados = (insumos || []).filter(i => (i.nombre || "").toLowerCase().includes((filtro || "").toLowerCase()));

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-serif-brand font-bold text-stone-900">Bodega e Insumos</h2>
              <p className="text-xs text-stone-500">Materia prima, empaques comerciales, precios de compra y registro de mermas.</p>
            </div>

            <div className="flex items-center space-x-2">
              <input
                type="text"
                placeholder="Buscar insumo..."
                value={filtro}
                onChange={e => setFiltro(e.target.value)}
                className="bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-amber-500 outline-none w-44 sm:w-60"
              />
              <button
                onClick={() => setModalNuevoInsumo(true)}
                className="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-sm transition flex items-center space-x-1"
              >
                <span>+ Crear Insumo</span>
              </button>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-stone-200 shadow-xs overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-stone-50 text-stone-600 font-bold border-b border-stone-200">
                  <tr>
                    <th className="p-3">Insumo / Marca</th>
                    <th className="p-3 text-center">Unidad Base</th>
                    <th className="p-3 text-center">Stock Actual</th>
                    <th className="p-3 text-center">Stock Mínimo</th>
                    <th className="p-3 text-center">Presentación Comercial</th>
                    <th className="p-3 text-right">Costo Base</th>
                    <th className="p-3 text-center">Estado</th>
                    <th className="p-3 text-right">Acciones</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-100">
                  {insumosFiltrados.map(item => {
                    const esCritico = item.stockActual <= item.stockMinimo;
                    return (
                      <tr key={item.id} className={esCritico ? 'bg-rose-50/40 hover:bg-rose-50' : 'hover:bg-stone-50'}>
                        <td className="p-3">
                          <p className="font-bold text-stone-900">{item.nombre}</p>
                          <p className="text-[10px] text-stone-400">Prov: {item.proveedor || 'Sin proveedor'}</p>
                        </td>
                        <td className="p-3 text-center font-bold text-stone-700">{item.unidad}</td>
                        <td className="p-3 text-center">
                          <span className={`font-black ${esCritico ? 'text-rose-600' : 'text-stone-900'}`}>
                            {item.stockActual} {item.unidad}
                          </span>
                        </td>
                        <td className="p-3 text-center text-stone-400">{item.stockMinimo} {item.unidad}</td>
                        <td className="p-3 text-center text-stone-700">
                          {item.presentacionNombre}
                          <span className="block text-[10px] text-stone-400 font-semibold">{formatCOP(item.precioPresentacion)}</span>
                        </td>
                        <td className="p-3 text-right font-bold text-stone-800">
                          {formatCOP(item.costoUnitario)} <span className="text-[10px] text-stone-400 font-normal">/{item.unidad}</span>
                        </td>
                        <td className="p-3 text-center">
                          {esCritico ? (
                            <span className="text-[10px] font-bold bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full">Crítico</span>
                          ) : (
                            <span className="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">Óptimo</span>
                          )}
                        </td>
                        <td className="p-3 text-right space-x-1.5 whitespace-nowrap">
                          <button
                            onClick={() => setInsumoParaEditar(item)}
                            className="bg-stone-100 hover:bg-amber-100 text-stone-700 hover:text-amber-800 font-bold px-2.5 py-1 rounded-lg text-[11px] transition inline-flex items-center space-x-1"
                            title="Editar Datos del Insumo"
                          >
                            <Icons.Edit />
                            <span>Editar</span>
                          </button>
                          <button
                            onClick={() => setModalCompra(item)}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-2.5 py-1 rounded-lg text-[11px] shadow-xs transition"
                            title="Registrar Compra / Entrada"
                          >
                            + Compra
                          </button>
                          <button
                            onClick={() => setModalMerma(item)}
                            className="bg-stone-100 hover:bg-rose-100 text-stone-600 hover:text-rose-700 font-bold px-2 py-1 rounded-lg text-[11px] transition"
                            title="Registrar Salida / Merma"
                          >
                            - Merma
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {insumoParaEditar && (
            <ModalEditarInsumo
              insumo={insumoParaEditar}
              onCerrar={() => setInsumoParaEditar(null)}
              onGuardar={(insumoActualizado) => {
                setInsumos((insumos || []).map(i => i.id === insumoActualizado.id ? insumoActualizado : i));
                setInsumoParaEditar(null);
                dispararToast(`Insumo '${insumoActualizado.nombre}' actualizado con éxito`);
              }}
            />
          )}

          {modalCompra && (
            <ModalRegistroCompra
              insumo={modalCompra}
              onCerrar={() => setModalCompra(null)}
              onConfirmar={(paquetes, nuevoPrecioPresentacion) => {
                const cantidadAAgregar = paquetes * modalCompra.presentacionCantidad;
                const nuevoCostoUnitario = nuevoPrecioPresentacion / modalCompra.presentacionCantidad;

                setInsumos((insumos || []).map(i => {
                  if (i.id === modalCompra.id) {
                    return {
                      ...i,
                      stockActual: i.stockActual + cantidadAAgregar,
                      precioPresentacion: nuevoPrecioPresentacion,
                      costoUnitario: nuevoCostoUnitario
                    };
                  }
                  return i;
                }));

                setModalCompra(null);
                dispararToast(`Compra registrada: +${cantidadAAgregar} ${modalCompra.unidad} de ${modalCompra.nombre}`);
              }}
            />
          )}

          {modalMerma && (
            <ModalRegistroMerma
              insumo={modalMerma}
              onCerrar={() => setModalMerma(null)}
              onConfirmar={(cantidadMerma, motivo) => {
                const costoPerdido = cantidadMerma * modalMerma.costoUnitario;

                setInsumos((insumos || []).map(i => {
                  if (i.id === modalMerma.id) {
                    return { ...i, stockActual: Math.max(0, i.stockActual - cantidadMerma) };
                  }
                  return i;
                }));

                setHistorialMermas([
                  {
                    id: `mrm-${Date.now()}`,
                    fecha: new Date().toISOString(),
                    insumoNombre: modalMerma.nombre,
                    cantidad: cantidadMerma,
                    unidad: modalMerma.unidad,
                    costoPerdidoCOP: costoPerdido,
                    motivo
                  },
                  ...(historialMermas || [])
                ]);

                setModalMerma(null);
                dispararToast(`Merma registrada: -${cantidadMerma} ${modalMerma.unidad} (${formatCOP(costoPerdido)})`);
              }}
            />
          )}

          {modalNuevoInsumo && (
            <ModalEditarInsumo
              insumo={null}
              onCerrar={() => setModalNuevoInsumo(false)}
              onGuardar={(nuevoInsumo) => {
                setInsumos([...(insumos || []), nuevoInsumo]);
                setModalNuevoInsumo(false);
                dispararToast(`Insumo '${nuevoInsumo.nombre}' creado en bodega`);
              }}
            />
          )}
        </div>
      );
    }

    function ModalEditarInsumo({ insumo, onCerrar, onGuardar }) {
      const esEdicion = !!insumo;

      const [nombre, setNombre] = useState(insumo?.nombre || "");
      const [unidad, setUnidad] = useState(insumo?.unidad || "g");
      const [stockActual, setStockActual] = useState(insumo?.stockActual ?? 1000);
      const [stockMinimo, setStockMinimo] = useState(insumo?.stockMinimo ?? 500);
      const [presentacionNombre, setPresentacionNombre] = useState(insumo?.presentacionNombre || "Bolsa 1 kg");
      const [presentacionCantidad, setPresentacionCantidad] = useState(insumo?.presentacionCantidad ?? 1000);
      const [precioPresentacion, setPrecioPresentacion] = useState(insumo?.precioPresentacion ?? 5000);
      const [proveedor, setProveedor] = useState(insumo?.proveedor || "");

      const handleSubmit = (e) => {
        e.preventDefault();
        const presCant = Number(presentacionCantidad) > 0 ? Number(presentacionCantidad) : 1;
        const costoUnitario = Number(precioPresentacion) / presCant;

        const resultado = {
          id: insumo?.id || `ins-${Date.now()}`,
          nombre,
          unidad,
          stockActual: Number(stockActual),
          stockMinimo: Number(stockMinimo),
          presentacionNombre,
          presentacionCantidad: presCant,
          precioPresentacion: Number(precioPresentacion),
          costoUnitario,
          proveedor
        };

        onGuardar(resultado);
      };

      return (
        <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-stone-200">
            <h3 className="font-serif-brand font-bold text-xl text-stone-900">
              {esEdicion ? `Editar Insumo: ${insumo.nombre}` : 'Crear Insumo en Bodega'}
            </h3>
            <p className="text-xs text-stone-500 mt-0.5">Establece la unidad base y cómo se compra en proveedor.</p>

            <form onSubmit={handleSubmit} className="mt-4 space-y-3 text-xs">
              <div>
                <label className="font-bold text-stone-700 block mb-1">Nombre del Insumo / Marca *</label>
                <input
                  type="text"
                  required
                  placeholder="Ej. Arequipe La Lechera Repostero"
                  value={nombre}
                  onChange={e => setNombre(e.target.value)}
                  className="w-full border border-stone-300 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-amber-500"
                />
              </div>

              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="font-bold text-stone-700 block mb-1">Unidad Base</label>
                  <select
                    value={unidad}
                    onChange={e => setUnidad(e.target.value)}
                    className="w-full border border-stone-300 rounded-xl p-2.5 outline-none bg-white font-bold"
                  >
                    <option value="g">Gramos (g)</option>
                    <option value="ml">Mililitros (ml)</option>
                    <option value="und">Unidad (und)</option>
                  </select>
                </div>
                <div>
                  <label className="font-bold text-stone-700 block mb-1">Stock Actual</label>
                  <input
                    type="number"
                    value={stockActual}
                    onChange={e => setStockActual(e.target.value)}
                    className="w-full border border-stone-300 rounded-xl p-2.5 outline-none"
                  />
                </div>
                <div>
                  <label className="font-bold text-stone-700 block mb-1">Stock Mínimo</label>
                  <input
                    type="number"
                    value={stockMinimo}
                    onChange={e => setStockMinimo(e.target.value)}
                    className="w-full border border-stone-300 rounded-xl p-2.5 outline-none"
                  />
                </div>
              </div>

              <div className="p-3 bg-amber-50/60 rounded-2xl border border-amber-200/60 space-y-2">
                <span className="font-bold text-amber-900 block">Presentación Comercial (Supermercado / Distribuidor)</span>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[11px] text-stone-600 block mb-0.5">Nombre Empaque</label>
                    <input
                      type="text"
                      placeholder="Ej. Pote 1.000 g"
                      value={presentacionNombre}
                      onChange={e => setPresentacionNombre(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg p-2 bg-white"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-stone-600 block mb-0.5">Contenido ({unidad})</label>
                    <input
                      type="number"
                      value={presentacionCantidad}
                      onChange={e => setPresentacionCantidad(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg p-2 bg-white"
                    />
                  </div>
                </div>
                <div>
                  <label className="text-[11px] text-stone-600 block mb-0.5">Precio de Compra por Empaque ($ COP)</label>
                  <input
                    type="number"
                    value={precioPresentacion}
                    onChange={e => setPrecioPresentacion(e.target.value)}
                    className="w-full border border-stone-300 rounded-lg p-2 bg-white font-bold text-stone-900"
                  />
                </div>
              </div>

              <div>
                <label className="font-bold text-stone-700 block mb-1">Proveedor Habitual</label>
                <input
                  type="text"
                  placeholder="Ej. Makro, Éxito, Central Mayorista"
                  value={proveedor}
                  onChange={e => setProveedor(e.target.value)}

            </form>
          </div>
        </div>
      );
    }
