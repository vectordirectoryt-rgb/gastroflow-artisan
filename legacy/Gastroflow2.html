          )}
        </div>
      );
    }

    // ==========================================
    // 4. RECETAS & RADIOGRAFÍA DEL TIEMPO
    // ==========================================
    function RecetasView({ productos, setProductos, insumos, calcularCosteoProducto, showToast }) {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);

      // Formulario
      const [nombre, setNombre] = useState("");
      const [categoria, setCategoria] = useState("Tartas & Pasteles");
      const [unidadesPorLote, setUnidadesPorLote] = useState(1);
      const [precioVenta, setPrecioVenta] = useState("");
      const [tiempoHornoMinutos, setTiempoHornoMinutos] = useState(45);
      const [costoHoraEnergia, setCostoHoraEnergia] = useState(1.50);
      const [tiempoPreparacionHoras, setTiempoPreparacionHoras] = useState(2.0);
      const [itemsReceta, setItemsReceta] = useState([]);

      // Simulador "¿Qué pasaría si...?"
      const [simSueldoHora, setSimSueldoHora] = useState(12.00);
      const [simMargenExtra, setSimMargenExtra] = useState(20);

      const handleOpenModal = (prod = null) => {
        if (prod) {
          setEditingId(prod.id);
          setNombre(prod.nombre);
          setCategoria(prod.categoria);
          setUnidadesPorLote(prod.unidadesPorLote || 1);
          setPrecioVenta(prod.precioVenta || "");
          setTiempoHornoMinutos(prod.tiempoHornoMinutos || 0);
          setCostoHoraEnergia(prod.costoHoraEnergia || 1.50);
          setTiempoPreparacionHoras(prod.tiempoPreparacionHoras || 1.0);
          setItemsReceta(prod.items || []);
        } else {
          setEditingId(null);
          setNombre("");
          setCategoria("Tartas & Pasteles");
          setUnidadesPorLote(1);
          setPrecioVenta("");
          setTiempoHornoMinutos(45);
          setCostoHoraEnergia(1.50);
          setTiempoPreparacionHoras(2.0);
          setItemsReceta([]);
        }
        setIsModalOpen(true);
      };

      const handleAddItem = () => {
        if (insumos.length === 0) return alert("Primero debes registrar insumos.");
        setItemsReceta([...itemsReceta, { insumoId: insumos[0].id, cantidad: 100, unidad: insumos[0].unidad }]);
      };

      const handleSave = (e) => {
        e.preventDefault();
        const data = {
          nombre: nombre.trim(),
          categoria,
          unidadesPorLote: Math.max(1, parseInt(unidadesPorLote) || 1),
          precioVenta: parseFloat(precioVenta) || 0,
          tiempoHornoMinutos: parseFloat(tiempoHornoMinutos) || 0,
          costoHoraEnergia: parseFloat(costoHoraEnergia) || 0,
          tiempoPreparacionHoras: parseFloat(tiempoPreparacionHoras) || 0.1,
          items: itemsReceta
        };

        if (editingId) {
          setProductos(prev => prev.map(p => p.id === editingId ? { ...p, ...data } : p));
          showToast("Receta actualizada.");
        } else {
          setProductos(prev => [...prev, { id: "prod-" + Date.now(), ...data }]);
          showToast("Nueva receta creada y costeada.");
        }
        setIsModalOpen(false);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Recetas & Radiografía del Tiempo</h2>
              <p className="text-sm text-slate-500 mt-1">Descubre cuánto estás ganando por hora con tus precios actuales y simula metas ideales.</p>
            </div>
            <button
              onClick={() => handleOpenModal()}
              className="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl shadow-sm transition"
            >
              + Nueva Receta
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {productos.map(prod => {
              const r = calcularCosteoProducto(prod);

              // Cálculo del Simulador
              const costoTotalConSueldoIdeal = r.costoDirectoLote + (simSueldoHora * r.horasTrabajo);
              const precioSugeridoIdeal = costoTotalConSueldoIdeal / (1 - (simMargenExtra / 100));

              return (
                <div key={prod.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="text-[10px] font-extrabold uppercase text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                          {prod.categoria}
                        </span>
                        <h3 className="text-lg font-black text-slate-900 mt-1">{prod.nombre}</h3>
                        <p className="text-xs text-slate-400">Rinde: {prod.unidadesPorLote} unidades &bull; Horno: {prod.tiempoHornoMinutos} min &bull; Tiempo trabajo: {prod.tiempoPreparacionHoras} hrs</p>
                      </div>
                      <button onClick={() => handleOpenModal(prod)} className="text-slate-400 hover:text-amber-600 text-sm font-bold">✏️ Editar</button>
                    </div>

                    {/* RADIOGRAFÍA: CUÁNTO GANA POR HORA DE TRABAJO */}
                    <div className="my-4 p-4 rounded-xl bg-gradient-to-r from-slate-900 to-slate-800 text-white">
                      <div className="flex justify-between items-center">
                        <div>
                          <span className="text-[10px] font-black uppercase text-amber-400 tracking-wider">Tu Sueldo Real en esta Receta</span>
                          <p className="text-2xl font-black font-mono text-emerald-400 mt-0.5">
                            {formatMoney(r.gananciaPorHora)} <span className="text-xs text-slate-300 font-bold">/ hora</span>
                          </p>
                        </div>
                        <div className="text-right">
                          <span className="text-[10px] font-bold text-slate-400 uppercase">Margen Actual</span>
                          <p className="text-lg font-bold font-mono text-amber-400">{r.margenPorcentaje.toFixed(1)}%</p>
                        </div>
                      </div>

                      <div className="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-slate-700/60 text-[11px] text-slate-300">
                        <div>
                          <span className="block text-slate-400 text-[10px]">Costo Directo</span>
                          <span className="font-bold font-mono">{formatMoney(r.costoDirectoLote)}</span>
                        </div>
                        <div>
                          <span className="block text-slate-400 text-[10px]">Precio Venta Hoy</span>
                          <span className="font-bold font-mono text-white">{formatMoney(prod.precioVenta)}</span>
                        </div>
                        <div>
                          <span className="block text-slate-400 text-[10px]">Ganancia en Mano</span>
                          <span className="font-bold font-mono text-emerald-400">+{formatMoney(r.gananciaLote)}</span>
                        </div>
                      </div>
                    </div>

                    {/* SIMULADOR "¿QUÉ PASARÍA SI...?" */}
                    <div className="bg-amber-50/70 p-3.5 rounded-xl border border-amber-200/80 text-xs space-y-2">
                      <span className="font-extrabold text-amber-900 text-[11px] flex items-center gap-1">
                        <span>💡</span> Simulador: Si quisieras ganar más...
                      </span>
                      <p className="text-[11px] text-amber-800">
                        Si quisieras ganar <strong>${simSueldoHora}/hora</strong> y dejar <strong>{simMargenExtra}%</strong> de ganancia para el negocio:
                      </p>
                      <div className="flex justify-between items-center pt-1 font-mono">
                        <span className="text-[11px] text-slate-600">Precio Sugerido Ideal:</span>
                        <span className="font-black text-sm text-slate-900">{formatMoney(precioSugeridoIdeal)}</span>
                      </div>
                    </div>
                  </div>

                  <div className="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                    <span>{prod.items?.length || 0} insumos en la receta</span>
                    <span className="font-mono">Costo Unit.: {formatMoney(r.costoDirectoUnitario)}</span>
                  </div>
                </div>
              );
            })}
          </div>

          {/* MODAL CONSTRUCTOR DE RECETAS */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-6 border border-slate-200 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-base font-bold text-slate-900">{editingId ? "Editar Receta" : "Crear Nueva Receta"}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleSave} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-700">Nombre del Producto</label>
                      <input
                        type="text"
                        required
                        value={nombre}
                        onChange={e => setNombre(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Categoría</label>
                      <input
                        type="text"
                        value={categoria}
                        onChange={e => setCategoria(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div>
                      <label className="font-bold text-slate-700">Unidades por Lote</label>
                      <input
                        type="number"
                        min="1"
                        value={unidadesPorLote}
                        onChange={e => setUnidadesPorLote(Math.max(1, parseInt(e.target.value) || 1))}
                        className="w-full px-3 py-1.5 rounded-lg border border-slate-200 font-bold"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Horno (Minutos)</label>
                      <input
                        type="number"
                        value={tiempoHornoMinutos}
                        onChange={e => setTiempoHornoMinutos(parseFloat(e.target.value) || 0)}
                        className="w-full px-3 py-1.5 rounded-lg border border-slate-200"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Tu Tiempo (Horas)</label>
                      <input
                        type="number"
                        step="0.1"
                        value={tiempoPreparacionHoras}
                        onChange={e => setTiempoPreparacionHoras(parseFloat(e.target.value) || 0.1)}
                        className="w-full px-3 py-1.5 rounded-lg border border-slate-200 font-bold text-amber-700"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700">Precio de Venta Actual ($ lo que cobras hoy)</label>
                    <input
                      type="number"
                      step="any"
                      required
                      placeholder="Ej: 38.00"
                      value={precioVenta}
                      onChange={e => setPrecioVenta(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold font-mono text-sm"
                    />
                  </div>

                  {/* Constructor de Insumos con Conversión Inteligente */}
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <label className="font-bold text-slate-700 uppercase">Ingredientes y Empaques</label>
                      <button type="button" onClick={handleAddItem} className="px-3 py-1 bg-amber-50 text-amber-800 font-bold rounded-lg border border-amber-200">+ Agregar Insumo</button>
                    </div>

                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                      {itemsReceta.map((it, idx) => {
                        const targetIns = insumos.find(i => i.id === it.insumoId);

                        return (
                          <div key={idx} className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                            <select
                              value={it.insumoId}
                              onChange={e => {
                                const copy = [...itemsReceta];
                                copy[idx].insumoId = e.target.value;
                                setItemsReceta(copy);
                              }}
                              className="flex-1 px-2 py-1 rounded border border-slate-200 text-xs bg-white font-bold"
                            >
                              {insumos.map(i => (
                                <option key={i.id} value={i.id}>{i.nombre} ({i.categoria})</option>
                              ))}
                            </select>

                            <input
                              type="number"
                              step="any"
                              value={it.cantidad}
                              onChange={e => {
                                const copy = [...itemsReceta];
                                copy[idx].cantidad = parseFloat(e.target.value) || 0;
                                setItemsReceta(copy);
                              }}
                              placeholder="Cant."
                              className="w-20 px-2 py-1 rounded border border-slate-200 text-xs font-mono font-bold"
                            />

                            <select
                              value={it.unidad || targetIns?.unidad}
                              onChange={e => {
                                const copy = [...itemsReceta];
                                copy[idx].unidad = e.target.value;
                                setItemsReceta(copy);
                              }}
                              className="w-20 px-1 py-1 rounded border border-slate-200 text-xs bg-white"
                            >
                              <option value="g">g</option>
                              <option value="kg">kg</option>
                              <option value="ml">ml</option>
                              <option value="L">L</option>
                              <option value="unidad">unid.</option>
                            </select>

                            <button
                              type="button"
                              onClick={() => setItemsReceta(itemsReceta.filter((_, i) => i !== idx))}
                              className="text-slate-400 hover:text-rose-600 font-bold px-1"
                            >
                              &times;
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 rounded-xl text-slate-500 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow">Guardar Receta</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 5. INSUMOS & HISTORIAL DE PRECIOS
    // ==========================================

                    <div>
                      <label className="font-bold text-slate-700">Alerta Mínimo</label>
                      <input type="number" step="any" value={stockMinimo} onChange={e => setStockMinimo(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-3 py-1.5 rounded-lg text-slate-500 font-bold">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-amber-500 text-white font-bold rounded-lg shadow">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. HISTORIAL & AUDITORÍA
    // ==========================================
    function HistorialAuditoriaView({ ventas, pedidos, historialPrecios, mermas, productos }) {
      const [subTab, setSubTab] = useState("mermas"); // mermas, precios, pedidos_finalizados

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Historial & Auditoría</h2>
              <p className="text-sm text-slate-500 mt-1">Registros históricos de mermas, variación de precios y entregas finalizadas.</p>
            </div>
            <div className="flex items-center gap-2">
              {[
                { id: "mermas", l: "Mermas & Pérdidas" },
                { id: "precios", l: "Histórico de Precios" },
                { id: "pedidos_finalizados", l: "Pedidos Entregados" }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setSubTab(t.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold ${
                    subTab === t.id ? "bg-slate-900 text-white" : "bg-white text-slate-600 border border-slate-200"
                  }`}
                >
                  {t.l}
                </button>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden p-4">
            {subTab === "mermas" && (
              <div>
                <h3 className="font-bold text-slate-900 text-sm mb-3">Registro de Pérdidas y Comida Desechada</h3>
                {mermas.length === 0 ? (
                  <p className="text-slate-400 text-xs py-4 text-center">No hay mermas registradas en el historial.</p>
                ) : (
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200 uppercase">
                      <tr>
                        <th className="py-2.5 px-3">Fecha</th>
                        <th className="py-2.5 px-3">Insumo</th>
                        <th className="py-2.5 px-3 text-center">Cantidad</th>
                        <th className="py-2.5 px-3">Motivo</th>
                        <th className="py-2.5 px-3 text-right">Pérdida ($)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {mermas.map(m => (
                        <tr key={m.id} className="hover:bg-slate-50">
                          <td className="py-2.5 px-3 font-mono text-slate-500">{m.fecha}</td>
                          <td className="py-2.5 px-3 font-bold text-slate-800">{m.insumoNombre}</td>
                          <td className="py-2.5 px-3 text-center font-mono">{m.cantidad} {m.unidad}</td>
                          <td className="py-2.5 px-3 text-slate-600">{m.motivo} {m.nota && <span className="text-slate-400">({m.nota})</span>}</td>
                          <td className="py-2.5 px-3 text-right font-black text-rose-600 font-mono">-{formatMoney(m.costoPerdida)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            )}

            {subTab === "precios" && (
              <div>
                <h3 className="font-bold text-slate-900 text-sm mb-3">Registro de Cambios de Precio por Inflación</h3>
                {historialPrecios.length === 0 ? (
                  <p className="text-slate-400 text-xs py-4 text-center">No se han registrado variaciones de precios aún.</p>
                ) : (
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200 uppercase">
                      <tr>
                        <th className="py-2.5 px-3">Fecha</th>
                        <th className="py-2.5 px-3">Insumo</th>
                        <th className="py-2.5 px-3 text-right">Precio Anterior</th>
                        <th className="py-2.5 px-3 text-right">Nuevo Precio</th>
                        <th className="py-2.5 px-3 text-center">Variación</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {historialPrecios.map(h => (
                        <tr key={h.id} className="hover:bg-slate-50">
                          <td className="py-2.5 px-3 font-mono text-slate-500">{h.fecha}</td>
                          <td className="py-2.5 px-3 font-bold text-slate-800">{h.insumoNombre}</td>
                          <td className="py-2.5 px-3 text-right font-mono text-slate-500">{formatMoney(h.precioAnterior)}</td>
                          <td className="py-2.5 px-3 text-right font-mono font-bold text-slate-900">{formatMoney(h.precioNuevo)}</td>
                          <td className="py-2.5 px-3 text-center">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-black ${
                              h.variacionPct > 0 ? "bg-rose-100 text-rose-800" : "bg-emerald-100 text-emerald-800"
                            }`}>
                              +{h.variacionPct.toFixed(1)}%
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            )}

            {subTab === "pedidos_finalizados" && (
              <div>
                <h3 className="font-bold text-slate-900 text-sm mb-3">Pedidos Completados y Entregados</h3>
                <div className="space-y-2">
                  {pedidos.filter(p => p.estadoProduccion === "entregado").length === 0 ? (
                    <p className="text-slate-400 text-xs py-4 text-center">No hay pedidos marcados como entregados todavía.</p>
                  ) : (
                    pedidos.filter(p => p.estadoProduccion === "entregado").map(p => (
                      <div key={p.id} className="p-3 rounded-xl bg-slate-50 border border-slate-200 flex justify-between items-center text-xs">
                        <div>
                          <span className="font-mono text-slate-400 text-[10px]">Entregado el {p.fechaEntrega}</span>
                          <p className="font-bold text-slate-900 mt-0.5">{p.clienteNombre} &bull; {p.cantidad}x {productos.find(x => x.id === p.productoId)?.nombre}</p>
                        </div>
                        <span className="font-mono font-black text-emerald-600 text-sm">{formatMoney(p.precioTotal)}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Renderizar Aplicación
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
