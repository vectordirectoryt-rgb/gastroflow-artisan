<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Helper de conversión de unidades de medida
    const convertirUnidades = (cantidad, deUnidad, aUnidad) => {
      const q = parseFloat(cantidad) || 0;
      if (deUnidad === aUnidad) return q;
      // Peso
      if (deUnidad === 'kg' && aUnidad === 'g') return q * 1000;
      if (deUnidad === 'g' && aUnidad === 'kg') return q / 1000;
      if (deUnidad === 'lb' && aUnidad === 'g') return q * 453.592;
      if (deUnidad === 'g' && aUnidad === 'lb') return q / 453.592;
      // Volumen
      if (deUnidad === 'L' && aUnidad === 'ml') return q * 1000;
      if (deUnidad === 'ml' && aUnidad === 'L') return q / 1000;
      // Conteo
      if (deUnidad === 'docena' && aUnidad === 'unidad') return q * 12;
      if (deUnidad === 'unidad' && aUnidad === 'docena') return q / 12;
      return q;
    };

    const formatMoney = (amount) => {
      return "$" + Number(amount || 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    const getTodayStr = () => new Date().toISOString().split('T')[0];
    const getTomorrowStr = () => {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    };

    // --- DATOS INICIALES DEMO (TALLER GASTRONÓMICO / REPOSTERÍA) ---
    const INITIAL_INSUMOS = [
      { id: "ins-1", nombre: "Harina de Trigo Repostería", categoria: "Materia Prima", unidad: "g", costoUnitario: 0.002, stock: 4500, stockMinimo: 2000 },
      { id: "ins-2", nombre: "Mantequilla con Sal 82%", categoria: "Materia Prima", unidad: "g", costoUnitario: 0.013, stock: 800, stockMinimo: 1000 }, // Stock Bajo
      { id: "ins-3", nombre: "Queso Crema Tipo Philadelphia", categoria: "Materia Prima", unidad: "g", costoUnitario: 0.012, stock: 1200, stockMinimo: 600 },
      { id: "ins-4", nombre: "Huevos de Campo", categoria: "Materia Prima", unidad: "unidad", costoUnitario: 0.28, stock: 30, stockMinimo: 15 },
      { id: "ins-5", nombre: "Azúcar Glas / Impalpable", categoria: "Materia Prima", unidad: "g", costoUnitario: 0.0025, stock: 3000, stockMinimo: 1000 },
      { id: "ins-6", nombre: "Frutos Rojos Frescos (Fresas/Moras)", categoria: "Materia Prima", unidad: "g", costoUnitario: 0.016, stock: 0, stockMinimo: 500 }, // Agotado
      { id: "ins-7", nombre: "Caja Pastelería Alta 25x25", categoria: "Empaque", unidad: "unidad", costoUnitario: 1.20, stock: 12, stockMinimo: 10 },
      { id: "ins-8", nombre: "Base de Pastel Rigida Dorada 25cm", categoria: "Empaque", unidad: "unidad", costoUnitario: 0.85, stock: 15, stockMinimo: 8 },
      { id: "ins-9", nombre: "Cinta de Tela Satinada 2m", categoria: "Empaque", unidad: "unidad", costoUnitario: 0.40, stock: 25, stockMinimo: 10 },
    ];

    const INITIAL_PRODUCTOS = [
      {
        id: "prod-1",
        nombre: "Cheesecake Clásico de Frutos Rojos (12 Porciones)",
        categoria: "Tartas & Pasteles",
        unidadesPorLote: 1, // 1 pastel completo
        precioVenta: 38.00, // Lo que cobra hoy

          { insumoId: "ins-6", cantidad: 300, unidad: "g" },
          { insumoId: "ins-7", cantidad: 1, unidad: "unidad" },
          { insumoId: "ins-8", cantidad: 1, unidad: "unidad" },
          { insumoId: "ins-9", cantidad: 1, unidad: "unidad" },
        ]
      },
      {
        id: "prod-2",
        nombre: "Pack 12 Cookies Red Velvet con Chispas",
        categoria: "Galletería",
        unidadesPorLote: 12, // 1 lote saca 12 cookies
        precioVenta: 18.00, // Lo que cobra hoy por el pack
        tiempoHornoMinutos: 25,
        costoHoraEnergia: 1.50,
        tiempoPreparacionHoras: 1.0, // 1 hora de trabajo
        items: [
          { insumoId: "ins-1", cantidad: 400, unidad: "g" },
          { insumoId: "ins-2", cantidad: 200, unidad: "g" },
          { insumoId: "ins-4", cantidad: 2, unidad: "unidad" },
          { insumoId: "ins-5", cantidad: 200, unidad: "g" },
          { insumoId: "ins-7", cantidad: 1, unidad: "unidad" },
        ]
      }
    ];

    const INITIAL_PEDIDOS = [
      {
        id: "ped-1",
        clienteNombre: "Mariana Silva",
        clienteTelefono: "+54 9 11 4589-2314",
        fechaEntrega: getTodayStr(),
        horaEntrega: "16:30",
        fechaHorneo: getTodayStr(),
        productoId: "prod-1",
        cantidad: 1,
        personalizacion: "Sin nueces, con dedicatoria en tarjeta: 'Feliz Cumple Mamá'",
        precioTotal: 38.00,
        abono: 20.00,
        estadoPago: "abono", // 'pendiente', 'abono', 'pagado'
        estadoProduccion: "preparacion", // 'pendiente', 'preparacion', 'terminado', 'entregado'
        fechaRegistro: getTodayStr()
      },
      {
        id: "ped-2",
        clienteNombre: "Carlos Gómez (Evento Oficina)",
        clienteTelefono: "+54 9 11 6723-9912",
        fechaEntrega: getTomorrowStr(),
        horaEntrega: "10:00",
        fechaHorneo: getTodayStr(),
        productoId: "prod-2",
        cantidad: 2,
        personalizacion: "Cajas selladas individuales para regalo corporativo",
        precioTotal: 36.00,
        abono: 36.00,
        estadoPago: "pagado",
        estadoProduccion: "pendiente",
        fechaRegistro: getTodayStr()
      }
    ];

    const INITIAL_HISTORIAL_PRECIOS = [
      { id: "hp-1", insumoId: "ins-2", insumoNombre: "Mantequilla con Sal 82%", fecha: "2026-10-15", precioAnterior: 0.011, precioNuevo: 0.013, variacionPct: 18.2 },
      { id: "hp-2", insumoId: "ins-3", insumoNombre: "Queso Crema Tipo Philadelphia", fecha: "2026-10-20", precioAnterior: 0.010, precioNuevo: 0.012, variacionPct: 20.0 }
    ];

    const INITIAL_MERMAS = [
      { id: "m-1", insumoId: "ins-4", insumoNombre: "Huevos de Campo", cantidad: 4, unidad: "unidad", costoPerdida: 1.12, motivo: "Accidente / Rotura", nota: "Se cayó la bandeja al abrir la nevera", fecha: "2026-10-25" }
    ];

    // --- COMPONENTE PRINCIPAL ---
    function App() {
      const [activeTab, setActiveTab] = useState("dashboard"); // dashboard, pedidos, inventario, recetas, insumos, historial

      // Estados con persistencia en LocalStorage
      const [insumos, setInsumos] = useState(() => {
        const s = localStorage.getItem("gf_insumos_v2");
        return s ? JSON.parse(s) : INITIAL_INSUMOS;
      });

      const [productos, setProductos] = useState(() => {
        const s = localStorage.getItem("gf_productos_v2");
        return s ? JSON.parse(s) : INITIAL_PRODUCTOS;
      });

      const [pedidos, setPedidos] = useState(() => {
        const s = localStorage.getItem("gf_pedidos_v2");
        return s ? JSON.parse(s) : INITIAL_PEDIDOS;
      });

      const [historialPrecios, setHistorialPrecios] = useState(() => {
        const s = localStorage.getItem("gf_historial_precios_v2");
        return s ? JSON.parse(s) : INITIAL_HISTORIAL_PRECIOS;
      });

      const [mermas, setMermas] = useState(() => {
        const s = localStorage.getItem("gf_mermas_v2");
        return s ? JSON.parse(s) : INITIAL_MERMAS;
      });

      const [ventas, setVentas] = useState(() => {
        const s = localStorage.getItem("gf_ventas_v2");
        return s ? JSON.parse(s) : [];
      });

      const [producciones, setProducciones] = useState(() => {
        const s = localStorage.getItem("gf_producciones_v2");
        return s ? JSON.parse(s) : [];
      });

      // Toasts
      const [toast, setToast] = useState(null);
      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Guardar en LocalStorage automáticamente
      useEffect(() => { localStorage.setItem("gf_insumos_v2", JSON.stringify(insumos)); }, [insumos]);
      useEffect(() => { localStorage.setItem("gf_productos_v2", JSON.stringify(productos)); }, [productos]);
      useEffect(() => { localStorage.setItem("gf_pedidos_v2", JSON.stringify(pedidos)); }, [pedidos]);
      useEffect(() => { localStorage.setItem("gf_historial_precios_v2", JSON.stringify(historialPrecios)); }, [historialPrecios]);
      useEffect(() => { localStorage.setItem("gf_mermas_v2", JSON.stringify(mermas)); }, [mermas]);
      useEffect(() => { localStorage.setItem("gf_ventas_v2", JSON.stringify(ventas)); }, [ventas]);
      useEffect(() => { localStorage.setItem("gf_producciones_v2", JSON.stringify(producciones)); }, [producciones]);

      // Función de Costeo Real & Diagnóstico del Tiempo
      const calcularCosteoProducto = (prod) => {
        let costoIngredientes = 0;
        let costoEmpaques = 0;

        (prod.items || []).forEach(it => {
          const insumo = insumos.find(i => i.id === it.insumoId);
          if (insumo) {
            // Conversión de unidades inteligente
            const cantBase = convertirUnidades(it.cantidad, it.unidad || insumo.unidad, insumo.unidad);
            const costoItem = (insumo.costoUnitario || 0) * cantBase;
            if (insumo.categoria === "Empaque") {
              costoEmpaques += costoItem;
            } else {
              costoIngredientes += costoItem;
            }
          }
        });

        // Costo de Energía / Horno
        const horasHorno = (prod.tiempoHornoMinutos || 0) / 60;
        const costoEnergia = horasHorno * (prod.costoHoraEnergia || 0);

        // Costo directo total de fabricación
        const costoDirectoLote = costoIngredientes + costoEmpaques + costoEnergia;
        const unidades = prod.unidadesPorLote > 0 ? prod.unidadesPorLote : 1;
        const costoDirectoUnitario = costoDirectoLote / unidades;

        // Dinero que le queda en mano
        const precioVenta = prod.precioVenta || 0;
        const gananciaLote = precioVenta - costoDirectoLote;
        const gananciaUnitaria = precioVenta / unidades - costoDirectoUnitario;
        const margenPorcentaje = precioVenta > 0 ? (gananciaLote / precioVenta) * 100 : 0;

        // DATO CLAVE: Ganancia por hora de trabajo real
        const horasTrabajo = Math.max(0.1, prod.tiempoPreparacionHoras || 1);
        const gananciaPorHora = gananciaLote / horasTrabajo;

        return {
          costoIngredientes,
          costoEmpaques,
          costoEnergia,
          costoDirectoLote,
          costoDirectoUnitario,
          gananciaLote,
          gananciaUnitaria,
          margenPorcentaje,
          gananciaPorHora,
          horasTrabajo
        };
      };

      // Cálculo de Alertas del Sistema
      const alertas = useMemo(() => {
        const hoy = getTodayStr();
        const manana = getTomorrowStr();

        const entregasHoy = pedidos.filter(p => p.fechaEntrega === hoy && p.estadoProduccion !== "entregado");
        const entregasManana = pedidos.filter(p => p.fechaEntrega === manana && p.estadoProduccion !== "entregado");
        const horneoHoy = pedidos.filter(p => p.fechaHorneo === hoy && p.estadoProduccion === "pendiente");
        const stockCritico = insumos.filter(i => (i.stock || 0) <= (i.stockMinimo || 0));

        const totalAlertas = entregasHoy.length + entregasManana.length + horneoHoy.length + stockCritico.length;

        return { entregasHoy, entregasManana, horneoHoy, stockCritico, totalAlertas };
      }, [pedidos, insumos]);

      const [showNotificationMenu, setShowNotificationMenu] = useState(false);

      // Reiniciar a Virgen / Cargar Demo
      const resetToVirgin = () => {
        if (confirm("¿Deseas vaciar todos los datos y dejar el sistema en modo virgen?")) {
          setInsumos([]); setProductos([]); setPedidos([]); setHistorialPrecios([]); setMermas([]); setVentas([]); setProducciones([]);
          showToast("Sistema completamente en blanco.", "info");
        }
      };

      const loadDemo = () => {
        if (confirm("¿Cargar datos de ejemplo de taller gastronómico?")) {
          setInsumos(INITIAL_INSUMOS); setProductos(INITIAL_PRODUCTOS); setPedidos(INITIAL_PEDIDOS);
          setHistorialPrecios(INITIAL_HISTORIAL_PRECIOS); setMermas(INITIAL_MERMAS); setVentas([]); setProducciones([]);
          showToast("Datos de demostración cargados.");
        }
      };

      const exportBackup = () => {
        const data = { insumos, productos, pedidos, historialPrecios, mermas, ventas, producciones, exportDate: new Date() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `GastroFlow_Backup_${getTodayStr()}.json`;
        a.click();
        showToast("Copia de seguridad exportada.");
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* TOAST FLOTANTE */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-white font-medium text-sm transition-all transform animate-bounce ${
              toast.type === "error" ? "bg-rose-600" : toast.type === "info" ? "bg-slate-800" : "bg-emerald-600"
            }`}>
              <span>{toast.message}</span>
            </div>
          )}

          {/* NAVBAR SUPERIOR */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center h-16">
                {/* Logo */}
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-white shadow-md shadow-amber-500/20 font-bold text-xl">
                    🎂
                  </div>
                  <div>
                    <span className="font-extrabold text-slate-900 tracking-tight text-lg">Gastro<span className="text-amber-600">Flow</span></span>
                    <span className="hidden sm:inline-block ml-2 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-amber-50 text-amber-700 border border-amber-200 rounded-full">Taller & Encargos</span>
                  </div>
                </div>

                {/* Navegación Desktop */}
                <nav className="hidden lg:flex space-x-1">
                  {[
                    { id: "dashboard", label: "Dashboard", icon: "📊" },
                    { id: "pedidos", label: "Libreta de Pedidos", icon: "📅", badge: alertas.entregasHoy.length > 0 ? alertas.entregasHoy.length : null },
                    { id: "inventario", label: "Inventario & Lotes", icon: "⚡", badge: alertas.stockCritico.length > 0 ? alertas.stockCritico.length : null },
                    { id: "recetas", label: "Recetas & Costeo Real", icon: "🧾" },
                    { id: "insumos", label: "Insumos & Precios", icon: "📦" },
                    { id: "historial", label: "Historial & Auditoría", icon: "📂" },
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`relative flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                        activeTab === tab.id
                          ? "bg-amber-50 text-amber-900 shadow-sm border border-amber-200/70"
                          : "text-slate-600 hover:text-slate-900 hover:bg-slate-100"
                      }`}
                    >
                      <span>{tab.icon}</span>
                      <span>{tab.label}</span>
                      {tab.badge && (
                        <span className="ml-1 px-1.5 py-0.2 text-[10px] font-bold bg-rose-500 text-white rounded-full">
                          {tab.badge}
                        </span>
                      )}
                    </button>
                  ))}
                </nav>

                {/* Utilidades: Campana de Alertas y Menú de Datos */}
                <div className="flex items-center gap-3">
                  {/* CAMPANA DE ALERTAS INTELIGENTES */}
                  <div className="relative">
                    <button
                      onClick={() => setShowNotificationMenu(!showNotificationMenu)}
                      className="p-2 relative rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-600 transition"
                      title="Centro de Alertas y Agenda"
                    >
                      <span className="text-lg">🔔</span>
                      {alertas.totalAlertas > 0 && (
                        <span className="absolute -top-1 -right-1 w-5 h-5 bg-rose-500 text-white text-[10px] font-black rounded-full flex items-center justify-center animate-pulse">
                          {alertas.totalAlertas}
                        </span>
                      )}
                    </button>

                    {/* Popover de Notificaciones */}
                    {showNotificationMenu && (
                      <div className="absolute right-0 mt-2 w-80 sm:w-96 bg-white border border-slate-200 rounded-2xl shadow-2xl p-4 z-50 animate-in fade-in duration-200">
                        <div className="flex justify-between items-center pb-2 border-b border-slate-100 mb-3">
                          <h4 className="font-bold text-slate-900 text-sm flex items-center gap-2">
                            <span>🔔</span> Centro de Alertas y Agenda
                          </h4>
                          <button onClick={() => setShowNotificationMenu(false)} className="text-slate-400 hover:text-slate-600 text-xs font-bold">&times;</button>
                        </div>

                        <div className="space-y-2.5 max-h-80 overflow-y-auto pr-1 text-xs">
                          {alertas.totalAlertas === 0 ? (
                            <p className="text-center py-4 text-slate-400">¡Todo al día! No hay entregas pendientes ni stock crítico.</p>
                          ) : (
                            <>
                              {alertas.entregasHoy.map(p => (
                                <div key={p.id} className="p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-900 flex justify-between items-center">
                                  <div>
                                    <p className="font-bold">🚨 Entrega para HOY ({p.horaEntrega})</p>
                                    <p className="text-[11px] text-rose-700">{p.clienteNombre} &bull; {p.personalizacion?.slice(0, 30)}...</p>
                                  </div>
                                  <button onClick={() => { setActiveTab("pedidos"); setShowNotificationMenu(false); }} className="px-2 py-1 bg-rose-600 text-white rounded-lg text-[10px] font-bold">Ver</button>
                                </div>
                              ))}

                              {alertas.entregasManana.map(p => (
                                <div key={p.id} className="p-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 flex justify-between items-center">
                                  <div>
                                    <p className="font-bold">⏰ Entrega MAÑANA ({p.horaEntrega})</p>
                                    <p className="text-[11px] text-amber-800">{p.clienteNombre}</p>
                                  </div>
                                  <button onClick={() => { setActiveTab("pedidos"); setShowNotificationMenu(false); }} className="px-2 py-1 bg-amber-600 text-white rounded-lg text-[10px] font-bold">Ver</button>
                                </div>
                              ))}

                              {alertas.stockCritico.map(i => (
                                <div key={i.id} className="p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 flex justify-between items-center">
                                  <div>
                                    <p className="font-bold text-rose-600">⚠️ Stock Crítico: {i.nombre}</p>
                                    <p className="text-[11px] text-slate-500">Quedan solo {i.stock} {i.unidad} (Mín: {i.stockMinimo})</p>
                                  </div>
                                  <button onClick={() => { setActiveTab("inventario"); setShowNotificationMenu(false); }} className="px-2 py-1 bg-slate-800 text-white rounded-lg text-[10px] font-bold">Comprar</button>
                                </div>
                              ))}
                            </>
                          )}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Menú de Datos */}
                  <div className="relative group">
                    <button className="px-3 py-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-xl text-xs font-bold border border-slate-200 flex items-center gap-1.5">
                      ⚙️ <span className="hidden sm:inline">Datos</span>
                    </button>
                    <div className="absolute right-0 mt-1 w-48 bg-white border border-slate-200 rounded-xl shadow-xl p-1.5 hidden group-hover:block z-50">
                      <button onClick={exportBackup} className="w-full text-left px-3 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50 rounded-lg flex items-center gap-2">💾 Exportar Copia JSON</button>
                      <button onClick={loadDemo} className="w-full text-left px-3 py-2 text-xs font-medium text-amber-700 hover:bg-amber-50 rounded-lg flex items-center gap-2">🔄 Recargar Datos Demo</button>
                      <hr className="my-1 border-slate-100" />
                      <button onClick={resetToVirgin} className="w-full text-left px-3 py-2 text-xs font-medium text-rose-600 hover:bg-rose-50 rounded-lg flex items-center gap-2">🗑️ Limpiar Todo (Virgen)</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Mobile Tabbar */}

    // ==========================================
    // 1. DASHBOARD & AGENDA DEL DÍA
    // ==========================================
    function DashboardView({ insumos, productos, pedidos, ventas, mermas, alertas, calcularCosteoProducto, setActiveTab }) {
      const [timeRange, setTimeRange] = useState("mes");
      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      // Consolidado de métricas
      const metrics = useMemo(() => {
        const hoy = getTodayStr();
        const mesActual = hoy.slice(0, 7);

        // Ventas consolidadas (incluyendo pedidos entregados y pagados)
        const pedidosEntregados = pedidos.filter(p => p.estadoProduccion === "entregado" && p.estadoPago === "pagado");
        const todasLasVentas = [...ventas];

        pedidosEntregados.forEach(p => {
          const prod = productos.find(x => x.id === p.productoId);
          const c = prod ? calcularCosteoProducto(prod) : { costoDirectoUnitario: 0 };
          todasLasVentas.push({
            id: p.id,
            fecha: p.fechaEntrega,
            productoId: p.productoId,
            cantidad: p.cantidad,
            precioTotal: p.precioTotal,
            costoTotal: c.costoDirectoUnitario * p.cantidad,
            ganancia: p.precioTotal - (c.costoDirectoUnitario * p.cantidad)
          });
        });

        // Filtrado por fecha
        const ventasFiltradas = todasLasVentas.filter(v => {
          if (timeRange === "dia") return v.fecha === hoy;
          if (timeRange === "mes") return v.fecha && v.fecha.slice(0, 7) === mesActual;
          return true;
        });

        let ingresosBrutos = 0;
        let cogs = 0;
        let gananciaBruta = 0;

        ventasFiltradas.forEach(v => {
          ingresosBrutos += v.precioTotal || 0;
          cogs += v.costoTotal || 0;
          gananciaBruta += v.ganancia || 0;
        });

        // Total Mermas / Pérdidas del periodo
        const mermasFiltradas = mermas.filter(m => {
          if (timeRange === "dia") return m.fecha === hoy;
          if (timeRange === "mes") return m.fecha && m.fecha.slice(0, 7) === mesActual;
          return true;
        });
        const totalPerdidasMermas = mermasFiltradas.reduce((acc, m) => acc + (m.costoPerdida || 0), 0);

        // Ganancia Real en Bolsillo
        const gananciaRealNeta = gananciaBruta - totalPerdidasMermas;

        // Radiografía de ránkings de productos
        const analisisProductos = productos.map(p => {
          const c = calcularCosteoProducto(p);
          const ventasDelProd = todasLasVentas.filter(v => v.productoId === p.id);
          const unidadesVendidas = ventasDelProd.reduce((acc, v) => acc + (v.cantidad || 0), 0);
          const totalFacturado = ventasDelProd.reduce((acc, v) => acc + (v.precioTotal || 0), 0);

          return {
            ...p,
            costeo: c,
            unidadesVendidas,
            totalFacturado,
            gananciaPorHora: c.gananciaPorHora,
            margenPorcentaje: c.margenPorcentaje
          };
        });

        const topPorHora = [...analisisProductos].sort((a, b) => b.gananciaPorHora - a.gananciaPorHora)[0];
        const topMasVendido = [...analisisProductos].sort((a, b) => b.unidadesVendidas - a.unidadesVendidas)[0];

        return {
          ingresosBrutos,
          cogs,
          totalPerdidasMermas,
          gananciaRealNeta,
          analisisProductos,
          topPorHora,
          topMasVendido
        };
      }, [ventas, pedidos, mermas, productos, timeRange]);

      // Render gráfico
      useEffect(() => {
        if (!chartRef.current) return;
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        const ctx = chartRef.current.getContext("2d");
        chartInstanceRef.current = new Chart(ctx, {
          type: "bar",
          data: {
            labels: ["Ingresos Brutos", "Costo Insumos (COGS)", "Pérdidas por Merma", "Ganancia Real"],
            datasets: [{
              label: "Monto ($)",
              data: [metrics.ingresosBrutos, metrics.cogs, metrics.totalPerdidasMermas, metrics.gananciaRealNeta],
              backgroundColor: ["#3b82f6", "#64748b", "#f43f5e", "#10b981"],
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true } }
          }
        });

        return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
      }, [metrics]);

      return (
        <div className="space-y-8">
          {/* ☀️ WIDGET: AGENDA DEL DÍA (LO PRIMERO EN LA MAÑANA) */}
          <div className="bg-gradient-to-r from-amber-500 to-amber-600 rounded-2xl p-6 text-white shadow-lg">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <span className="text-xs font-extrabold uppercase tracking-wider text-amber-200 bg-amber-700/50 px-2.5 py-0.5 rounded-full">
                  ☀️ Tu Taller Hoy
                </span>
                <h2 className="text-2xl font-black mt-2">Agenda y Entregas de Hoy ({getTodayStr()})</h2>
                <p className="text-xs text-amber-100 mt-1">
                  Tienes <strong className="underline">{alertas.entregasHoy.length} pedido(s) para entregar hoy</strong> y {alertas.horneoHoy.length} horneado(s) pendientes.
                </p>
              </div>

              <button
                onClick={() => setActiveTab("pedidos")}
                className="px-5 py-2.5 bg-white text-amber-900 font-extrabold text-xs rounded-xl shadow hover:bg-amber-50 transition"
              >
                Abrir Libreta de Encargos &rarr;
              </button>
            </div>

            {alertas.entregasHoy.length > 0 && (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-4 pt-4 border-t border-amber-400/40">
                {alertas.entregasHoy.map(p => {
                  const prod = productos.find(x => x.id === p.productoId);
                  const restaCobrar = p.precioTotal - p.abono;

                  return (
                    <div key={p.id} className="bg-white/10 backdrop-blur-md rounded-xl p-3 border border-white/20 text-xs">
                      <div className="flex justify-between items-start font-bold">
                        <span>⏰ {p.horaEntrega} hs</span>
                        <span className={`px-2 py-0.5 rounded text-[10px] ${restaCobrar > 0 ? "bg-rose-500 text-white" : "bg-emerald-500 text-white"}`}>
                          {restaCobrar > 0 ? `Falta cobrar $${restaCobrar}` : "Pagado 100%"}
                        </span>
                      </div>
                      <p className="font-extrabold text-sm mt-1">{p.clienteNombre}</p>
                      <p className="text-amber-100 text-[11px] truncate">{prod?.nombre}</p>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* KPI CARDS CON RENTABILIDAD Y PÉRDIDAS */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold uppercase text-slate-400">Facturación Bruta</span>
              <p className="text-2xl font-extrabold text-slate-900 font-mono mt-1">{formatMoney(metrics.ingresosBrutos)}</p>
              <span className="text-[11px] text-slate-400">Total en el periodo seleccionado</span>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold uppercase text-slate-400">Costo Insumos (COGS)</span>
              <p className="text-2xl font-extrabold text-slate-700 font-mono mt-1">{formatMoney(metrics.cogs)}</p>
              <span className="text-[11px] text-slate-400">Materia prima y cajas usadas</span>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-rose-100 shadow-sm bg-rose-50/30">
              <span className="text-xs font-bold uppercase text-rose-600">Pérdidas por Mermas</span>
              <p className="text-2xl font-extrabold text-rose-600 font-mono mt-1">-{formatMoney(metrics.totalPerdidasMermas)}</p>
              <span className="text-[11px] text-rose-500">Comida dañada y accidentes</span>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-emerald-100 shadow-sm bg-emerald-50/40">
              <span className="text-xs font-bold uppercase text-emerald-700">Ganancia Real Neta</span>
              <p className="text-2xl font-black text-emerald-600 font-mono mt-1">{formatMoney(metrics.gananciaRealNeta)}</p>
              <span className="text-[11px] text-emerald-700/80 font-bold">Limpio al bolsillo</span>
            </div>
          </div>

          {/* GRÁFICO FINANCIERO */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div className="flex justify-between items-center mb-4">
              <div>
                <h3 className="font-bold text-slate-900 text-base">Estructura Financiera del Negocio</h3>
                <p className="text-xs text-slate-500">Ingresos vs Insumos vs Mermas vs Ganancia Neta Real.</p>
              </div>
              <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs font-bold">
                {[{ id: "dia", l: "Hoy" }, { id: "mes", l: "Este Mes" }, { id: "todo", l: "Histórico" }].map(t => (
                  <button
                    key={t.id}
                    onClick={() => setTimeRange(t.id)}
                    className={`px-3 py-1 rounded-lg ${timeRange === t.id ? "bg-white text-slate-900 shadow-sm" : "text-slate-500"}`}
                  >
                    {t.l}
                  </button>
                ))}
              </div>
            </div>
            <div className="h-56 w-full">
              <canvas ref={chartRef}></canvas>
            </div>
          </div>

          {/* RÁNKINGS: EL PRODUCTO MÁS RENTABLE POR HORA VS MÁS VENDIDO */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold uppercase text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200">
                👑 Producto Estrella (Paga mejor tu tiempo)
              </span>
              <h4 className="text-lg font-bold text-slate-900 mt-3">{metrics.topPorHora?.nombre || "Sin datos"}</h4>
              <p className="text-xs text-slate-500 mt-1">Con este producto ganas más dinero por cada hora que estás en la cocina.</p>
              <div className="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center font-mono">
                <span className="text-xs text-slate-500">Estás ganando:</span>
                <span className="text-xl font-black text-emerald-600">
                  {formatMoney(metrics.topPorHora?.gananciaPorHora)} <span className="text-xs font-bold text-slate-400">/ hora</span>
                </span>
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <span className="text-xs font-bold uppercase text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-full border border-amber-200">
                🔥 Mayor Aceptación (Más Vendido)
              </span>
              <h4 className="text-lg font-bold text-slate-900 mt-3">{metrics.topMasVendido?.nombre || "Sin datos"}</h4>
              <p className="text-xs text-slate-500 mt-1">Es el favorito de tus clientes por volumen de pedidos.</p>
              <div className="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center font-mono">
                <span className="text-xs text-slate-500">Unidades vendidas:</span>
                <span className="text-xl font-black text-amber-600">
                  {metrics.topMasVendido?.unidadesVendidas || 0} unidades
                </span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. LIBRETA DE ENCARGOS & PEDIDOS
    // ==========================================
    function PedidosView({ pedidos, setPedidos, productos, insumos, setInsumos, ventas, setVentas, showToast }) {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [filtro, setFiltro] = useState("todos"); // todos, hoy, semana, pendientes_pago

      // Formulario
      const [clienteNombre, setClienteNombre] = useState("");
      const [clienteTelefono, setClienteTelefono] = useState("");
      const [fechaEntrega, setFechaEntrega] = useState(getTodayStr());
      const [horaEntrega, setHoraEntrega] = useState("16:00");
      const [fechaHorneo, setFechaHorneo] = useState(getTodayStr());
      const [productoId, setProductoId] = useState(productos[0]?.id || "");
      const [cantidad, setCantidad] = useState(1);
      const [personalizacion, setPersonalizacion] = useState("");
      const [precioTotal, setPrecioTotal] = useState("");
      const [abono, setAbono] = useState("");

      // Auto-completar precio base al elegir producto
      useEffect(() => {
        const p = productos.find(x => x.id === productoId);
        if (p) {
          const tot = (p.precioVenta || 0) * cantidad;
          setPrecioTotal(tot.toFixed(2));
          setAbono((tot * 0.5).toFixed(2)); // Sugerir 50% de anticipo
        }
      }, [productoId, cantidad, productos]);

      const handleCrearPedido = (e) => {
        e.preventDefault();
        const tot = parseFloat(precioTotal) || 0;
        const ab = parseFloat(abono) || 0;

        let estadoPago = "pendiente";
        if (ab >= tot) estadoPago = "pagado";
        else if (ab > 0) estadoPago = "abono";

        const nuevo = {
          id: "ped-" + Date.now(),
          clienteNombre: clienteNombre.trim(),
          clienteTelefono: clienteTelefono.trim(),
          fechaEntrega,
          horaEntrega,
          fechaHorneo,
          productoId,
          cantidad: parseInt(cantidad) || 1,
          personalizacion: personalizacion.trim(),
          precioTotal: tot,
          abono: ab,
          estadoPago,
          estadoProduccion: "pendiente",
          fechaRegistro: getTodayStr()
        };

        setPedidos([nuevo, ...pedidos]);
        showToast("Pedido por encargo registrado con éxito.");
        setIsModalOpen(false);
      };

      // Cambiar estado de producción
      const cambiarEstadoProduccion = (pedidoId, nuevoEstado) => {
        setPedidos(prev => prev.map(p => {
          if (p.id === pedidoId) {
            // Si pasa a entregado y ya está pagado total, registrar venta automáticamente
            if (nuevoEstado === "entregado" && p.estadoPago === "pagado") {
              showToast("¡Pedido completado y cobrado! Registrado en ventas.");
            }
            return { ...p, estadoProduccion: nuevoEstado };
          }
          return p;
        }));
      };

      // Registrar pago restante
      const saldarPago = (pedidoId) => {
        setPedidos(prev => prev.map(p => {
          if (p.id === pedidoId) {
            return { ...p, abono: p.precioTotal, estadoPago: "pagado" };
          }
          return p;
        }));
        showToast("Saldo cobrado en su totalidad. Pedido pagado.");
      };

      const pedidosFiltrados = pedidos.filter(p => {
        if (filtro === "hoy") return p.fechaEntrega === getTodayStr();
        if (filtro === "pendientes_pago") return p.estadoPago !== "pagado";
        return true;
      });

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Libreta de Encargos & Pedidos</h2>
              <p className="text-sm text-slate-500 mt-1">Control de fechas de entrega, compromisos de horneado y saldos pendientes.</p>
            </div>
            <button
              onClick={() => setIsModalOpen(true)}
              className="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl shadow-sm transition"
            >
              + Nuevo Encargo / Pedido
            </button>
          </div>

          {/* Filtros */}
          <div className="flex items-center gap-2">
            {[
              { id: "todos", l: "Todos los Encargos" },
              { id: "hoy", l: "Para Entregar Hoy" },
              { id: "pendientes_pago", l: "Con Saldo Pendiente" }
            ].map(f => (
              <button
                key={f.id}
                onClick={() => setFiltro(f.id)}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold ${
                  filtro === f.id ? "bg-slate-900 text-white" : "bg-white text-slate-600 border border-slate-200"
                }`}
              >
                {f.l}
              </button>
            ))}
          </div>

          {/* Lista de Pedidos */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {pedidosFiltrados.length === 0 ? (
              <div className="col-span-2 p-12 bg-white rounded-2xl border border-slate-200 text-center text-slate-400">
                <span className="text-4xl">📅</span>
                <p className="font-bold text-slate-700 mt-2">No hay encargos en esta vista</p>
              </div>
            ) : (
              pedidosFiltrados.map(p => {
                const prod = productos.find(x => x.id === p.productoId);
                const saldoPendiente = p.precioTotal - p.abono;

                return (
                  <div key={p.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between">
                    <div>
                      {/* Cabecera del Pedido */}
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <span className="text-xs font-extrabold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                            Entrega: {p.fechaEntrega} &bull; {p.horaEntrega} hs
                          </span>
                          <h4 className="text-lg font-black text-slate-900 mt-2">{p.clienteNombre}</h4>
                          <p className="text-xs text-slate-500">{p.clienteTelefono}</p>
                        </div>
                        {/* Estado del Pago */}
                        <div className="text-right">
                          <span className={`inline-block px-2.5 py-0.5 rounded-full text-[11px] font-black ${
                            p.estadoPago === "pagado"
                              ? "bg-emerald-100 text-emerald-800"
                              : "bg-rose-100 text-rose-800"
                          }`}>
                            {p.estadoPago === "pagado" ? "✓ Pagado Total" : `Resta: $${saldoPendiente.toFixed(2)}`}
                          </span>
                        </div>
                      </div>

                      {/* Producto y Personalización */}
                      <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 my-3 text-xs">
                        <p className="font-bold text-slate-800">{p.cantidad}x {prod?.nombre || "Producto eliminado"}</p>
                        {p.personalizacion && (
                          <p className="text-slate-600 mt-1 italic">"{p.personalizacion}"</p>
                        )}
                        <p className="text-slate-400 mt-1 text-[11px]">Horneo / Inicio previsto: {p.fechaHorneo}</p>
                      </div>
                    </div>

                    {/* Acciones de Flujo: Cobro y Producción */}
                    <div className="pt-3 border-t border-slate-100 flex flex-wrap justify-between items-center gap-2">
                      <div className="flex items-center gap-1.5">
                        <span className="text-xs text-slate-500 font-bold">Estado:</span>
                        <select
                          value={p.estadoProduccion}
                          onChange={e => cambiarEstadoProduccion(p.id, e.target.value)}
                          className="px-2.5 py-1 text-xs font-bold rounded-lg border border-slate-200 bg-white"
                        >
                          <option value="pendiente">🟡 Pendiente</option>
                          <option value="preparacion">🔥 En Preparación</option>
                          <option value="terminado">📦 Terminado / Listo</option>
                          <option value="entregado">✅ Entregado</option>
                        </select>
                      </div>

                      {saldoPendiente > 0 && (
                        <button
                          onClick={() => saldarPago(p.id)}
                          className="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg transition"
                        >
                          Cobrar Resto (${saldoPendiente.toFixed(2)})
                        </button>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {/* MODAL NUEVO PEDIDO */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-200">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-slate-900">Registrar Nuevo Encargo</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleCrearPedido} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-700">Nombre del Cliente</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej: Laura Martínez"
                        value={clienteNombre}
                        onChange={e => setClienteNombre(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Teléfono / WhatsApp</label>
                      <input
                        type="text"
                        placeholder="Ej: +54 9 11..."
                        value={clienteTelefono}
                        onChange={e => setClienteTelefono(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="font-bold text-slate-700">Fecha Entrega</label>
                      <input
                        type="date"
                        required
                        value={fechaEntrega}
                        onChange={e => setFechaEntrega(e.target.value)}
                        className="w-full px-2.5 py-1.5 rounded-xl border border-slate-200 text-xs"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Hora Entrega</label>
                      <input
                        type="time"
                        required
                        value={horaEntrega}
                        onChange={e => setHoraEntrega(e.target.value)}
                        className="w-full px-2.5 py-1.5 rounded-xl border border-slate-200 text-xs"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Fecha Horneo</label>
                      <input
                        type="date"
                        value={fechaHorneo}
                        onChange={e => setFechaHorneo(e.target.value)}
                        className="w-full px-2.5 py-1.5 rounded-xl border border-slate-200 text-xs"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div className="col-span-2">
                      <label className="font-bold text-slate-700">Producto a Elaborar</label>
                      <select
                        value={productoId}
                        onChange={e => setProductoId(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white font-bold"
                      >
                        {productos.map(p => (
                          <option key={p.id} value={p.id}>{p.nombre}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Cantidad</label>
                      <input
                        type="number"
                        min="1"
                        value={cantidad}
                        onChange={e => setCantidad(Math.max(1, parseInt(e.target.value) || 1))}
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700">Detalles de Personalización / Alérgenos</label>
                    <textarea
                      rows="2"
                      placeholder="Ej: Topper 'Mis 30', sin frutos secos, cinta fucsia..."
                      value={personalizacion}
                      onChange={e => setPersonalizacion(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs"
                    ></textarea>
                  </div>

                  <div className="grid grid-cols-2 gap-2 bg-amber-50 p-3 rounded-xl border border-amber-200">
                    <div>
                      <label className="font-bold text-amber-900">Precio Total ($)</label>
                      <input
                        type="number"
                        step="any"
                        required
                        value={precioTotal}
                        onChange={e => setPrecioTotal(e.target.value)}
                        className="w-full px-3 py-1.5 rounded-lg border border-amber-200 text-xs font-bold bg-white font-mono"
                      />
                    </div>
                    <div>
                      <label className="font-bold text-amber-900">Anticipo / Abono Pagado ($)</label>
                      <input
                        type="number"
                        step="any"
                        value={abono}
                        onChange={e => setAbono(e.target.value)}
                        className="w-full px-3 py-1.5 rounded-lg border border-amber-200 text-xs font-bold bg-white font-mono"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 rounded-xl text-slate-600 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow">Guardar Encargo</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. INVENTARIO & PRODUCCIÓN INTELIGENTE
    // ==========================================
    function InventarioView({ insumos, setInsumos, productos, setHistorialPrecios, mermas, setMermas, producciones, setProducciones, showToast }) {
      const [busqueda, setBusqueda] = useState("");
      const [ordenarPor, setOrdenarPor] = useState("criticidad"); // criticidad, alfa, mayor_stock

      // Modales de Acción Rápida por Fila
      const [modalCompra, setModalCompra] = useState(null); // insumo target
      const [cantCompra, setCantCompra] = useState("");
      const [precioNuevoCompra, setPrecioNuevoCompra] = useState("");

      const [modalMerma, setModalMerma] = useState(null); // insumo target
      const [cantMerma, setCantMerma] = useState("");
      const [motivoMerma, setMotivoMerma] = useState("Accidente / Caída");
      const [notaMerma, setNotaMerma] = useState("");

      // Producción de Lotes
      const [selectedProdId, setSelectedProdId] = useState("");
      const [lotes, setLotes] = useState(1);

      // Validador inteligente de stock para producción
      const targetProd = productos.find(p => p.id === selectedProdId);
      const validacionStock = useMemo(() => {
        if (!targetProd || lotes <= 0) return null;

        const detalle = (targetProd.items || []).map(it => {
          const insumo = insumos.find(i => i.id === it.insumoId);
          // Cantidad requerida convertida a la unidad base del insumo
          const cantidadRequerida = convertirUnidades(it.cantidad * lotes, it.unidad || insumo?.unidad, insumo?.unidad || "g");
          const disponible = insumo ? insumo.stock : 0;
          const falta = Math.max(0, cantidadRequerida - disponible);
          const esSuficiente = disponible >= cantidadRequerida;

          return {
            insumoId: it.insumoId,
            nombre: insumo?.nombre || "Desconocido",
            unidad: insumo?.unidad || "",
            requerida: cantidadRequerida,
            disponible,
            falta,
            esSuficiente
          };
        });

        const hayFaltantes = detalle.some(d => !d.esSuficiente);
        return { detalle, hayFaltantes };
      }, [targetProd, lotes, insumos]);

      // Confirmar Producción y Descontar Insumos
      const handleConfirmarProduccion = () => {
        if (!validacionStock || validacionStock.hayFaltantes) return;

        setInsumos(prev => prev.map(ins => {
          const d = validacionStock.detalle.find(x => x.insumoId === ins.id);
          if (d) {
            return { ...ins, stock: Math.max(0, ins.stock - d.requerida) };
          }
          return ins;
        }));

        setProducciones(prev => [{
          id: "prod-log-" + Date.now(),
          productoNombre: targetProd.nombre,
          lotes,
          unidades: (targetProd.unidadesPorLote || 1) * lotes,
          fecha: new Date().toLocaleString()
        }, ...prev]);

        showToast(`¡Producción exitosa! Se descontaron los insumos del almacén.`);
      };

      // Ejecutar Entrada de Compra
      const handleGuardarCompra = (e) => {
        e.preventDefault();
        const q = parseFloat(cantCompra) || 0;
        const pNuevo = parseFloat(precioNuevoCompra);

        if (!modalCompra || q <= 0) return;

        setInsumos(prev => prev.map(ins => {
          if (ins.id === modalCompra.id) {
            const precioActualizado = pNuevo > 0 ? pNuevo : ins.costoUnitario;
            return {
              ...ins,
              stock: (ins.stock || 0) + q,
              costoUnitario: precioActualizado
            };
          }
          return ins;
        }));

        // Registrar en Historial de Precios si cambió el costo
        if (pNuevo > 0 && pNuevo !== modalCompra.costoUnitario) {
          const varPct = ((pNuevo - modalCompra.costoUnitario) / modalCompra.costoUnitario) * 100;
          setHistorialPrecios(prev => [{
            id: "hp-" + Date.now(),
            insumoId: modalCompra.id,
            insumoNombre: modalCompra.nombre,
            fecha: getTodayStr(),
            precioAnterior: modalCompra.costoUnitario,
            precioNuevo: pNuevo,
            variacionPct: varPct
          }, ...prev]);
        }

        showToast(`Compra registrada: +${q} ${modalCompra.unidad} de ${modalCompra.nombre}`);
        setModalCompra(null);
      };

      // Ejecutar Registro de Merma / Pérdida
      const handleGuardarMerma = (e) => {
        e.preventDefault();
        const q = parseFloat(cantMerma) || 0;
        if (!modalMerma || q <= 0) return;

        // Descontar de stock
        setInsumos(prev => prev.map(ins => {
          if (ins.id === modalMerma.id) {
            return { ...ins, stock: Math.max(0, (ins.stock || 0) - q) };
          }
          return ins;
        }));

        // Registrar costo de pérdida
        const costoPerdida = q * (modalMerma.costoUnitario || 0);
        setMermas(prev => [{
          id: "m-" + Date.now(),
          insumoId: modalMerma.id,
          insumoNombre: modalMerma.nombre,
          cantidad: q,
          unidad: modalMerma.unidad,
          costoPerdida,
          motivo: motivoMerma,
          nota: notaMerma.trim(),
          fecha: getTodayStr()
        }, ...prev]);

        showToast(`Merma registrada: -${q} ${modalMerma.unidad} (-${formatMoney(costoPerdida)})`, "info");
        setModalMerma(null);
      };

      // Ordenar Insumos
      const insumosOrdenados = useMemo(() => {
        let list = [...insumos].filter(i => i.nombre.toLowerCase().includes(busqueda.toLowerCase()));

        if (ordenarPor === "criticidad") {
          return list.sort((a, b) => {
            const aCritico = a.stock <= 0 ? 0 : a.stock <= a.stockMinimo ? 1 : 2;
            const bCritico = b.stock <= 0 ? 0 : b.stock <= b.stockMinimo ? 1 : 2;
            return aCritico - bCritico;
          });
        }
        if (ordenarPor === "alfa") return list.sort((a, b) => a.nombre.localeCompare(b.nombre));
        if (ordenarPor === "mayor_stock") return list.sort((a, b) => b.stock - a.stock);
        return list;
      }, [insumos, busqueda, ordenarPor]);

      return (
        <div className="space-y-8">
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Inventario & Producción por Lotes</h2>
            <p className="text-sm text-slate-500 mt-1">Supervisa existencias, registra compras con actualización de precios y mermas por accidentes.</p>
          </div>

          {/* VALIDADOR DE PRODUCCIÓN */}
          <div className="bg-gradient-to-br from-amber-50 to-white rounded-2xl border border-amber-200 p-6 shadow-sm">
            <div className="flex items-center gap-2 mb-3">
              <span className="text-2xl">⚡</span>
              <h3 className="font-bold text-slate-900 text-base">Validador de Disponibilidad de Lotes</h3>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
              <div className="sm:col-span-2">
                <label className="text-xs font-bold text-slate-700 uppercase">Selecciona Producto a Elaborar</label>
                <select
                  value={selectedProdId}
                  onChange={e => setSelectedProdId(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold bg-white"
                >
                  <option value="">-- Elige qué vas a hornear/preparar --</option>
                  {productos.map(p => (
                    <option key={p.id} value={p.id}>{p.nombre} (1 Lote = {p.unidadesPorLote} unid.)</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-xs font-bold text-slate-700 uppercase">Cantidad de Lotes</label>
                <input
                  type="number"
                  min="1"
                  value={lotes}
                  onChange={e => setLotes(Math.max(1, parseInt(e.target.value) || 1))}
                  className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold bg-white"
                />
              </div>
            </div>

            {validacionStock && (
              <div className="space-y-3">
                <div className="bg-white rounded-xl border border-slate-200 overflow-hidden text-xs">
                  <table className="w-full text-left">
                    <thead className="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
                      <tr>
                        <th className="py-2 px-3">Insumo Requerido</th>
                        <th className="py-2 px-3 text-center">Necesario ({lotes} lotes)</th>
                        <th className="py-2 px-3 text-center">Disponible</th>
                        <th className="py-2 px-3 text-center">Estado</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {validacionStock.detalle.map(d => (
                        <tr key={d.insumoId} className={d.esSuficiente ? "hover:bg-slate-50" : "bg-rose-50/70"}>
                          <td className="py-2 px-3 font-bold">{d.nombre}</td>
                          <td className="py-2 px-3 text-center font-mono">{d.requerida.toLocaleString()} {d.unidad}</td>
                          <td className="py-2 px-3 text-center font-mono">{d.disponible.toLocaleString()} {d.unidad}</td>
                          <td className="py-2 px-3 text-center font-bold">
                            {d.esSuficiente ? (
                              <span className="text-emerald-700">✓ Suficiente</span>
                            ) : (
                              <span className="text-rose-700">⚠ Faltan {d.falta.toLocaleString()} {d.unidad}</span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                {validacionStock.hayFaltantes ? (
                  <div className="p-3 bg-rose-100 text-rose-900 rounded-xl font-bold text-xs flex justify-between items-center">
                    <span>🛑 Stock insuficiente. No puedes iniciar la producción hasta reponer insumos.</span>
                    <button disabled className="px-4 py-1.5 bg-rose-300 text-rose-700 rounded-lg cursor-not-allowed">Bloqueado</button>
                  </div>
                ) : (
                  <div className="p-3 bg-emerald-100 text-emerald-900 rounded-xl font-bold text-xs flex justify-between items-center">
                    <span>✅ ¡Todo listo! Tienes suficiente inventario para producir {lotes} lote(s).</span>
                    <button onClick={handleConfirmarProduccion} className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg shadow">
                      Confirmar y Descontar Insumos
                    </button>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* TABLA PRINCIPAL DE INVENTARIO CON ACCIONES RÁPIDAS */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-500">Ordenar por:</span>
                <select
                  value={ordenarPor}
                  onChange={e => setOrdenarPor(e.target.value)}
                  className="px-3 py-1.5 text-xs font-bold rounded-lg border border-slate-200 bg-white"
                >
                  <option value="criticidad">🚨 Criticidad (Agotados y Bajos Primero)</option>
                  <option value="alfa">🔤 Alfabético (A - Z)</option>
                  <option value="mayor_stock">📦 Mayor Stock Disponible</option>
                </select>
              </div>

              <input
                type="text"
                placeholder="Buscar insumo en almacén..."
                value={busqueda}
                onChange={e => setBusqueda(e.target.value)}
                className="w-full sm:w-64 px-3 py-1.5 rounded-lg border border-slate-200 text-xs"
              />
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs sm:text-sm">
                <thead className="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200 text-xs uppercase">
                  <tr>
                    <th className="py-3 px-4">Insumo</th>
                    <th className="py-3 px-4">Tipo</th>
                    <th className="py-3 px-4 text-center">Disponible</th>
                    <th className="py-3 px-4 text-center">Mínimo</th>
                    <th className="py-3 px-4 text-center">Estado</th>
                    <th className="py-3 px-4 text-center">Acciones Rápidas</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {insumosOrdenados.map(item => {
                    const isZero = item.stock <= 0;
                    const isLow = item.stock <= item.stockMinimo;

                    return (
                      <tr key={item.id} className={isZero ? "bg-rose-50/40" : isLow ? "bg-amber-50/30" : "hover:bg-slate-50"}>
                        <td className="py-3 px-4 font-bold text-slate-800">{item.nombre}</td>
                        <td className="py-3 px-4 text-xs text-slate-500">{item.categoria}</td>
                        <td className="py-3 px-4 text-center font-extrabold font-mono text-slate-900">
                          {Number(item.stock).toLocaleString()} <span className="text-xs text-slate-400 font-normal">{item.unidad}</span>
                        </td>
                        <td className="py-3 px-4 text-center text-slate-500 font-mono text-xs">
                          {Number(item.stockMinimo).toLocaleString()} {item.unidad}
                        </td>
                        <td className="py-3 px-4 text-center">
                          {isZero ? (
                            <span className="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-rose-100 text-rose-800">Agotado</span>
                          ) : isLow ? (
                            <span className="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-amber-100 text-amber-800">Stock Bajo</span>
                          ) : (
                            <span className="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-emerald-100 text-emerald-800">Óptimo</span>
                          )}
                        </td>
                        <td className="py-3 px-4 text-center">
                          <div className="flex items-center justify-center gap-1.5">
                            <button
                              onClick={() => { setModalCompra(item); setCantCompra(""); setPrecioNuevoCompra(item.costoUnitario); }}
                              className="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-extrabold text-xs rounded-lg border border-emerald-200 transition"
                            >
                              + Compra
                            </button>
                            <button
                              onClick={() => { setModalMerma(item); setCantMerma(""); setNotaMerma(""); }}
                              className="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 font-extrabold text-xs rounded-lg border border-rose-200 transition"
                            >
                              - Merma
                            </button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* MODAL ENTRADA DE COMPRA */}
          {modalCompra && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 border border-slate-200">
                <h3 className="text-base font-bold text-slate-900 mb-1">Registrar Compra / Reposición</h3>
                <p className="text-xs text-slate-500 mb-4">{modalCompra.nombre} ({modalCompra.unidad})</p>

                <form onSubmit={handleGuardarCompra} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700">Cantidad Comprada ({modalCompra.unidad})</label>
                    <input
                      type="number"
                      step="any"
                      required
                      placeholder={`Ej: 1000`}
                      value={cantCompra}
                      onChange={e => setCantCompra(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold text-xs"
                    />
                  </div>

                  <div>
                    <label className="font-bold text-slate-700">Nuevo Costo Unitario ($ por {modalCompra.unidad})</label>
                    <input
                      type="number"
                      step="any"
                      value={precioNuevoCompra}
                      onChange={e => setPrecioNuevoCompra(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 font-mono text-xs"
                    />
                    <span className="text-[10px] text-slate-400">Si el precio no cambió, déjalo igual.</span>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setModalCompra(null)} className="px-3 py-1.5 rounded-lg text-slate-500 font-bold">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-emerald-600 text-white font-bold rounded-lg shadow">Guardar Compra</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL REGISTRO DE MERMA */}
          {modalMerma && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 border border-slate-200">
                <h3 className="text-base font-bold text-rose-600 mb-1">Registrar Merma / Pérdida</h3>
                <p className="text-xs text-slate-500 mb-4">{modalMerma.nombre} ({modalMerma.unidad})</p>

                <form onSubmit={handleGuardarMerma} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700">Cantidad Perdida ({modalMerma.unidad})</label>
                    <input
                      type="number"
                      step="any"
                      required
                      value={cantMerma}
                      onChange={e => setCantMerma(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold text-xs"
                    />
                  </div>

                  <div>
                    <label className="font-bold text-slate-700">Motivo</label>
                    <select
                      value={motivoMerma}
                      onChange={e => setMotivoMerma(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 bg-white"
                    >
                      <option value="Accidente / Caída">Accidente / Caída</option>
                      <option value="Caducidad / Descomposición">Caducidad / Descomposición</option>
                      <option value="Desperdicio en Preparación">Desperdicio en Preparación</option>
                      <option value="Ajuste de Conteo Físico">Ajuste de Conteo Físico</option>
                    </select>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700">Nota u Observación</label>
                    <input
                      type="text"
                      placeholder="Ej: Se cortó la crema, venció ayer..."

                      onChange={e => setNotaMerma(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs"
                    />

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setModalMerma(null)} className="px-3 py-1.5 rounded-lg text-slate-500 font-bold">Cancelar</button>
