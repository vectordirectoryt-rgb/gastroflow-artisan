    // ==========================================
    // 2. LIBRETA DE ENCARGOS
    // ==========================================
    function PedidosView({ pedidos, setPedidos, recetas, insumos, setModalNuevoPedido, setModalPaseCocina, setModalWhatsApp }) {
      const [filtroEstado, setFiltroEstado] = useState('activos');
      const [busqueda, setBusqueda] = useState('');

      const pedidosFiltrados = useMemo(() => {
        return pedidos.filter(p => {
          const coincideBusqueda = 
            p.cliente_nombre.toLowerCase().includes(busqueda.toLowerCase()) ||
            p.cliente_telefono.includes(busqueda);

          if (!coincideBusqueda) return false;

          if (filtroEstado === 'activos') {
            return p.estado === 'pendiente' || p.estado === 'en_preparacion';
          }
          if (filtroEstado === 'completados') {
            return p.estado === 'entregado';
          }
          if (filtroEstado === 'cancelados') {
            return p.estado === 'cancelado';
          }
          return true;
        });
      }, [pedidos, filtroEstado, busqueda]);

      const handleCancelarPedido = (id) => {
        if (confirm('¿Estás seguro de cancelar este encargo? Desaparecerá de tu vista activa diaria, pero se conservará en tu Historial de Clientes.')) {
          setPedidos(pedidos.map(p => p.id === id ? { ...p, estado: 'cancelado' } : p));
        }
      };

      const handleEntregarPedido = (id) => {
        const ped = pedidos.find(p => p.id === id);
        if (!ped) return;
        const saldo = Math.max(0, ped.precio_total - ped.abono);
        if (saldo > 0) {
          if (!confirm(`Este pedido tiene un saldo pendiente de ${formatCOP(saldo)}. ¿Confirmas entrega y cobro total?`)) return;
        }
        setPedidos(pedidos.map(p => p.id === id ? { ...p, estado: 'entregado', abono: p.precio_total } : p));
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Libreta de Encargos</h2>
              <p className="text-sm text-slate-500 mt-1">Gestión de pedidos personalizados, saldos y despacho a cocina.</p>
            </div>
            <button
              onClick={() => setModalNuevoPedido(true)}
              className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl shadow-sm transition-colors flex items-center space-x-2 text-sm"
            >
              <span>➕</span>
              <span>Registrar Nuevo Encargo</span>
            </button>
          </div>

          <div className="flex flex-col sm:flex-row gap-3 items-center justify-between bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <div className="flex space-x-1.5 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
              {[
                { id: 'activos', label: '🔥 Activos (En proceso)' },
                { id: 'completados', label: '✅ Entregados' },
                { id: 'cancelados', label: '❌ Cancelados' },
                { id: 'todos', label: 'Todos' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setFiltroEstado(tab.id)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors whitespace-nowrap ${
                    filtroEstado === tab.id
                      ? 'bg-slate-900 text-white shadow'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            <div className="w-full sm:w-72">
              <input
                type="text"
                placeholder="🔍 Buscar por cliente o teléfono..."
                value={busqueda}
                onChange={e => setBusqueda(e.target.value)}
                className="w-full px-3 py-1.5 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500"
              />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            {pedidosFiltrados.map(p => {
              const rec = recetas.find(r => r.id === p.receta_id);
              const saldoPendiente = Math.max(0, p.precio_total - p.abono);

              return (
                <div key={p.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between hover:shadow-md transition-shadow">
                  <div>
                    <div className="flex items-start justify-between">
                      <div>
                        <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${
                          p.estado === 'pendiente' ? 'bg-amber-100 text-amber-800' :
                          p.estado === 'en_preparacion' ? 'bg-indigo-100 text-indigo-800' :
                          p.estado === 'entregado' ? 'bg-emerald-100 text-emerald-800' :
                          'bg-rose-100 text-rose-800'
                        }`}>
                          {p.estado === 'pendiente' ? '⏳ Pendiente' :
                           p.estado === 'en_preparacion' ? '👨‍🍳 En Preparación' :
                           p.estado === 'entregado' ? '✅ Entregado' : '❌ Cancelado'}
                        </span>
                        <h3 className="font-bold text-slate-900 text-base mt-2">{p.cliente_nombre}</h3>
                        <p className="text-xs text-slate-500">📞 {p.cliente_telefono}</p>
                      </div>

                      <button
                        onClick={() => setModalWhatsApp(p)}
                        className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 p-2 rounded-xl text-xs font-semibold flex items-center space-x-1 transition-colors"
                        title="Enviar confirmación por WhatsApp"
                      >
                        <span>💬</span>
                        <span className="hidden sm:inline">WhatsApp</span>
                      </button>
                    </div>

                    <div className="mt-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
                      <div className="font-bold text-slate-800 text-xs">{rec?.nombre}</div>
                      <div className="text-[11px] text-slate-500 mt-0.5">Cantidad: {p.cantidad} unidad(es)</div>
                      {p.notas && (
                        <div className="text-[11px] text-slate-600 italic mt-1 bg-white p-2 rounded border border-slate-200">
                          "{p.notas}"
                        </div>
                      )}
                    </div>

                    <div className="mt-3 flex items-center justify-between text-xs text-slate-600">
                      <span>📅 Entrega: <strong className="text-slate-800">{p.fecha_entrega}</strong></span>
                      <span>⏰ <strong className="text-slate-800">{p.hora_entrega || 'Sin hora'}</strong></span>
                    </div>

                    <div className="mt-3 pt-3 border-t border-slate-100 space-y-1 text-xs">
                      <div className="flex justify-between text-slate-500">
                        <span>Precio Total:</span>
                        <span className="font-bold text-slate-800">{formatCOP(p.precio_total)}</span>
                      </div>
                      <div className="flex justify-between text-emerald-600">
                        <span>Abono Recibido:</span>
                        <span className="font-semibold">{formatCOP(p.abono)}</span>
                      </div>
                      <div className="flex justify-between font-bold text-sm pt-1 border-t border-slate-100">
                        <span className="text-slate-700">Saldo Pendiente:</span>
                        <span className={saldoPendiente > 0 ? 'text-rose-600' : 'text-emerald-600'}>
                          {saldoPendiente > 0 ? formatCOP(saldoPendiente) : '¡PAGADO!'}
                        </span>
                      </div>
                    </div>
                  </div>

                  <div className="mt-5 pt-3 border-t border-slate-100 flex items-center gap-2">
                    {p.estado === 'pendiente' && (
                      <button
                        onClick={() => setModalPaseCocina(p)}
                        className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded-xl text-xs transition-colors flex items-center justify-center space-x-1"
                      >
                        <span>👨‍🍳</span>
                        <span>Pase a Cocina</span>
                      </button>
                    )}

                    {p.estado === 'en_preparacion' && (
                      <button
                        onClick={() => handleEntregarPedido(p.id)}
                        className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-3 rounded-xl text-xs transition-colors flex items-center justify-center space-x-1"
                      >
                        <span>✓</span>
                        <span>Marcar Entregado</span>
                      </button>
                    )}

                    {p.estado !== 'entregado' && p.estado !== 'cancelado' && (
                      <button
                        onClick={() => handleCancelarPedido(p.id)}
                        className="p-2 text-rose-500 hover:bg-rose-50 rounded-xl text-xs font-semibold border border-transparent hover:border-rose-200 transition-colors"
                        title="Cancelar encargo"
                      >
                        Cancelar
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {pedidosFiltrados.length === 0 && (
            <div className="text-center py-16 bg-white rounded-2xl border border-slate-200">
              <span className="text-4xl block mb-2">📋</span>
              <p className="text-slate-500 text-sm">No se encontraron encargos bajo este filtro.</p>
              {filtroEstado === 'activos' && (
                <button
                  onClick={() => setFiltroEstado('todos')}
                  className="mt-3 text-xs text-amber-600 font-semibold hover:underline"
                >
                  Ver todos los encargos pasados o completados
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. PREPARACIÓN Y COCINA (VISTA DUAL)
    // ==========================================
    function CocinaView({ pedidos, setPedidos, recetas, insumos, setInsumos, onIrABodega }) {
      const [subVista, setSubVista] = useState('mesa_trabajo'); // 'mesa_trabajo' | 'abastecimiento'
      const [filtroFecha, setFiltroFecha] = useState('todos'); // 'todos' | 'hoy' | 'manana' | 'semana'
      const [filtroEstadoCocina, setFiltroEstadoCocina] = useState('pendientes'); // 'pendientes' (por hornear) | 'en_proceso' (ya en cocina)
      const [recetaSeleccionadaId, setRecetaSeleccionadaId] = useState('');
      const [pedidosSeleccionadosIds, setPedidosSeleccionadosIds] = useState([]);
      const [pesajeCheck, setPesajeCheck] = useState({});
      const [alertaExito, setAlertaExito] = useState(null);

      // 1. Pedidos PENDIENTES por hornear/pesar (únicamente estos se pueden preparar)
      const pedidosPorHornear = useMemo(() => {
        return pedidos.filter(p => p.estado === 'pendiente');
      }, [pedidos]);

      // 2. Pedidos que YA fueron horneados y están en cocina
      const pedidosEnPreparacion = useMemo(() => {
        return pedidos.filter(p => p.estado === 'en_preparacion');
      }, [pedidos]);

      // Filtrado por fecha de los pedidos según la pestaña de estado activa
      const pedidosParaMostrar = useMemo(() => {
        const pool = filtroEstadoCocina === 'pendientes' ? pedidosPorHornear : pedidosEnPreparacion;
        const hoy = new Date();
        const hoyStr = hoy.toISOString().split('T')[0];

        const manana = new Date(hoy);
        manana.setDate(manana.getDate() + 1);
        const mananaStr = manana.toISOString().split('T')[0];

        return pool.filter(p => {
          if (filtroFecha === 'todos') return true;
          if (!p.fecha_entrega) return true;
          if (filtroFecha === 'hoy') return p.fecha_entrega === hoyStr;
          if (filtroFecha === 'manana') return p.fecha_entrega === mananaStr;
          if (filtroFecha === 'semana') {
            const fPed = new Date(p.fecha_entrega + 'T12:00:00');
            const diff = (fPed.getTime() - hoy.getTime()) / (1000 * 60 * 60 * 24);
            return diff >= -1 && diff <= 7;
          }
          return true;
        });
      }, [filtroEstadoCocina, pedidosPorHornear, pedidosEnPreparacion, filtroFecha]);

      // Agrupación de pedidos por receta
      const recetasConPedidos = useMemo(() => {
        const mapa = {};
        pedidosParaMostrar.forEach(p => {
          if (!mapa[p.receta_id]) mapa[p.receta_id] = [];
          mapa[p.receta_id].push(p);
        });

        return recetas.filter(r => mapa[r.id] && mapa[r.id].length > 0).map(r => ({
          receta: r,
          pedidos: mapa[r.id]
        }));
      }, [recetas, pedidosParaMostrar]);

      // Seleccionar automáticamente la primera receta si no hay ninguna o cambió el filtro
      useEffect(() => {
        if (recetasConPedidos.length > 0) {
          const existe = recetasConPedidos.some(item => item.receta.id === recetaSeleccionadaId);
          if (!existe) {
            const primerReceta = recetasConPedidos[0];
            setRecetaSeleccionadaId(primerReceta.receta.id);
            setPedidosSeleccionadosIds(primerReceta.pedidos.map(p => p.id));
            setPesajeCheck({});
          }
        } else {
          setRecetaSeleccionadaId('');
          setPedidosSeleccionadosIds([]);
        }
      }, [recetasConPedidos, recetaSeleccionadaId]);

      const recetaActual = recetas.find(r => r.id === recetaSeleccionadaId);
      const grupoActual = recetasConPedidos.find(item => item.receta.id === recetaSeleccionadaId);
      const pedidosDeEstaReceta = grupoActual ? grupoActual.pedidos : [];

      const handleSeleccionarReceta = (recetaId) => {
        setRecetaSeleccionadaId(recetaId);
        const grupo = recetasConPedidos.find(item => item.receta.id === recetaId);
        if (grupo) {
          setPedidosSeleccionadosIds(grupo.pedidos.map(p => p.id));
        } else {
          setPedidosSeleccionadosIds([]);
        }
        setPesajeCheck({});
        setAlertaExito(null);
      };

      const handleTogglePedido = (pedidoId) => {
        if (pedidosSeleccionadosIds.includes(pedidoId)) {
          setPedidosSeleccionadosIds(pedidosSeleccionadosIds.filter(id => id !== pedidoId));
        } else {
          setPedidosSeleccionadosIds([...pedidosSeleccionadosIds, pedidoId]);
        }
        setPesajeCheck({});
      };

      const handleSeleccionarTodosDeReceta = () => {
        setPedidosSeleccionadosIds(pedidosDeEstaReceta.map(p => p.id));
        setPesajeCheck({});
      };

      const handleDeseleccionarTodos = () => {
        setPedidosSeleccionadosIds([]);
        setPesajeCheck({});
      };

      const pedidosSeleccionados = pedidosDeEstaReceta.filter(p => pedidosSeleccionadosIds.includes(p.id));
      const cantidadTotalTanda = pedidosSeleccionados.reduce((sum, p) => sum + p.cantidad, 0);

      // Verificación de stock e ingredientes para la tanda seleccionada
      const validacionStockTanda = useMemo(() => {
        if (!recetaActual || cantidadTotalTanda === 0) {
          return { faltantes: [], hayFaltantes: false, ingredientesEscalados: [] };
        }

        const faltantes = [];
        const ingredientesEscalados = recetaActual.ingredientes.map(ing => {
          const ins = insumos.find(i => i.id === ing.insumo_id);
          const cantidadRequerida = ing.cantidad * cantidadTotalTanda;
          const stockActual = ins?.stock_actual || 0;
          const falta = Math.max(0, cantidadRequerida - stockActual);

          if (falta > 0) {
            faltantes.push({
              insumo: ins,
              insumo_id: ing.insumo_id,
              nombre: ins?.nombre || 'Insumo desconocido',
              unidad: ins?.unidad || 'g',
              requerido: cantidadRequerida,
              stockActual,
              falta
            });
          }

          return {
            insumo: ins,
            cantidadRequerida,
            stockActual,
            falta,
            unidad: ins?.unidad || 'g'
          };
        });

        return {
          faltantes,
          hayFaltantes: faltantes.length > 0,
          ingredientesEscalados
        };
      }, [recetaActual, cantidadTotalTanda, insumos]);

      // CONFIRMAR Y HORNEAR TANDA:
      // Descuenta de bodega, pasa pedidos a 'en_preparacion' y desaparecen de 'pendientes'
      // para que NUNCA se puedan preparar o descontar dos veces.
      const handleConfirmarTanda = () => {
        if (!recetaActual || cantidadTotalTanda === 0) return;
        if (validacionStockTanda.hayFaltantes) {
          alert('No es posible iniciar la preparación: materia prima insuficiente en Bodega.');
          return;
        }

        if (!setInsumos || !setPedidos) return;

        // Descontar gramos de insumos
        const nuevosInsumos = insumos.map(ins => {
          const ing = recetaActual.ingredientes.find(i => i.insumo_id === ins.id);
          if (ing) {
            const gastado = ing.cantidad * cantidadTotalTanda;
            return {
              ...ins,
              stock_actual: Math.max(0, ins.stock_actual - gastado)
            };
          }
          return ins;
        });

        // Actualizar estado de los pedidos seleccionados a 'en_preparacion'
        const idSet = new Set(pedidosSeleccionadosIds);
        const nuevosPedidos = pedidos.map(p => {
          if (idSet.has(p.id)) {
            return { ...p, estado: 'en_preparacion' };
          }
          return p;
        });

        setInsumos(nuevosInsumos);
        setPedidos(nuevosPedidos);

        setAlertaExito(`¡Tanda de ${recetaActual.nombre} horneada con éxito! Se descontaron los insumos de bodega y los ${pedidosSeleccionados.length} encargos pasaron a estado "En Preparación" (ya no están pendientes).`);
        
        // Limpiar selección de pedidos
        setPedidosSeleccionadosIds([]);
        setPesajeCheck({});
        setTimeout(() => setAlertaExito(null), 6000);
      };

      // Despachar / Entregar pedido directamente si ya está listo
      const handleEntregarDesdeCocina = (pedidoId) => {
        const ped = pedidos.find(p => p.id === pedidoId);
        if (!ped) return;
        const saldo = Math.max(0, ped.precio_total - ped.abono);
        if (saldo > 0) {
          if (!confirm(`Este encargo de ${ped.cliente_nombre} tiene un saldo pendiente de ${formatCOP(saldo)}. ¿Confirmas entrega y cobro total?`)) return;
        }
        setPedidos(pedidos.map(p => p.id === pedidoId ? { ...p, estado: 'entregado', abono: p.precio_total } : p));
      };

      // Consolidado de compras global: SOLO cuenta pedidos pendientes por hornear
      const consolidadoCompras = useMemo(() => {
        const mapa = {};
        pedidosPorHornear.forEach(p => {
          const rec = recetas.find(r => r.id === p.receta_id);
          if (rec) {
            rec.ingredientes.forEach(ing => {
              mapa[ing.insumo_id] = (mapa[ing.insumo_id] || 0) + (ing.cantidad * p.cantidad);
            });
          }
        });

        return Object.keys(mapa).map(insumoId => {
          const ins = insumos.find(i => i.id === insumoId);
          const cantidadTotalNecesaria = mapa[insumoId];
          const stockActual = ins?.stock_actual || 0;
          const deficit = Math.max(0, cantidadTotalNecesaria - stockActual);

          const tamanoEmpaque = ins?.gramos_por_empaque || 1000;
          const paquetesComprar = deficit > 0 ? Math.ceil(deficit / tamanoEmpaque) : 0;
          const cantidadComprada = paquetesComprar * tamanoEmpaque;
          const sobranteProyectado = (stockActual + cantidadComprada) - cantidadTotalNecesaria;
          const costoEstimadoCOP = paquetesComprar * (ins?.costo_empaque || 0);

          return {
            insumo: ins,
            cantidadTotalNecesaria,
            stockActual,
            deficit,
            paquetesComprar,
            sobranteProyectado,
            costoEstimadoCOP
          };
        });
      }, [pedidosPorHornear, recetas, insumos]);

      const presupuestoTotalCompras = consolidadoCompras.reduce((acc, c) => acc + c.costoEstimadoCOP, 0);

      const handleCopiarListaCompras = () => {
        let texto = `🛒 *LISTA DE COMPRAS - GASTROFLOW ARTISAN*\n`;
        texto += `Para abastecer ${pedidosPorHornear.length} pedidos pendientes por hornear:\n\n`;
        consolidadoCompras.filter(c => c.paquetesComprar > 0).forEach(c => {
          texto += `• *${c.insumo.nombre}*: Comprar ${c.paquetesComprar} paq. (${formatCOP(c.costoEstimadoCOP)})\n`;
        });
        texto += `\n💰 *Presupuesto Estimado:* ${formatCOP(presupuestoTotalCompras)}`;
        navigator.clipboard.writeText(texto);
        alert('¡Lista de compras copiada al portapapeles! Puedes pegarla directamente en WhatsApp.');
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Preparación y Cocina</h2>
              <p className="text-sm text-slate-500 mt-1">Pesaje exacto en mesa con tandas individuales o combinadas vs Abastecimiento global.</p>
            </div>

            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
              <button
                onClick={() => setSubVista('mesa_trabajo')}
                className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors flex items-center space-x-1.5 ${
                  subVista === 'mesa_trabajo' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                <span>⚖️</span>
                <span>Mesa de Trabajo (Tandas)</span>
              </button>
              <button
                onClick={() => setSubVista('abastecimiento')}
                className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors flex items-center space-x-1.5 ${
                  subVista === 'abastecimiento' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                <span>🛒</span>
                <span>Abastecimiento Global</span>
              </button>
            </div>
          </div>

          {alertaExito && (
            <div className="p-4 bg-emerald-50 border border-emerald-300 rounded-2xl text-emerald-800 text-sm font-semibold flex items-center justify-between shadow-sm">
              <div className="flex items-center space-x-2">
                <span className="text-xl">✅</span>
                <span>{alertaExito}</span>
              </div>
              <button onClick={() => setAlertaExito(null)} className="text-emerald-600 hover:text-emerald-900 text-xs font-bold">✕ Cerrar</button>
            </div>
          )}

          {subVista === 'mesa_trabajo' && (
            <div className="space-y-4">
              {/* Barra Superior: Filtro de Estado (Por Hornear vs En Preparación) y Filtro de Fecha */}
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div className="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl">
                  <button
                    onClick={() => { setFiltroEstadoCocina('pendientes'); setPedidosSeleccionadosIds([]); }}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center space-x-1.5 ${
                      filtroEstadoCocina === 'pendientes'
                        ? 'bg-slate-900 text-white shadow-xs'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <span>🔥 Por Hornear</span>
                    <span className="bg-amber-500 text-slate-950 px-1.5 py-0.2 rounded-full text-[10px]">
                      {pedidosPorHornear.length}
                    </span>
                  </button>
                  <button
                    onClick={() => { setFiltroEstadoCocina('en_proceso'); setPedidosSeleccionadosIds([]); }}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center space-x-1.5 ${
                      filtroEstadoCocina === 'en_proceso'
                        ? 'bg-slate-900 text-white shadow-xs'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <span>👨‍🍳 Ya en Preparación</span>
                    <span className="bg-indigo-500 text-white px-1.5 py-0.2 rounded-full text-[10px]">
                      {pedidosEnPreparacion.length}
                    </span>
                  </button>
                </div>

                <div className="flex items-center space-x-2">
                  <span className="text-xs font-bold text-slate-500">Fecha:</span>
                  <div className="flex space-x-1">
                    {[
                      { id: 'todos', label: 'Todos' },
                      { id: 'hoy', label: 'Hoy' },
                      { id: 'manana', label: 'Mañana' },
                      { id: 'semana', label: 'Esta Semana' }
                    ].map(f => (
                      <button
                        key={f.id}
                        onClick={() => setFiltroFecha(f.id)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-colors ${
                          filtroFecha === f.id
                            ? 'bg-amber-500 text-slate-950 font-extrabold shadow-xs'
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        {f.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* MODO 1: POR HORNEAR (MESA DE PESAJE ACTIVA) */}
              {filtroEstadoCocina === 'pendientes' ? (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  {/* Columna Izquierda: Selección de Receta y Encargos Pendientes */}
                  <div className="lg:col-span-5 space-y-4">
                    {/* Selector de Recetas */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                      <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">1. Recetas con pedidos pendientes</h3>
                      <div className="space-y-1.5">
                        {recetasConPedidos.map(({ receta, pedidos: peds }) => {
                          const seleccionada = receta.id === recetaSeleccionadaId;
                          const unidadesTotal = peds.reduce((sum, p) => sum + p.cantidad, 0);
                          return (
                            <button
                              key={receta.id}
                              onClick={() => handleSeleccionarReceta(receta.id)}
                              className={`w-full text-left p-3 rounded-xl border transition-all flex items-center justify-between ${
                                seleccionada
                                  ? 'bg-slate-900 text-white border-slate-900 shadow-md'
                                  : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-amber-300'
                              }`}
                            >
                              <div>
                                <div className="font-bold text-xs">{receta.nombre}</div>
                                <div className={`text-[11px] ${seleccionada ? 'text-amber-300' : 'text-slate-500'}`}>
                                  {peds.length} encargo{peds.length === 1 ? '' : 's'} ({unidadesTotal} unid{unidadesTotal === 1 ? '' : 'es'})
                                </div>
                              </div>
                              <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${
                                seleccionada ? 'bg-amber-400 text-slate-950' : 'bg-slate-200 text-slate-700'
                              }`}>
                                {peds.length}
                              </span>
                            </button>
                          );
                        })}

                        {recetasConPedidos.length === 0 && (
                          <div className="p-6 text-center text-xs text-slate-400">
                            <span className="text-2xl block mb-1">🎉</span>
                            ¡No hay pedidos pendientes por hornear para este filtro!
                          </div>
                        )}
                      </div>
                    </div>

                    {/* Lista de Encargos para la Receta Seleccionada */}
                    {recetaActual && pedidosDeEstaReceta.length > 0 && (
                      <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                          <div>
                            <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider">2. Seleccionar para esta tanda</h4>
                            <p className="text-[11px] text-slate-400">Marca 1 encargo o varios para tanda combinada.</p>
                          </div>
                          <div className="flex space-x-1">
                            <button
                              onClick={handleSeleccionarTodosDeReceta}
                              className="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-2 py-1 rounded"
                            >
                              Todos
                            </button>
                            <button
                              onClick={handleDeseleccionarTodos}
                              className="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-2 py-1 rounded"
                            >
                              Ninguno
                            </button>
                          </div>
                        </div>

                        <div className="space-y-2 max-h-[340px] overflow-y-auto pr-1">
                          {pedidosDeEstaReceta.map(p => {
                            const estaSeleccionado = pedidosSeleccionadosIds.includes(p.id);
                            return (
                              <div
                                key={p.id}
                                onClick={() => handleTogglePedido(p.id)}
                                className={`p-3 rounded-xl border cursor-pointer transition-all flex items-start space-x-3 ${
                                  estaSeleccionado
                                    ? 'bg-amber-50/70 border-amber-300 shadow-xs'
                                    : 'bg-white border-slate-200 hover:border-slate-300 opacity-70'
                                }`}
                              >
                                <input
                                  type="checkbox"
                                  checked={estaSeleccionado}
                                  onChange={() => {}}
                                  className="w-4 h-4 mt-0.5 text-amber-600 rounded focus:ring-amber-500 cursor-pointer"
                                />
                                <div className="flex-1 min-w-0 text-xs">
                                  <div className="flex items-center justify-between">
                                    <strong className="text-slate-900 truncate">{p.cliente_nombre}</strong>
                                    <span className="font-extrabold text-amber-800 bg-amber-100 px-1.5 py-0.2 rounded text-[11px]">
                                      x{p.cantidad}
                                    </span>
                                  </div>
                                  <div className="flex items-center justify-between text-slate-500 text-[11px] mt-1">
                                    <span>📅 {p.fecha_entrega}</span>
                                    <span>⏰ {p.hora_entrega || 'Todo el día'}</span>
                                  </div>
                                  {p.notas && (
                                    <div className="mt-1 text-[11px] text-amber-900 bg-amber-100/60 p-1.5 rounded italic">
                                      "{p.notas}"
                                    </div>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Columna Derecha: Mesa de Trabajo & Pesaje con Candado */}
                  <div className="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                    {recetaActual && cantidadTotalTanda > 0 ? (
                      <>
                        {/* Cabecera de la Tanda */}
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-100 gap-2">
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="text-xs font-bold text-amber-600 uppercase tracking-wider">Mesa de Pesaje en Balanza</span>
                              {pedidosSeleccionados.length > 1 && (
                                <span className="bg-indigo-100 text-indigo-700 text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase">
                                  🔥 Tanda Combinada ({pedidosSeleccionados.length} pedidos)
                                </span>
                              )}
                            </div>
                            <h2 className="text-xl font-extrabold text-slate-900 mt-1">{recetaActual.nombre}</h2>
                            <p className="text-xs text-slate-500">
                              Total a hornear: <strong className="text-amber-800">{cantidadTotalTanda} unidad(es)</strong> en una sola tanda
                            </p>
                          </div>
                          <div className="bg-amber-50 border border-amber-200 p-2.5 rounded-xl text-right">
                            <span className="text-[10px] text-amber-800 font-bold uppercase block">Tiempo Estimado</span>
                            <span className="text-sm font-extrabold text-amber-900">⏱️ {recetaActual.tiempo_minutos * cantidadTotalTanda} minutos</span>
                          </div>
                        </div>

                        {/* Candado de Seguridad y Alertas de Stock */}
                        {validacionStockTanda.hayFaltantes ? (
                          <div className="p-4 bg-rose-50 border border-rose-300 rounded-2xl space-y-2">
                            <div className="flex items-center space-x-2 text-rose-800 font-bold text-sm">
                              <span className="text-lg">⛔</span>
                              <span>Preparación Bloqueada: Materia Prima Insuficiente</span>
                            </div>
                            <p className="text-xs text-rose-700">
                              No puedes iniciar esta tanda porque tu bodega no tiene suficiente stock. Compra o añade insumos para continuar:
                            </p>
                            <div className="divide-y divide-rose-200/60 pt-1">
                              {validacionStockTanda.faltantes.map(f => (
                                <div key={f.insumo_id} className="py-2 flex items-center justify-between text-xs">
                                  <div>
                                    <strong className="text-rose-900">{f.nombre}</strong>
                                    <span className="text-rose-600 ml-2">
                                      (Requieres: {f.requerido} {f.unidad} • Tienes: {f.stockActual} {f.unidad} • Falta: <strong>{f.falta} {f.unidad}</strong>)
                                    </span>
                                  </div>
                                  <button
                                    type="button"
                                    onClick={() => onIrABodega && onIrABodega(f.insumo)}
                                    className="bg-rose-600 hover:bg-rose-700 text-white font-bold px-2.5 py-1 rounded-lg text-[11px] transition-colors flex items-center space-x-1"
                                  >
                                    <span>+ Comprar</span>
                                  </button>
                                </div>
                              ))}
                            </div>
                          </div>
                        ) : (

                                      type="checkbox"

                        {/* Equipos Eléctricos y Tiempos */}
                        {recetaActual.equipos && recetaActual.equipos.length > 0 && (

                        <div className="pt-3 border-t border-slate-200 flex items-center justify-end">
                          {validacionStockTanda.hayFaltantes ? (
                            <button
                              type="button"

                        <p className="text-xs mt-1">Al confirmar el horneado, los encargos pasarán a estado "En Preparación" y ya no estarán disponibles para hornearse de nuevo.</p>
                      </div>

              ) : (

                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">

                    </div>
                    <span className="text-xs font-bold bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full">
                      {pedidosParaMostrar.length} en cocina

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

    // ==========================================
    // 4. BODEGA DE INSUMOS (RESTAURADA EN FILAS COMPACTAS)
    // ==========================================
    function BodegaView({ insumos, setInsumos, setModalEditarInsumo, setModalRegistroCompra, setModalRegistroMerma }) {
      const [busqueda, setBusqueda] = useState('');
      const [orden, setOrden] = useState('prioridad_critica'); // 'prioridad_critica', 'mayor_stock', 'alfa_az', 'alfa_za'

      const insumosProcesados = useMemo(() => {
        let lista = insumos.filter(ins => {
          return ins.nombre.toLowerCase().includes(busqueda.toLowerCase());
        });

        lista.sort((a, b) => {
          if (orden === 'prioridad_critica') {
            const critA = a.stock_actual <= 0 ? 0 : a.stock_actual <= a.stock_min ? 1 : 2;
            const critB = b.stock_actual <= 0 ? 0 : b.stock_actual <= b.stock_min ? 1 : 2;
            if (critA !== critB) return critA - critB;
            return a.nombre.localeCompare(b.nombre);
          }
          if (orden === 'mayor_stock') return b.stock_actual - a.stock_actual;
          if (orden === 'alfa_az') return a.nombre.localeCompare(b.nombre);
          if (orden === 'alfa_za') return b.nombre.localeCompare(a.nombre);
          return 0;
        });

        return lista;
      }, [insumos, busqueda, orden]);

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Bodega de Insumos</h2>
              <p className="text-sm text-slate-500 mt-1">Control de materias primas, costos unitarios, compras y mermas.</p>
            </div>
            <button
              onClick={() => setModalEditarInsumo('nuevo')}
              className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl shadow-sm transition-colors flex items-center space-x-2 text-sm"
            >
              <span>➕</span>
              <span>Nuevo Insumo</span>
            </button>
          </div>

          {/* Barra de Filtro Rápido y Selector de Orden */}
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div className="w-full sm:w-80">
              <input
                type="text"
                placeholder="🔍 Buscar insumo por nombre..."
                value={busqueda}
                onChange={e => setBusqueda(e.target.value)}
                className="w-full px-3 py-1.5 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500"
              />
            </div>

            <div className="w-full sm:w-auto flex items-center space-x-2">
              <span className="text-xs font-bold text-slate-500 whitespace-nowrap">Ordenar por:</span>
              <select
                value={orden}
                onChange={e => setOrden(e.target.value)}
                className="px-3 py-1.5 text-xs rounded-lg border border-slate-300 bg-white font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500"
              >
                <option value="prioridad_critica">🚨 Prioridad Crítica (Agotados / Bajos primero)</option>
                <option value="mayor_stock">📦 Mayor Stock primero</option>
                <option value="alfa_az">🔤 Alfabético (A - Z)</option>
                <option value="alfa_za">🔤 Alfabético (Z - A)</option>
              </select>
            </div>
          </div>

          {/* TABLA DE FILAS COMPACTAS (RESTAURADA) */}
          <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 text-slate-500 uppercase font-bold text-[10px] border-b border-slate-200">
                  <tr>
                    <th className="py-3 px-4">Insumo</th>
                    <th className="py-3 px-3">Stock Actual</th>
                    <th className="py-3 px-3">Reserva Mínima</th>
                    <th className="py-3 px-3">Presentación Comercial</th>
                    <th className="py-3 px-3">Costo Unitario</th>
                    <th className="py-3 px-3">Estado</th>
                    <th className="py-3 px-4 text-right">Acciones Rápidas</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-slate-700">
                  {insumosProcesados.map(ins => {
                    const costoUnitario = ins.gramos_por_empaque > 0 ? (ins.costo_empaque / ins.gramos_por_empaque) : 0;
                    const esAgotado = ins.stock_actual <= 0;
                    const esCritico = !esAgotado && ins.stock_actual <= ins.stock_min;

                    return (
                      <tr key={ins.id} className="hover:bg-slate-50/70 transition-colors">
                        <td className="py-3 px-4 font-bold text-slate-900">
                          {ins.nombre}
                        </td>
                        <td className="py-3 px-3 font-extrabold text-slate-900">
                          <span className={esAgotado ? 'text-rose-600' : esCritico ? 'text-amber-600' : 'text-slate-900'}>
                            {ins.stock_actual} {ins.unidad}
                          </span>
                        </td>
                        <td className="py-3 px-3 text-slate-500">
                          {ins.stock_min} {ins.unidad}
                        </td>
                        <td className="py-3 px-3">
                          {ins.gramos_por_empaque} {ins.unidad} = <strong className="text-slate-800">{formatCOP(ins.costo_empaque)}</strong>
                        </td>
                        <td className="py-3 px-3 font-semibold text-slate-800">
                          {formatCOP(costoUnitario)} / {ins.unidad}
                        </td>
                        <td className="py-3 px-3">
                          <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${
                            esAgotado ? 'bg-rose-100 text-rose-800' :
                            esCritico ? 'bg-amber-100 text-amber-800' :
                            'bg-emerald-100 text-emerald-800'
                          }`}>
                            {esAgotado ? 'Agotado' : esCritico ? 'Stock Bajo' : 'Óptimo'}
                          </span>
                        </td>
                        <td className="py-3 px-4 text-right">
                          <div className="flex items-center justify-end space-x-1.5">
                            <button
                              onClick={() => setModalRegistroCompra(ins)}
                              className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-bold px-2 py-1 rounded-lg text-[11px] transition-colors"
                              title="Registrar compra y sumar stock"
                            >
                              + Compra
                            </button>
                            <button
                              onClick={() => setModalRegistroMerma(ins)}
                              className="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold px-2 py-1 rounded-lg text-[11px] transition-colors"
                              title="Registrar merma o pérdida"
                            >
                              - Merma
                            </button>
                            <button
                              onClick={() => setModalEditarInsumo(ins)}
                              className="text-slate-500 hover:text-slate-800 hover:bg-slate-100 p-1 rounded-lg text-xs"
                              title="Editar ficha"
                            >
                              ✏️
                            </button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {insumosProcesados.length === 0 && (
              <div className="text-center py-12 text-slate-400 text-xs">
                No se encontraron insumos con ese nombre.
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. RECETARIO Y COSTEO (RESTAURADO EN ACORDEÓN DESPLEGABLE)
    // ==========================================
    function RecetarioView({ recetas, setRecetas, insumos, calcularCostosReceta, setModalEditarReceta }) {
      const [escala, setEscala] = useState({});
      const [abiertos, setAbiertos] = useState({});
      const [simuladorAbierto, setSimuladorAbierto] = useState({});
      const [metaHoraria, setMetaHoraria] = useState({});

      const toggleAcordeon = (id) => {
        setAbiertos({ ...abiertos, [id]: !abiertos[id] });
      };

      const toggleSimulador = (id) => {
        setSimuladorAbierto({ ...simuladorAbierto, [id]: !simuladorAbierto[id] });
      };

      const cambiarEscala = (id, factor) => {
        setEscala({ ...escala, [id]: factor });
      };

      const handleAplicarPrecioSugerido = (receta, nuevoPrecio) => {
        if (confirm(`¿Deseas actualizar el precio de venta de "${receta.nombre}" a ${formatCOP(nuevoPrecio)}?`)) {
          setRecetas(recetas.map(r => r.id === receta.id ? { ...r, precio_venta: Math.round(nuevoPrecio) } : r));
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Recetario y Costeo</h2>
              <p className="text-sm text-slate-500 mt-1">Fichas técnicas dinámicas con porcentajes por ingrediente, escala live y retorno horario.</p>
            </div>
            <button
              onClick={() => setModalEditarReceta('nuevo')}
              className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl shadow-sm transition-colors flex items-center space-x-2 text-sm"
            >
              <span>➕</span>
              <span>Nueva Receta</span>
            </button>
          </div>

          {/* LISTA EN ACORDEÓN COLAPSABLE */}
          <div className="space-y-4">
            {recetas.map(rec => {
              const factor = escala[rec.id] || 1;
              const costos = calcularCostosReceta(rec, factor);
              const estaAbierto = abiertos[rec.id] || false;
              const simAbierto = simuladorAbierto[rec.id] || false;

              const metaActual = metaHoraria[rec.id] || 25000;
              const horasBase = (rec.tiempo_minutos || 60) / 60;
              const precioVentaSugerido = (costos.costoTotal / factor) + (metaActual * horasBase);
              const diferenciaPrecio = precioVentaSugerido - rec.precio_venta;

              // Cálculo de peso total para porcentajes panaderos / de fórmula
              const pesoTotalGramos = rec.ingredientes.reduce((sum, it) => {
                const itIns = insumos.find(x => x.id === it.insumo_id);
                return (itIns?.unidad === 'g' || itIns?.unidad === 'ml') ? sum + (it.cantidad * factor) : sum;
              }, 0);

              return (
                <div key={rec.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm transition-shadow hover:shadow-md">
                  {/* BARRA RESUMEN DE LA RECETA (CLICK PARA COLAPSAR/EXPANDIR) */}
                  <div
                    onClick={() => toggleAcordeon(rec.id)}
                    className="p-5 bg-white cursor-pointer flex flex-col lg:flex-row lg:items-center justify-between gap-4 hover:bg-slate-50/70 transition-colors"
                  >
                    <div className="flex items-center space-x-3">
                      <span className="text-xl text-slate-400 font-bold w-6 text-center">
                        {estaAbierto ? '▼' : '►'}
                      </span>
                      <div>
                        <h3 className="font-extrabold text-slate-900 text-base">{rec.nombre}</h3>
                        <p className="text-xs text-slate-500 mt-0.5">
                          Rendimiento: {rec.porciones_base} unidad(es) • {rec.tiempo_minutos} min activos • CIF: {rec.cif_porcentaje || 0}%
                        </p>
                      </div>
                    </div>

                    <div className="flex flex-wrap items-center gap-3" onClick={e => e.stopPropagation()}>
                      {/* Retorno Horario en la Barra */}
                      <div className="bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-xl text-xs">
                        <span className="text-[10px] text-emerald-800 font-bold block uppercase">Retorno por tu hora:</span>
                        <span className="font-extrabold text-emerald-700 text-sm">{formatCOP(costos.valorHoraReal)} / h</span>
                      </div>

                      {/* Precio de Venta */}
                      <div className="bg-slate-50 border border-slate-200 px-3 py-1 rounded-xl text-xs">
                        <span className="text-[10px] text-slate-400 font-bold block uppercase">Precio de Venta:</span>
                        <span className="font-extrabold text-slate-900 text-sm">{formatCOP(rec.precio_venta * factor)}</span>
                      </div>

                      {/* Escala Live */}
                      <div className="flex bg-slate-100 rounded-lg p-0.5 space-x-0.5">
                        {[1, 1.5, 2, 3].map(f => (
                          <button
                            key={f}
                            onClick={() => cambiarEscala(rec.id, f)}
                            className={`px-2 py-0.5 text-xs font-bold rounded ${
                              factor === f ? 'bg-amber-500 text-slate-950 shadow-sm' : 'text-slate-600 hover:bg-slate-200'
                            }`}
                          >
                            x{f}
                          </button>
                        ))}
                      </div>

                      <button
                        onClick={() => setModalEditarReceta(rec)}
                        className="text-xs text-amber-700 bg-amber-100 hover:bg-amber-200 px-2.5 py-1.5 rounded-lg font-bold transition-colors"
                      >
                        ✏️ Editar
                      </button>
                    </div>
                  </div>

                  {/* CUERPO EXPANDIDO (SOLO SI ESTÁ ABIERTO) */}
                  {estaAbierto && (
                    <div className="p-6 border-t border-slate-200 bg-slate-50/40 grid grid-cols-1 lg:grid-cols-3 gap-6">
                      <div className="lg:col-span-2 space-y-4">
                        <div className="flex items-center justify-between">
                          <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">
                            Ingredientes y Participación Porcentual (Escala x{factor}):
                          </h4>
                          <span className="text-[11px] text-slate-500 font-semibold bg-white px-2.5 py-1 rounded-lg border border-slate-200 shadow-xs">
                            Total Insumos: <strong className="text-emerald-700">{formatCOP(costos.costoInsumos)}</strong>
                          </span>
                        </div>

                        {/* LISTA DE INGREDIENTES CON PORCENTAJES DESTACADOS */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                          {rec.ingredientes.map(ing => {
                            const ins = insumos.find(i => i.id === ing.insumo_id);
                            const cant = ing.cantidad * factor;
                            const costoUnit = ins && ins.gramos_por_empaque > 0 ? (ins.costo_empaque / ins.gramos_por_empaque) : 0;
                            const costoIng = cant * costoUnit;

                            // 1. Porcentaje en el costo total de insumos
                            const porcCosto = costos.costoInsumos > 0 ? Math.round((costoIng / costos.costoInsumos) * 100) : 0;

                            // 2. Porcentaje en peso de la fórmula
                            const esPeso = ins?.unidad === 'g' || ins?.unidad === 'ml';
                            const porcPeso = (esPeso && pesoTotalGramos > 0) ? Math.round((cant / pesoTotalGramos) * 100) : null;

                            return (
                              <div key={ing.insumo_id} className="p-3 bg-white rounded-xl border border-slate-200 hover:border-amber-300 transition-colors flex justify-between items-center text-xs shadow-xs">
                                <div className="min-w-0 pr-2">
                                  <span className="font-bold text-slate-800 block truncate">{ins?.nombre}</span>
                                  <div className="flex flex-wrap items-center gap-1.5 mt-1">
                                    <span
                                      className="text-[10px] font-extrabold text-amber-900 bg-amber-100 px-2 py-0.5 rounded-md flex items-center space-x-1"
                                      title="Porcentaje del costo total de insumos que representa este ingrediente"
                                    >
                                      <span>💰</span>
                                      <span>{porcCosto}% costo</span>
                                    </span>
                                    {porcPeso !== null && (
                                      <span
                                        className="text-[10px] font-semibold text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded-md"
                                        title="Porcentaje de peso en la fórmula total"
                                      >
                                        ⚖️ {porcPeso}% peso
                                      </span>
                                    )}
                                  </div>
                                </div>
                                <div className="text-right flex-shrink-0">
                                  <span className="font-extrabold text-slate-900 text-sm block">{cant} {ins?.unidad}</span>
                                  <span className="text-[11px] font-semibold text-emerald-700">{formatCOP(costoIng)}</span>
                                </div>
                              </div>
                            );
                          })}
                        </div>

                        {rec.equipos && rec.equipos.length > 0 && (
                          <div>
                            <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Equipos eléctricos (Horno & Batidora):</h4>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                              {rec.equipos.map((eq, idx) => (
                                <div key={idx} className="p-2 bg-amber-50/60 border border-amber-200/60 rounded-xl flex justify-between">
                                  <div>
                                    <span className="font-bold text-slate-800 block">⚡ {eq.nombre}</span>
                                    <span className="text-[10px] text-slate-500">{eq.potencia_watts} W • {eq.minutos_uso * factor} min</span>
                                  </div>
                                  <div className="text-right">
                                    <span className="font-bold text-amber-800">
                                      {formatCOP((eq.potencia_watts / 1000) * ((eq.minutos_uso * factor) / 60) * 850)}
                                    </span>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>

                      {/* COLUMNA DERECHA: DESGLOSE DE COSTOS Y SIMULADOR */}
                      <div className="space-y-4">
                        <div className="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm space-y-2 text-xs">
                          <h4 className="font-bold text-slate-800 pb-1 border-b border-slate-100">Estructura de Costeo Real</h4>
                          <div className="flex justify-between text-slate-600">
                            <span>Insumos Totales:</span>
                            <span className="font-bold text-slate-900">{formatCOP(costos.costoInsumos)}</span>
                          </div>
                          <div className="flex justify-between text-slate-600">
                            <span>Energía (Horno/Batidora):</span>
                            <span className="font-bold text-slate-900">{formatCOP(costos.costoEnergia)}</span>
                          </div>
                          <div className="flex justify-between text-slate-600">
                            <span>Costos Indirectos (CIF {rec.cif_porcentaje || 0}%):</span>
                            <span className="font-bold text-slate-900">{formatCOP(costos.costoCIF)}</span>
                          </div>
                          <div className="flex justify-between font-extrabold text-sm pt-2 border-t border-slate-200">
                            <span className="text-slate-800">Costo de Producción:</span>
                            <span className="text-amber-700">{formatCOP(costos.costoTotal)}</span>
                          </div>
                          <div className="flex justify-between font-extrabold text-sm text-emerald-700 pt-1">
                            <span>Ganancia Limpia:</span>
                            <span>{formatCOP(costos.remanenteNeto)}</span>
                          </div>
                          <div className="mt-3 p-3 bg-emerald-50 border border-emerald-200 rounded-xl">
                            <div className="text-[10px] text-emerald-800 font-bold uppercase">Pago Real por tu Hora Trabajada:</div>
                            <div className="text-xl font-extrabold text-emerald-700 mt-0.5">{formatCOP(costos.valorHoraReal)} / hora</div>
                            <div className="text-[10px] text-emerald-600 mt-1">Tiempo de mano de obra: {costos.horasTrabajo.toFixed(1)} horas</div>
                          </div>
                        </div>

                        {/* BOTÓN DESPLEGABLE SIMULADOR */}
                        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                          <button
                            type="button"
                            onClick={() => toggleSimulador(rec.id)}
                            className="w-full p-3 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs flex justify-between items-center transition-colors"
                          >
                            <span>🎯 Simulador: ¿Cuánto deberías cobrar?</span>
                            <span>{simAbierto ? '▲' : '▼'}</span>
                          </button>

                          {simAbierto && (
                            <div className="p-4 space-y-3 text-xs">
                              <div>
                                <label className="font-bold text-slate-700 block mb-1">
                                  ¿Cuánto deseas ganar por tu hora de trabajo?
                                </label>
                                <input
                                  type="number"
                                  step="5000"
                                  value={metaActual}
                                  onChange={e => setMetaHoraria({ ...metaHoraria, [rec.id]: Number(e.target.value) })}
                                  className="w-full px-3 py-1.5 rounded-lg border border-slate-300 font-bold text-slate-900"
                                />
                              </div>

                              <div className="p-3 bg-amber-50/70 border border-amber-200 rounded-xl space-y-1">
                                <div className="text-slate-600">Precio Sugerido para tu meta:</div>
                                <div className="text-base font-extrabold text-slate-900">{formatCOP(precioVentaSugerido)}</div>
                                <div className={`text-[11px] font-semibold ${diferenciaPrecio > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                                  {diferenciaPrecio > 0
                                    ? `Estás cobrando ${formatCOP(diferenciaPrecio)} menos de lo sugerido`
                                    : '¡Tu precio actual supera tu meta horaria!'}
                                </div>
                              </div>

                              {diferenciaPrecio > 0 && (
                                <button
                                  type="button"
                                  onClick={() => handleAplicarPrecioSugerido(rec, precioVentaSugerido)}
                                  className="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-xl text-xs transition-colors"
                                >
                                  Aplicar Precio Sugerido ({formatCOP(precioVentaSugerido)})
                                </button>
                              )}
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. AUDITORÍA E HISTORIAL (CON FIDELIDAD DE CLIENTES)
    // ==========================================
    function HistorialView({ pedidos, mermas, insumos, recetas }) {
      const [pestana, setPestana] = useState('fidelidad'); // 'fidelidad' | 'pedidos_pasados' | 'mermas'
      const [ordenarPor, setOrdenarPor] = useState('ltv'); // 'ltv' | 'fecha' | 'alfabetico'
      const [busqueda, setBusqueda] = useState('');
      const [clienteExpandidoId, setClienteExpandidoId] = useState(null);

      const clientesFidelidad = useMemo(() => {
        const mapa = {};

        pedidos.forEach(p => {
          const key = p.cliente_nombre.trim();
          if (!mapa[key]) {
            mapa[key] = {
              id: key,
              nombre: key,
              telefono: p.cliente_telefono,
              pedidos: [],
              totalFacturado: 0,
              completados: 0,
              cancelados: 0,
              activos: 0,
              ultimaFecha: p.fecha_entrega || ''
            };
          }

          mapa[key].pedidos.push(p);
          if (p.estado !== 'cancelado') {
            mapa[key].totalFacturado += p.precio_total;
          }
          if (p.estado === 'entregado') mapa[key].completados++;
          else if (p.estado === 'cancelado') mapa[key].cancelados++;
          else mapa[key].activos++;

          if (p.fecha_entrega && p.fecha_entrega > mapa[key].ultimaFecha) {
            mapa[key].ultimaFecha = p.fecha_entrega;
          }
        });

        let lista = Object.values(mapa);

        // Filtro por búsqueda
        if (busqueda.trim()) {
          const q = busqueda.toLowerCase().trim();
          lista = lista.filter(c => c.nombre.toLowerCase().includes(q) || c.telefono.includes(q));
        }

        // Ordenamiento dinámico
        if (ordenarPor === 'ltv') {
          lista.sort((a, b) => b.totalFacturado - a.totalFacturado);
        } else if (ordenarPor === 'fecha') {
          lista.sort((a, b) => (b.ultimaFecha || '').localeCompare(a.ultimaFecha || ''));
        } else if (ordenarPor === 'alfabetico') {
          lista.sort((a, b) => a.nombre.localeCompare(b.nombre));
        }

        return lista;
      }, [pedidos, busqueda, ordenarPor]);

      const toggleCliente = (id) => {
        setClienteExpandidoId(clienteExpandidoId === id ? null : id);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Auditoría e Historial</h2>
              <p className="text-sm text-slate-500 mt-1">Fidelidad de clientes (LTV), registro histórico de mermas y pedidos pasados.</p>
            </div>

            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
              <button
                onClick={() => setPestana('fidelidad')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${
                  pestana === 'fidelidad' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                👥 Fidelidad de Clientes
              </button>
              <button
                onClick={() => setPestana('pedidos_pasados')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${
                  pestana === 'pedidos_pasados' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                📜 Archivo de Encargos
              </button>
              <button
                onClick={() => setPestana('mermas')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${
                  pestana === 'mermas' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                📉 Mermas & Pérdidas
              </button>
            </div>
          </div>

          {pestana === 'fidelidad' && (
            <div className="space-y-4">
              {/* Barra de Búsqueda y Ordenamiento */}
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-3 items-center justify-between">
                <div className="w-full sm:w-72">
                  <input
                    type="text"
                    placeholder="🔍 Buscar cliente o teléfono..."
                    value={busqueda}
                    onChange={e => setBusqueda(e.target.value)}
                    className="w-full px-3 py-1.5 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500"
                  />
                </div>

                <div className="flex items-center space-x-1.5 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                  <span className="text-[11px] font-bold text-slate-400 uppercase mr-1">Ordenar por:</span>
                  {[
                    { id: 'ltv', label: '👑 Mayor Fidelidad (LTV)' },
                    { id: 'fecha', label: '📅 Más Reciente' },
                    { id: 'alfabetico', label: '🔤 Nombre (A - Z)' }
                  ].map(ord => (
                    <button
                      key={ord.id}
                      onClick={() => setOrdenarPor(ord.id)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors whitespace-nowrap ${
                        ordenarPor === ord.id
                          ? 'bg-slate-900 text-white shadow'
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                      }`}
                    >
                      {ord.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Lista de Tarjetas Compactas con Acordeón Fluido */}
              <div className="space-y-3">
                {clientesFidelidad.map((cli) => {
                  const expandido = clienteExpandidoId === cli.id;
                  const ticketPromedio = cli.pedidos.length > 0 ? (cli.totalFacturado / cli.pedidos.length) : 0;

                  return (
                    <div
                      key={cli.id}
                      className={`bg-white rounded-xl border transition-all shadow-sm overflow-hidden ${
                        expandido ? 'border-amber-400 ring-2 ring-amber-100' : 'border-slate-200 hover:border-slate-300'
                      }`}
                    >
                      {/* Cabecera Compacta */}
                      <div
                        onClick={() => toggleCliente(cli.id)}
                        className="p-4 cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/60 transition-colors"
                      >
                        <div className="flex items-center space-x-3">
                          <div className="w-9 h-9 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center font-extrabold text-sm flex-shrink-0">
                            {cli.nombre.charAt(0).toUpperCase()}
                          </div>
                          <div>
                            <div className="flex items-center space-x-2">
                              <h3 className="font-bold text-slate-900 text-sm">{cli.nombre}</h3>
                              <span className="text-[11px] font-semibold bg-amber-50 text-amber-800 px-2 py-0.2 rounded border border-amber-200">
                                {cli.pedidos.length} encargo{cli.pedidos.length === 1 ? '' : 's'}
                              </span>
                            </div>
                            <span className="text-xs text-slate-500">📞 {cli.telefono}</span>
                          </div>
                        </div>

                        <div className="flex items-center space-x-4 sm:space-x-6">
                          <div className="text-right">
                            <span className="text-[10px] text-slate-400 block font-bold uppercase">Total Acumulado (LTV)</span>
                            <span className="text-sm font-extrabold text-emerald-700">{formatCOP(cli.totalFacturado)}</span>
                          </div>

                          <div className="text-right hidden sm:block">
                            <span className="text-[10px] text-slate-400 block font-bold uppercase">Última compra</span>
                            <span className="text-xs text-slate-700 font-semibold">{cli.ultimaFecha || 'Sin fecha'}</span>
                          </div>

                          <button
                            type="button"
                            className={`p-1.5 rounded-lg text-xs font-bold transition-colors ${
                              expandido ? 'bg-amber-500 text-slate-950' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                            }`}
                          >
                            {expandido ? '▲ Ocultar' : '▼ Ver Historial'}
                          </button>
                        </div>
                      </div>

                      {/* Acordeón Desplegable con Detalles de los Encargos */}
                      {expandido && (
                        <div className="p-4 bg-slate-50 border-t border-slate-100 space-y-3">
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                            <div className="bg-white p-2.5 rounded-lg border border-slate-200">
                              <span className="text-slate-400 block text-[10px] uppercase font-bold">Ticket Promedio:</span>
                              <span className="font-bold text-slate-800">{formatCOP(ticketPromedio)}</span>
                            </div>
                            <div className="bg-white p-2.5 rounded-lg border border-slate-200">
                              <span className="text-slate-400 block text-[10px] uppercase font-bold">Estado de Pedidos:</span>
                              <span className="text-emerald-700 font-semibold">✓ {cli.completados} entregados</span>
                              {cli.activos > 0 && <span className="text-amber-700 font-semibold ml-2">• ⏳ {cli.activos} en curso</span>}
                              {cli.cancelados > 0 && <span className="text-rose-700 font-semibold ml-2">• ✕ {cli.cancelados} cancelados</span>}
                            </div>
                            <div className="bg-white p-2.5 rounded-lg border border-slate-200">
                              <span className="text-slate-400 block text-[10px] uppercase font-bold">Total Invertido:</span>
                              <span className="font-extrabold text-emerald-700">{formatCOP(cli.totalFacturado)}</span>
                            </div>
                          </div>

                          <h4 className="text-xs font-bold text-slate-600 uppercase tracking-wider pt-1">
                            Detalle de encargos realizados por este cliente:
                          </h4>

                          <div className="space-y-2">
                            {cli.pedidos.map(p => {
                              const rec = recetas.find(r => r.id === p.receta_id);
                              return (
                                <div key={p.id} className="p-3 bg-white rounded-xl border border-slate-200 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2 shadow-xs">
                                  <div>
                                    <div className="font-bold text-slate-900">{rec?.nombre} (x{p.cantidad})</div>
                                    <div className="text-[11px] text-slate-500 mt-0.5">
                                      Fecha de entrega: <strong>{p.fecha_entrega}</strong> • Hora: {p.hora_entrega || 'Sin hora'}
                                    </div>
                                    {p.notas && <p className="text-[11px] text-slate-600 italic mt-1 bg-slate-50 p-1.5 rounded">"{p.notas}"</p>}
                                  </div>
                                  <div className="text-right flex sm:flex-col items-center sm:items-end justify-between sm:justify-center">
                                    <span className="font-extrabold text-slate-900">{formatCOP(p.precio_total)}</span>
                                    <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-full mt-0.5 ${
                                      p.estado === 'entregado' ? 'bg-emerald-100 text-emerald-800' :
                                      p.estado === 'cancelado' ? 'bg-rose-100 text-rose-800' :
                                      p.estado === 'en_preparacion' ? 'bg-indigo-100 text-indigo-800' :
                                      'bg-amber-100 text-amber-800'
                                    }`}>
                                      {p.estado === 'entregado' ? 'Entregado' :
                                       p.estado === 'cancelado' ? 'Cancelado' :
                                       p.estado === 'en_preparacion' ? 'En Cocina' : 'Pendiente'}
                                    </span>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}

                {clientesFidelidad.length === 0 && (
