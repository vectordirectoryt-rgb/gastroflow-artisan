    // MODAL PASE A COCINA CON BLOQUEO ESTRICTO (CORRECCIÓN IMPLEMENTADA)
    function ModalPaseCocina({ pedido, recetas, insumos, onConfirmar, onClose, onIrABodega }) {
      const receta = recetas.find(r => r.id === pedido.receta_id);

      const { verificacion, hayFaltantes } = useMemo(() => {
        if (!receta) return { verificacion: [], hayFaltantes: false };

        let faltanteDetectado = false;
        const lista = receta.ingredientes.map(ing => {
          const ins = insumos.find(i => i.id === ing.insumo_id);
          const cantidadRequerida = ing.cantidad * pedido.cantidad;
          const stockActual = ins?.stock_actual || 0;
          const alcanza = stockActual >= cantidadRequerida;

          if (!alcanza) faltanteDetectado = true;

          return {
            insumo: ins,
            cantidadRequerida,
            stockActual,
            alcanza,
            deficit: Math.max(0, cantidadRequerida - stockActual)
          };
        });

        return { verificacion: lista, hayFaltantes: faltanteDetectado };
      }, [receta, insumos, pedido]);

      return (
        <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl">
            <div className="flex justify-between items-center pb-3 border-b border-slate-200">
              <div>
                <h3 className="font-bold text-slate-900 text-lg">Validación de Insumos - Pase a Cocina</h3>
                <p className="text-xs text-slate-500">Para: {pedido.cliente_nombre} • {receta?.nombre} (x{pedido.cantidad})</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            {hayFaltantes ? (
              <div className="mt-4 p-3 bg-rose-50 border border-rose-300 rounded-xl text-xs text-rose-800 space-y-1">
                <div className="font-bold flex items-center space-x-1.5 text-rose-900">
                  <span>⛔</span>
                  <span>Preparación Bloqueada: Materia Prima Insuficiente</span>
                </div>
                <p>
                  No dispones de las existencias necesarias en bodega para completar esta receta. No puedes pasar a cocina sin insumos suficientes. Registra la compra en Bodega antes de continuar.
                </p>
              </div>
            ) : (
              <div className="mt-4 p-3 bg-emerald-50 border border-emerald-300 rounded-xl text-xs text-emerald-800">
                <span className="font-bold">✓ ¡Materia prima disponible al 100%!</span> Al confirmar, se descontarán automáticamente los ingredientes de la bodega y el encargo pasará a preparación.
              </div>
            )}

            <div className="mt-4 max-h-60 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-xl">
              {verificacion.map(item => (
                <div key={item.insumo?.id} className={`p-3 text-xs flex justify-between items-center ${!item.alcanza ? 'bg-rose-50/70' : ''}`}>
                  <div>
                    <span className="font-bold text-slate-800 block">{item.insumo?.nombre}</span>
                    <span className="text-[11px] text-slate-500">
                      Requiere: <strong>{item.cantidadRequerida} {item.insumo?.unidad}</strong> | En Bodega: <strong>{item.stockActual} {item.insumo?.unidad}</strong>
                    </span>
                  </div>

                  <div>
                    {item.alcanza ? (
                      <span className="font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded text-[11px]">Disponible ✓</span>
                    ) : (
                      <div className="flex items-center space-x-2">
                        <span className="font-bold text-rose-700 bg-rose-100 px-2 py-0.5 rounded text-[11px]">
                          Faltan {item.deficit} {item.insumo?.unidad}
                        </span>
                        <button
                          onClick={() => onIrABodega(item.insumo)}
                          className="bg-rose-600 hover:bg-rose-700 text-white font-semibold px-2 py-0.5 rounded text-[10px]"
                        >
                          + Comprar
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>

            <div className="mt-6 pt-3 border-t border-slate-200 flex justify-end space-x-3">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-100 rounded-xl text-xs"
              >
                Cerrar
              </button>

              <button
                type="button"
                disabled={hayFaltantes}
                onClick={onConfirmar}
                className={`px-5 py-2 font-bold rounded-xl text-xs transition-colors shadow-sm flex items-center space-x-1.5 ${
                  hayFaltantes
                    ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                    : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                }`}
              >
                <span>👨‍🍳</span>
                <span>Confirmar y Descontar de Bodega</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL WHATSAPP
    function ModalWhatsApp({ pedido, recetas, onClose }) {
      const receta = recetas.find(r => r.id === pedido.receta_id);
      const saldo = Math.max(0, pedido.precio_total - pedido.abono);

      const mensajeDefault = `Hola ${pedido.cliente_nombre} 👋, te saludamos de GastroFlow Artisan.\n\nQueremos confirmarte que tu encargo de *${receta?.nombre}* (x${pedido.cantidad}) está agendado con éxito para el día *${pedido.fecha_entrega}* a las *${pedido.hora_entrega || 'por acordar'}*.\n\n💰 Total: ${formatCOP(pedido.precio_total)}\n💵 Abono recibido: ${formatCOP(pedido.abono)}\n${saldo > 0 ? `👉 *Saldo pendiente por cancelar:* ${formatCOP(saldo)}` : '🎉 *¡Tu pedido se encuentra totalmente pagado!*'}\n\n¡Quedamos muy atentos y trabajando con mucho amor en tu preparación! 🥐✨`;

      const [mensaje, setMensaje] = useState(mensajeDefault);

      const handleEnviarWhatsApp = () => {
        let tel = pedido.cliente_telefono.replace(/\D/g, '');
        if (tel.length === 10) tel = '57' + tel;
        const url = `https://wa.me/${tel}?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            <div className="flex justify-between items-center pb-3 border-b border-slate-200">
              <h3 className="font-bold text-slate-900 text-base flex items-center space-x-1.5">
                <span>💬</span>
                <span>Editor de Mensaje de WhatsApp</span>
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div className="mt-4 space-y-3 text-xs">
              <p className="text-slate-500">
                Puedes personalizar el texto antes de abrir la conversación con <strong>{pedido.cliente_nombre}</strong>:
              </p>
              <textarea
                rows="8"
                value={mensaje}
                onChange={e => setMensaje(e.target.value)}
                className="w-full p-3 rounded-xl border border-slate-300 font-mono text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"
              ></textarea>
            </div>

            <div className="mt-4 pt-3 border-t border-slate-200 flex justify-end space-x-2 text-xs">
              <button onClick={onClose} className="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-100 rounded-xl">Cancelar</button>
              <button
                onClick={handleEnviarWhatsApp}
                className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-sm flex items-center space-x-1.5"
              >
                <span>💬</span>
                <span>Abrir en WhatsApp</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL REGISTRO DE COMPRA
    function ModalRegistroCompra({ insumo, onGuardar, onClose }) {
      const [paquetes, setPaquetes] = useState(1);
      const [nuevoCosto, setNuevoCosto] = useState(insumo?.costo_empaque || 10000);

      const cantidadAAumentar = paquetes * (insumo?.gramos_por_empaque || 1000);
      const inversionTotal = paquetes * nuevoCosto;

      const handleConfirmar = () => {
        onGuardar({
          ...insumo,
          stock_actual: insumo.stock_actual + cantidadAAumentar,
          costo_empaque: Number(nuevoCosto)
        });
      };

      return (
        <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
            <div className="flex justify-between items-center pb-3 border-b border-slate-200">
              <h3 className="font-bold text-slate-900 text-base">Registrar Compra</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div className="mt-4 space-y-3 text-xs">
              <div className="font-bold text-slate-800 text-sm">{insumo?.nombre}</div>
              <p className="text-slate-500">Presentación: {insumo?.gramos_por_empaque} {insumo?.unidad} por empaque.</p>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Cantidad de Paquetes Comprados:</label>
                <input
                  type="number"
                  min="1"
                  value={paquetes}
                  onChange={e => setPaquetes(Math.max(1, Number(e.target.value)))}
                  className="w-full px-3 py-2 rounded-xl border border-slate-300 font-extrabold text-slate-900"
                />
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Precio por Empaque (COP):</label>
                <input
                  type="number"
                  value={nuevoCosto}
                  onChange={e => setNuevoCosto(Number(e.target.value))}
                  className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                />
              </div>

              <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl space-y-1">
                <div className="flex justify-between">
                  <span className="text-emerald-800">Incremento de Stock:</span>
                  <span className="font-bold text-emerald-900">+{cantidadAAumentar} {insumo?.unidad}</span>
                </div>
                <div className="flex justify-between font-bold text-sm text-emerald-900 pt-1 border-t border-emerald-200">
                  <span>Inversión Total:</span>
                  <span>{formatCOP(inversionTotal)}</span>
                </div>
              </div>
            </div>

            <div className="mt-5 pt-3 border-t border-slate-200 flex justify-end space-x-2 text-xs">
              <button onClick={onClose} className="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-100 rounded-xl">Cancelar</button>
              <button onClick={handleConfirmar} className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-sm">Confirmar Ingreso</button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL REGISTRO DE MERMA
    function ModalRegistroMerma({ insumo, onGuardar, onClose }) {
      const [cantidad, setCantidad] = useState(100);
      const [motivo, setMotivo] = useState('Vencimiento / Descomposición');

      const costoGramo = insumo?.gramos_por_empaque > 0 ? (insumo.costo_empaque / insumo.gramos_por_empaque) : 0;
      const costoTotalMerma = cantidad * costoGramo;

      const handleConfirmar = () => {
        if (cantidad > insumo.stock_actual) {
          return alert('La merma no puede superar el stock actual disponible en bodega.');
        }

        const mermaObj = {
          id: 'mrm_' + Date.now(),
          fecha: new Date().toISOString().split('T')[0],
          insumo_id: insumo.id,
          cantidad: Number(cantidad),
          motivo,
          costo_total: Math.round(costoTotalMerma)
        };

        const insumoActualizado = {
          ...insumo,
          stock_actual: Math.max(0, insumo.stock_actual - Number(cantidad))
        };

        onGuardar(mermaObj, insumoActualizado);
      };

      return (
        <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
            <div className="flex justify-between items-center pb-3 border-b border-slate-200">
              <h3 className="font-bold text-slate-900 text-base">Registrar Merma / Pérdida</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <div className="mt-4 space-y-3 text-xs">
              <div className="font-bold text-slate-800">{insumo?.nombre}</div>
              <p className="text-slate-500">Stock disponible: {insumo?.stock_actual} {insumo?.unidad}</p>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Cantidad Perdida ({insumo?.unidad}):</label>
                <input
                  type="number"
                  min="1"
                  max={insumo?.stock_actual}
                  value={cantidad}
                  onChange={e => setCantidad(Number(e.target.value))}
                  className="w-full px-3 py-2 rounded-xl border border-slate-300 font-extrabold text-rose-600"
                />
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Motivo / Causa:</label>
                <select
                  value={motivo}
                  onChange={e => setMotivo(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white"
                >
                  <option value="Vencimiento / Descomposición">Vencimiento / Descomposición</option>
                  <option value="Accidente o caída en mesón">Accidente o caída en mesón</option>
                  <option value="Quema o sobrecocción en horno">Quema o sobrecocción en horno</option>
                  <option value="Humedad / Contaminación">Humedad / Contaminación</option>
                  <option value="Prueba técnica o ensayo">Prueba técnica o ensayo</option>
                </select>
              </div>

              <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl flex justify-between font-bold text-rose-800">
                <span>Pérdida en Dinero:</span>
                <span>{formatCOP(costoTotalMerma)}</span>
              </div>
            </div>

            <div className="mt-5 pt-3 border-t border-slate-200 flex justify-end space-x-2 text-xs">
              <button onClick={onClose} className="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-100 rounded-xl">Cancelar</button>
              <button onClick={handleConfirmar} className="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-sm">Registrar Merma</button>
            </div>
          </div>
        </div>
      );
    }

    // MODAL EDITAR RECETA
    function ModalEditarReceta({ receta, insumos, tarifa_kwh, onGuardar, onClose }) {
      const [nombre, setNombre] = useState(receta?.nombre || '');
      const [porcionesBase, setPorcionesBase] = useState(receta?.porciones_base || 1);
      const [precioVenta, setPrecioVenta] = useState(receta?.precio_venta || 75000);
      const [tiempoMinutos, setTiempoMinutos] = useState(receta?.tiempo_minutos || 90);
      const [cifPorcentaje, setCifPorcentaje] = useState(receta?.cif_porcentaje || 8);
      const [ingredientes, setIngredientes] = useState(receta?.ingredientes || []);
      const [equipos, setEquipos] = useState(receta?.equipos || []);

      const agregarIngrediente = () => {
        setIngredientes([...ingredientes, { insumo_id: insumos[0]?.id || '', cantidad: 100 }]);
      };

      const quitarIngrediente = (idx) => {
        setIngredientes(ingredientes.filter((_, i) => i !== idx));
      };

      const actualizarIngrediente = (idx, campo, valor) => {
        setIngredientes(ingredientes.map((ing, i) => i === idx ? { ...ing, [campo]: valor } : ing));
      };

      const agregarEquipo = () => {
        setEquipos([...equipos, { nombre: 'Horno Eléctrico', potencia_watts: 2000, minutos_uso: 30 }]);
      };

      const quitarEquipo = (idx) => {
        setEquipos(equipos.filter((_, i) => i !== idx));
      };

      const actualizarEquipo = (idx, campo, valor) => {
        setEquipos(equipos.map((eq, i) => i === idx ? { ...eq, [campo]: valor } : eq));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onGuardar({
          id: receta?.id || 'rec_' + Date.now(),
          nombre,
          porciones_base: Number(porcionesBase),
          precio_venta: Number(precioVenta),
          tiempo_minutos: Number(tiempoMinutos),
          cif_porcentaje: Number(cifPorcentaje),
          ingredientes,
          equipos
        });
      };

      return (
        <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[90vh] flex flex-col">
            <div className="flex justify-between items-center pb-3 border-b border-slate-200">
              <h3 className="font-bold text-slate-900 text-lg">{receta ? 'Editar Ficha Técnica' : 'Nueva Receta'}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto mt-4 space-y-4 text-xs pr-1">
              <div>
                <label className="font-bold text-slate-700 block mb-1">Nombre de la Receta:</label>
                <input
                  type="text"
                  required
                  value={nombre}
                  onChange={e => setNombre(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                />
              </div>

              <div className="grid grid-cols-4 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Porciones:</label>
                  <input
                    type="number"
                    value={porcionesBase}
                    onChange={e => setPorcionesBase(Number(e.target.value))}
                    className="w-full px-3 py-2 rounded-xl border border-slate-300"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Tiempo (min):</label>
                  <input
                    type="number"
                    value={tiempoMinutos}
                    onChange={e => setTiempoMinutos(Number(e.target.value))}
                    className="w-full px-3 py-2 rounded-xl border border-slate-300"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">CIF (%):</label>
                  <input
                    type="number"
                    value={cifPorcentaje}
                    onChange={e => setCifPorcentaje(Number(e.target.value))}
                    className="w-full px-3 py-2 rounded-xl border border-slate-300"
                  />
                </div>
                <div>
                  <label className="font-bold text-emerald-700 block mb-1">Precio Venta (COP):</label>
                  <input
                    type="number"
                    step="5000"
                    value={precioVenta}
                    onChange={e => setPrecioVenta(Number(e.target.value))}
                    className="w-full px-3 py-2 rounded-xl border border-emerald-300 font-extrabold text-emerald-800"
                  />
                </div>
              </div>

              <div>
                <div className="flex justify-between items-center mb-2">
                  <h4 className="font-bold text-slate-800">Ingredientes de la Ficha:</h4>
                  <button type="button" onClick={agregarIngrediente} className="text-amber-700 font-bold hover:underline">+ Añadir Ingrediente</button>
                </div>
                <div className="space-y-2">
                  {ingredientes.map((ing, idx) => {
                    const ins = insumos.find(i => i.id === ing.insumo_id);
                    return (
                      <div key={idx} className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                        <select
                          value={ing.insumo_id}
                          onChange={e => actualizarIngrediente(idx, 'insumo_id', e.target.value)}
                          className="flex-1 px-2 py-1.5 rounded-lg border border-slate-300 bg-white"
                        >
                          {insumos.map(i => (
                            <option key={i.id} value={i.id}>{i.nombre} ({i.unidad})</option>
                          ))}
                        </select>
                        <input
                          type="number"
                          value={ing.cantidad}
                          onChange={e => actualizarIngrediente(idx, 'cantidad', Number(e.target.value))}
                          className="w-24 px-2 py-1.5 rounded-lg border border-slate-300 font-bold"
                          placeholder="Cantidad"
                        />
                        <span className="text-slate-500 w-8">{ins?.unidad}</span>
                        <button type="button" onClick={() => quitarIngrediente(idx)} className="text-rose-500 hover:text-rose-700 font-bold px-2">✕</button>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div>
                <div className="flex justify-between items-center mb-2">
                  <h4 className="font-bold text-slate-800">Equipos Eléctricos & Consumo:</h4>
                  <button type="button" onClick={agregarEquipo} className="text-amber-700 font-bold hover:underline">+ Añadir Equipo</button>
                </div>
                <div className="space-y-2">
                  {equipos.map((eq, idx) => (
                    <div key={idx} className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                      <input
                        type="text"
                        value={eq.nombre}
                        onChange={e => actualizarEquipo(idx, 'nombre', e.target.value)}
                        className="flex-1 px-2 py-1.5 rounded-lg border border-slate-300"
                        placeholder="Nombre del equipo"
                      />
                      <input
                        type="number"
                        value={eq.potencia_watts}
                        onChange={e => actualizarEquipo(idx, 'potencia_watts', Number(e.target.value))}
                        className="w-24 px-2 py-1.5 rounded-lg border border-slate-300"
                        placeholder="Watts"
                      />
                      <span className="text-slate-500">W</span>
                      <input
                        type="number"
                        value={eq.minutos_uso}
                        onChange={e => actualizarEquipo(idx, 'minutos_uso', Number(e.target.value))}
                        className="w-20 px-2 py-1.5 rounded-lg border border-slate-300"
                        placeholder="Minutos"
                      />
                      <span className="text-slate-500">min</span>
                      <button type="button" onClick={() => quitarEquipo(idx)} className="text-rose-500 hover:text-rose-700 font-bold px-2">✕</button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="pt-3 border-t border-slate-200 flex justify-end space-x-2">
                <button type="button" onClick={onClose} className="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-100 rounded-xl">Cancelar</button>
                <button type="submit" className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl shadow-sm">Guardar Ficha</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // MODAL AJUSTES & RESPALDO
    function ModalAjustes({ config, setConfig, insumos, recetas, pedidos, mermas, setInsumos, setRecetas, setPedidos, setMermas, onClose }) {
      const [tarifaKwh, setTarifaKwh] = useState(config.tarifa_kwh);

      const handleGuardarConfig = (e) => {
        e.preventDefault();
        setConfig({ ...config, tarifa_kwh: Number(tarifaKwh) });
        alert('Configuración guardada.');
        onClose();
      };

      const handleExportarBackup = () => {
        const data = {
          version: '14.0',
          fecha: new Date().toISOString(),
          insumos,
          recetas,
          pedidos,
          mermas,
          config
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `gastroflow_artisan_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      const handleImportarBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.insumos && data.recetas) {
              setInsumos(data.insumos);
              setRecetas(data.recetas);
              if (data.pedidos) setPedidos(data.pedidos);
              if (data.mermas) setMermas(data.mermas);
              if (data.config) setConfig(data.config);
              alert('¡Copia de seguridad restaurada exitosamente!');
              onClose();
            } else {
              alert('El archivo no tiene el formato válido de GastroFlow.');
            }
          } catch (err) {
            alert('Error al leer el archivo JSON.');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <div className="flex justify-between items-center pb-3 border-b border-slate-200">
              <h3 className="font-bold text-slate-900 text-base">Ajustes & Respaldo</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <form onSubmit={handleGuardarConfig} className="mt-4 space-y-4 text-xs">
              <div>
                <label className="font-bold text-slate-700 block mb-1">Tarifa Energía Eléctrica (COP / kWh):</label>
                <input
                  type="number"
                  value={tarifaKwh}
                  onChange={e => setTarifaKwh(Number(e.target.value))}
                  className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                />
                <p className="text-[11px] text-slate-400 mt-1">Dato de tu factura de energía en Colombia (promedio: $ 800 - $ 950).</p>
              </div>

              <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                <span className="font-bold text-slate-800 block">Copia de Seguridad de tus Datos:</span>
                <p className="text-[11px] text-slate-500">Descarga un archivo con todas tus recetas, pedidos, bodega e historial para no perder nada.</p>
                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    onClick={handleExportarBackup}
                    className="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-1.5 rounded-lg text-xs"
                  >
                    📥 Descargar Copia
                  </button>
                  <label className="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-1.5 rounded-lg text-xs text-center cursor-pointer">
                    📤 Restaurar Copia
                    <input type="file" accept=".json" onChange={handleImportarBackup} className="hidden" />
                  </label>
                </div>
              </div>

              <div className="pt-3 border-t border-slate-200 flex justify-end space-x-2">
                <button type="button" onClick={onClose} className="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-100 rounded-xl">Cerrar</button>
                <button type="submit" className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl shadow-sm">Guardar Ajustes</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // RENDERIZAR EN EL NAVEGADOR
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
