  <!-- React 18, ReactDOM & Babel Standalone via Cloudflare CDNJS -->

      cursor: text !important;

    select, button, input[type="checkbox"], input[type="radio"], input[type="button"], input[type="submit"] {

</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- FORMATEADOR DE MONEDA COLOMBIANA (COP) ---
    const formatCOP = (val) => {
      const num = Math.round(Number(val) || 0);
      return '$ ' + num.toLocaleString('es-CO');
    };

    // --- CARGA SEGURA DE LOCALSTORAGE CON FALLBACK ---
    const safeLoad = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        console.warn(`Error al leer ${key} de localStorage:`, e);
        return fallback;
      }
    };

    // --- DATOS SEMILLA PREDETERMINADOS ---
    const INITIAL_INSUMOS = [
      { id: 'ins_1', nombre: 'Harina de Trigo Repostera', unidad: 'g', stock_actual: 4500, stock_min: 3000, costo_empaque: 6500, gramos_por_empaque: 1000 },
      { id: 'ins_2', nombre: 'Mantequilla sin Sal 82%', unidad: 'g', stock_actual: 850, stock_min: 1500, costo_empaque: 18000, gramos_por_empaque: 500 },
      { id: 'ins_3', nombre: 'Azúcar Blanca Refinada', unidad: 'g', stock_actual: 5000, stock_min: 2000, costo_empaque: 5200, gramos_por_empaque: 1000 },
      { id: 'ins_4', nombre: 'Huevos AA (Unidad)', unidad: 'und', stock_actual: 24, stock_min: 30, costo_empaque: 21000, gramos_por_empaque: 30 },
      { id: 'ins_5', nombre: 'Chocolate de Cobertura 58%', unidad: 'g', stock_actual: 600, stock_min: 1200, costo_empaque: 34000, gramos_por_empaque: 1000 },
      { id: 'ins_6', nombre: 'Crema de Leche 35% MG', unidad: 'g', stock_actual: 1200, stock_min: 1000, costo_empaque: 14500, gramos_por_empaque: 1000 },
      { id: 'ins_7', nombre: 'Caja para Torta 25x25 + Blonda', unidad: 'und', stock_actual: 8, stock_min: 10, costo_empaque: 45000, gramos_por_empaque: 10 }
    ];

    const INITIAL_RECETAS = [
      {
        id: 'rec_1',
        nombre: 'Torta Selva Negra Artesanal (12-15 Porciones)',
        porciones_base: 1,
        precio_venta: 85000,
        tiempo_minutos: 90,
        cif_porcentaje: 8,
        ingredientes: [
          { insumo_id: 'ins_1', cantidad: 350 },
          { insumo_id: 'ins_2', cantidad: 220 },
          { insumo_id: 'ins_3', cantidad: 300 },
          { insumo_id: 'ins_4', cantidad: 5 },
          { insumo_id: 'ins_5', cantidad: 300 },
          { insumo_id: 'ins_6', cantidad: 400 },
          { insumo_id: 'ins_7', cantidad: 1 }
        ],
        equipos: [
          { nombre: 'Horno Eléctrico Convector', potencia_watts: 2400, minutos_uso: 50 },
          { nombre: 'Batidora Planetaria', potencia_watts: 450, minutos_uso: 25 }
        ]
      },
      {
        id: 'rec_2',
        nombre: 'Caja x12 Galletas Red Velvet con Relleno',
        porciones_base: 1,
        precio_venta: 48000,
        tiempo_minutos: 60,
        cif_porcentaje: 6,
        ingredientes: [
          { insumo_id: 'ins_1', cantidad: 280 },
          { insumo_id: 'ins_2', cantidad: 150 },
          { insumo_id: 'ins_3', cantidad: 180 },
          { insumo_id: 'ins_4', cantidad: 2 },
          { insumo_id: 'ins_5', cantidad: 150 },
          { insumo_id: 'ins_7', cantidad: 1 }
        ],
        equipos: [
          { nombre: 'Horno Eléctrico Convector', potencia_watts: 2400, minutos_uso: 20 },
          { nombre: 'Batidora Planetaria', potencia_watts: 450, minutos_uso: 15 }
        ]
      }
    ];

    const hoy = new Date().toISOString().split('T')[0];
    const manana = new Date(Date.now() + 86400000).toISOString().split('T')[0];

    const INITIAL_PEDIDOS = [
      {
        id: 'ped_1',
        cliente_nombre: 'Mariana Gómez Restrepo',
        cliente_telefono: '3124567890',
        receta_id: 'rec_1',
        cantidad: 1,
        fecha_entrega: hoy,
        hora_entrega: '16:00',
        notas: 'Dedicatoria: "Feliz Cumpleaños Mamá". Sin licor.',
        precio_total: 85000,
        abono: 40000,
        estado: 'en_preparacion'
      },
      {
        id: 'ped_2',
        cliente_nombre: 'Carlos E. Duque',
        cliente_telefono: '3007891234',
        receta_id: 'rec_2',
        cantidad: 2,
        fecha_entrega: manana,
        hora_entrega: '11:30',
        notas: 'Empaque para regalo con cinta dorada.',
        precio_total: 96000,
        abono: 50000,
        estado: 'pendiente'
      },
      {
        id: 'ped_3',
        cliente_nombre: 'Laura Morales',
        cliente_telefono: '3109876543',
        receta_id: 'rec_1',
        cantidad: 1,
        fecha_entrega: hoy,
        hora_entrega: '18:30',
        notas: 'Decoración con fresas frescas adicionales.',
        precio_total: 85000,
        abono: 85000,
        estado: 'pendiente'
      }
    ];

    const INITIAL_MERMAS = [
      { id: 'mrm_1', fecha: hoy, insumo_id: 'ins_2', cantidad: 150, motivo: 'Mantequilla sobrecalentada al dorar', costo_total: 5400 }
    ];

    const INITIAL_CONFIG = {
      tarifa_kwh: 850 // COP por kWh en Colombia
    };

    // ==========================================
    // COMPONENTE PRINCIPAL
    // ==========================================
    function App() {
      // Estado Maestro
      const [vista, setVista] = useState('dashboard'); // dashboard, pedidos, cocina, bodega, recetas, historial
      const [insumos, setInsumos] = useState(() => safeLoad('gf_artisan_v14_insumos', INITIAL_INSUMOS));
      const [recetas, setRecetas] = useState(() => safeLoad('gf_artisan_v14_recetas', INITIAL_RECETAS));
      const [pedidos, setPedidos] = useState(() => safeLoad('gf_artisan_v14_pedidos', INITIAL_PEDIDOS));
      const [mermas, setMermas] = useState(() => safeLoad('gf_artisan_v14_mermas', INITIAL_MERMAS));
      const [config, setConfig] = useState(() => safeLoad('gf_artisan_v14_config', INITIAL_CONFIG));

      // Modales Activos
      const [modalAjustes, setModalAjustes] = useState(false);
      const [modalNuevoPedido, setModalNuevoPedido] = useState(false);
      const [modalPaseCocina, setModalPaseCocina] = useState(null);
      const [modalWhatsApp, setModalWhatsApp] = useState(null);
      const [modalEditarInsumo, setModalEditarInsumo] = useState(null);
      const [modalRegistroCompra, setModalRegistroCompra] = useState(null);
      const [modalRegistroMerma, setModalRegistroMerma] = useState(null);
      const [modalEditarReceta, setModalEditarReceta] = useState(null);
      const [popoverNotificaciones, setPopoverNotificaciones] = useState(false);

      // Persistencia Automática
      useEffect(() => { localStorage.setItem('gf_artisan_v14_insumos', JSON.stringify(insumos)); }, [insumos]);
      useEffect(() => { localStorage.setItem('gf_artisan_v14_recetas', JSON.stringify(recetas)); }, [recetas]);
      useEffect(() => { localStorage.setItem('gf_artisan_v14_pedidos', JSON.stringify(pedidos)); }, [pedidos]);
      useEffect(() => { localStorage.setItem('gf_artisan_v14_mermas', JSON.stringify(mermas)); }, [mermas]);
      useEffect(() => { localStorage.setItem('gf_artisan_v14_config', JSON.stringify(config)); }, [config]);

      // --- CÁLCULO DE COSTEO INVERSO Y RETORNO HORARIO ---
      const calcularCostosReceta = (receta, factorEscala = 1) => {
        if (!receta) return { costoInsumos: 0, costoEnergia: 0, costoCIF: 0, costoTotal: 0, remanenteNeto: 0, valorHoraReal: 0 };
        
        let costoInsumos = 0;
        receta.ingredientes.forEach(ing => {
          const ins = insumos.find(i => i.id === ing.insumo_id);
          if (ins && ins.gramos_por_empaque > 0) {
            const costoUnit = ins.costo_empaque / ins.gramos_por_empaque;
            costoInsumos += (ing.cantidad * factorEscala) * costoUnit;
          }
        });

        let costoEnergia = 0;
        if (receta.equipos && Array.isArray(receta.equipos)) {
          receta.equipos.forEach(eq => {
            const horas = (eq.minutos_uso * factorEscala) / 60;
            const kwh = (eq.potencia_watts / 1000) * horas;
            costoEnergia += kwh * config.tarifa_kwh;
          });
        }

        const cifPorc = receta.cif_porcentaje || 0;
        const costoCIF = (costoInsumos + costoEnergia) * (cifPorc / 100);
        const costoTotal = costoInsumos + costoEnergia + costoCIF;

        // Protección matemática inteligente: Si el precio es menor al costo del lote y rinde > 1 porción, es precio unitario
        const porciones = receta.porciones_base || 1;
        let precioLote = receta.precio_venta;
        if (receta.precio_venta < costoTotal && porciones > 1) {
          precioLote = receta.precio_venta * porciones;
        }

        const precioTotalVenta = precioLote * factorEscala;
        const remanenteNeto = precioTotalVenta - costoTotal;
        const horasTrabajo = ((receta.tiempo_minutos || 60) * factorEscala) / 60;
        const valorHoraReal = horasTrabajo > 0 ? (remanenteNeto / horasTrabajo) : 0;

        return {
          costoInsumos,
          costoEnergia,
          costoCIF,
          costoTotal,
          remanenteNeto,
          valorHoraReal,
          horasTrabajo
        };
      };

      // --- CÁLCULO INTELIGENTE DE FALTANTES (COMPROMETIDOS VS BODEGA) ---
      const analisisFaltantes = useMemo(() => {
        const demandaPendientes = {};
        const pedidosAfectadosPorInsumo = {};

        pedidos.filter(p => p.estado === 'pendiente').forEach(ped => {
          const rec = recetas.find(r => r.id === ped.receta_id);
          if (rec) {
            rec.ingredientes.forEach(ing => {
              const cantTotal = ing.cantidad * ped.cantidad;
              demandaPendientes[ing.insumo_id] = (demandaPendientes[ing.insumo_id] || 0) + cantTotal;
              if (!pedidosAfectadosPorInsumo[ing.insumo_id]) pedidosAfectadosPorInsumo[ing.insumo_id] = [];
              pedidosAfectadosPorInsumo[ing.insumo_id].push(ped.cliente_nombre);
            });
          }
        });

        const faltantesCriticos = [];
        const alertasStockMinimo = [];

        insumos.forEach(ins => {
          const requerimiento = demandaPendientes[ins.id] || 0;
          const deficit = requerimiento - ins.stock_actual;

          if (deficit > 0) {
            faltantesCriticos.push({
              insumo: ins,
              requerido: requerimiento,
              stock: ins.stock_actual,
              faltante: deficit,
              clientes: pedidosAfectadosPorInsumo[ins.id] || []
            });
          } else if (ins.stock_actual <= ins.stock_min) {
            alertasStockMinimo.push({
              insumo: ins,
              stock: ins.stock_actual,
              minimo: ins.stock_min
            });
          }
        });

        return { faltantesCriticos, alertasStockMinimo, totalAlertas: faltantesCriticos.length + alertasStockMinimo.length };
      }, [pedidos, recetas, insumos]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* HEADER / NAVBAR FIJO CON NOMBRES ORIGINALES */}
          <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-40 border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              {/* Logo e Isotipo Fijo Definitivo */}
              <div className="flex items-center space-x-3 cursor-pointer flex-shrink-0 min-w-max mr-4" onClick={() => setVista('dashboard')} title="Ir al Dashboard">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 font-bold text-xl shadow-md flex-shrink-0">
                  🥐
                </div>
                <div className="flex flex-col">
                  <h1 className="font-extrabold text-xl tracking-tight text-white leading-none flex items-center gap-1.5 whitespace-nowrap">
                    <span>GastroFlow</span>
                    <span className="text-amber-400 font-serif italic font-normal text-lg">Artisan</span>
                  </h1>
                  <span className="text-[11px] font-medium text-amber-200/70 tracking-wide uppercase mt-0.5 whitespace-nowrap">
                    Pastelería & Taller de Cocina
                  </span>
                </div>
              </div>

              {/* Menú de Navegación con NOMBRES EXACTOS APROBADOS */}
              <nav className="hidden md:flex items-center space-x-1">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                  { id: 'pedidos', label: 'Libreta de Encargos', icon: '📋' },
                  { id: 'cocina', label: 'Preparación y Cocina', icon: '👨‍🍳' },
                  { id: 'bodega', label: 'Bodega de Insumos', icon: '📦' },
                  { id: 'recetas', label: 'Recetario y Costeo', icon: '📖' },
                  { id: 'historial', label: 'Auditoría e Historial', icon: '📑' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setVista(item.id)}
                    className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center space-x-1.5 ${
                      vista === item.id 
                        ? 'bg-amber-500 text-slate-950 font-semibold shadow-sm' 
                        : 'text-slate-300 hover:text-white hover:bg-slate-800'
                    }`}
                  >
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>

              {/* Botones de Notificación y Ajustes */}
              <div className="flex items-center space-x-3">
                <div className="relative">
                  <button
                    onClick={() => setPopoverNotificaciones(!popoverNotificaciones)}
                    className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 relative transition-colors"
                    title="Centro de Alertas & Faltantes"
                  >
                    <span className="text-lg">🔔</span>
                    {analisisFaltantes.totalAlertas > 0 && (
                      <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center animate-pulse">
                        {analisisFaltantes.totalAlertas}
                      </span>
                    )}
                  </button>

                  {/* Popover de Notificaciones */}
                  {popoverNotificaciones && (
                    <div className="absolute right-0 mt-2 w-80 sm:w-96 bg-white rounded-xl shadow-2xl border border-slate-200 z-50 text-slate-800 p-4">
                      <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                        <h3 className="font-bold text-sm text-slate-900 flex items-center space-x-1.5">
                          <span>🔔</span>
                          <span>Centro de Alertas de Bodega</span>
                        </h3>
                        <button onClick={() => setPopoverNotificaciones(false)} className="text-slate-400 hover:text-slate-600 text-sm">✕</button>
                      </div>

                      <div className="max-h-80 overflow-y-auto mt-2 space-y-3">
                        {analisisFaltantes.faltantesCriticos.length > 0 && (
                          <div>
                            <div className="text-xs font-bold text-rose-700 uppercase tracking-wider mb-1 flex items-center space-x-1">
                              <span>🚨</span>
                              <span>Faltante para Encargos Pendientes</span>
                            </div>
                            <div className="space-y-1.5">
                              {analisisFaltantes.faltantesCriticos.map(item => (
                                <div key={item.insumo.id} className="p-2 bg-rose-50 border border-rose-200 rounded-lg text-xs">
                                  <div className="flex justify-between font-bold text-rose-900">
                                    <span>{item.insumo.nombre}</span>
                                    <span>Faltan {item.faltante} {item.insumo.unidad}</span>
                                  </div>
                                  <p className="text-rose-700 text-[11px] mt-0.5">
                                    Requerido para: {item.clientes.slice(0, 2).join(', ')}{item.clientes.length > 2 ? ` y +${item.clientes.length - 2}` : ''}
                                  </p>
                                  <button
                                    onClick={() => {
                                      setModalRegistroCompra(item.insumo);
                                      setPopoverNotificaciones(false);
                                    }}
                                    className="mt-1.5 w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-1 px-2 rounded text-[11px] transition-colors"
                                  >
                                    + Comprar en Bodega
                                  </button>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}

                        {analisisFaltantes.alertasStockMinimo.length > 0 && (
                          <div>
                            <div className="text-xs font-bold text-amber-700 uppercase tracking-wider mb-1 flex items-center space-x-1">
                              <span>⚠️</span>
                              <span>Reserva de Seguridad Baja</span>
                            </div>
                            <div className="space-y-1.5">
                              {analisisFaltantes.alertasStockMinimo.map(item => (
                                <div key={item.insumo.id} className="p-2 bg-amber-50 border border-amber-200 rounded-lg text-xs flex items-center justify-between">
                                  <div>
                                    <div className="font-semibold text-amber-900">{item.insumo.nombre}</div>
                                    <div className="text-[11px] text-amber-700">Stock: {item.stock} / Mín: {item.minimo} {item.insumo.unidad}</div>
                                  </div>
                                  <button
                                    onClick={() => {
                                      setModalRegistroCompra(item.insumo);
                                      setPopoverNotificaciones(false);
                                    }}
                                    className="bg-amber-600 hover:bg-amber-700 text-white font-medium py-1 px-2 rounded text-[11px]"
                                  >
                                    Surtir
                                  </button>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}

                        {analisisFaltantes.totalAlertas === 0 && (
                          <div className="text-center py-6 text-slate-400 text-xs">
                            <span className="text-2xl block mb-1">🎉</span>
                            ¡Inventario en regla! No hay faltantes para tus pedidos pendientes.
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>

                <button
                  onClick={() => setModalAjustes(true)}
                  className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors"
                  title="Configuración & Copias de Seguridad"
                >
                  ⚙️
                </button>
              </div>
            </div>

            {/* Menú Móvil */}
            <div className="md:hidden flex overflow-x-auto px-2 py-1.5 bg-slate-950 border-t border-slate-800 space-x-1 text-xs">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                { id: 'pedidos', label: 'Libreta de Encargos', icon: '📋' },
                { id: 'cocina', label: 'Preparación y Cocina', icon: '👨‍🍳' },
                { id: 'bodega', label: 'Bodega de Insumos', icon: '📦' },
                { id: 'recetas', label: 'Recetario y Costeo', icon: '📖' },
                { id: 'historial', label: 'Auditoría e Historial', icon: '📑' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setVista(item.id)}
                  className={`px-3 py-1.5 rounded whitespace-nowrap ${vista === item.id ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-300'}`}
                >
                  {item.icon} {item.label}
                </button>
              ))}
            </div>
          </header>

          {/* CUERPO PRINCIPAL DINÁMICO */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {vista === 'dashboard' && (
              <DashboardView
                pedidos={pedidos}
                setPedidos={setPedidos}
                recetas={recetas}
                insumos={insumos}
                mermas={mermas}
                calcularCostosReceta={calcularCostosReceta}
                setModalNuevoPedido={setModalNuevoPedido}
                setModalWhatsApp={setModalWhatsApp}
                setVista={setVista}
              />
            )}

            {vista === 'pedidos' && (
              <PedidosView
                pedidos={pedidos}
                setPedidos={setPedidos}
                recetas={recetas}
                insumos={insumos}
                setModalNuevoPedido={setModalNuevoPedido}
                setModalPaseCocina={setModalPaseCocina}
                setModalWhatsApp={setModalWhatsApp}
                setVista={setVista}
              />
            )}

            {vista === 'cocina' && (
              <CocinaView
                pedidos={pedidos}
                setPedidos={setPedidos}
                recetas={recetas}
                insumos={insumos}
                setInsumos={setInsumos}
                onIrABodega={(insumo) => {
                  setModalRegistroCompra(insumo);
                }}
              />
            )}

            {vista === 'bodega' && (
              <BodegaView
                insumos={insumos}
                setInsumos={setInsumos}
                setModalEditarInsumo={setModalEditarInsumo}
                setModalRegistroCompra={setModalRegistroCompra}
                setModalRegistroMerma={setModalRegistroMerma}
              />
            )}

            {vista === 'recetas' && (
              <RecetarioView
                recetas={recetas}
                setRecetas={setRecetas}
                insumos={insumos}
                calcularCostosReceta={calcularCostosReceta}
                setModalEditarReceta={setModalEditarReceta}
              />
            )}

            {vista === 'historial' && (
              <HistorialView
                pedidos={pedidos}
                mermas={mermas}
                insumos={insumos}
                recetas={recetas}
              />
            )}
          </main>

          {/* MODALES DEL SISTEMA */}
          {modalAjustes && (
            <ModalAjustes
              config={config}
              setConfig={setConfig}
              insumos={insumos}
              recetas={recetas}
              pedidos={pedidos}
              mermas={mermas}
              setInsumos={setInsumos}
              setRecetas={setRecetas}
              setPedidos={setPedidos}
              setMermas={setMermas}
              onClose={() => setModalAjustes(false)}
            />
          )}

          {modalNuevoPedido && (
            <ModalNuevoPedido
              recetas={recetas}
              onGuardar={(nuevo) => {
                setPedidos([nuevo, ...pedidos]);
                setModalNuevoPedido(false);
              }}
              onClose={() => setModalNuevoPedido(false)}
            />
          )}

          {modalPaseCocina && (
            <ModalPaseCocina
              pedido={modalPaseCocina}
              recetas={recetas}
              insumos={insumos}
              onConfirmar={() => {
                const receta = recetas.find(r => r.id === modalPaseCocina.receta_id);
                if (receta) {
                  const nuevosInsumos = insumos.map(ins => {
                    const ing = receta.ingredientes.find(i => i.insumo_id === ins.id);
                    if (ing) {
                      const desc = ing.cantidad * modalPaseCocina.cantidad;
                      return { ...ins, stock_actual: Math.max(0, ins.stock_actual - desc) };
                    }
                    return ins;
                  });
                  setInsumos(nuevosInsumos);
                }

                setPedidos(pedidos.map(p => p.id === modalPaseCocina.id ? { ...p, estado: 'en_preparacion' } : p));
                setModalPaseCocina(null);
              }}
              onClose={() => setModalPaseCocina(null)}
              onIrABodega={(insumo) => {
                setModalPaseCocina(null);
                setModalRegistroCompra(insumo);
              }}
            />
          )}

          {modalWhatsApp && (
            <ModalWhatsApp
              pedido={modalWhatsApp}
              recetas={recetas}
              onClose={() => setModalWhatsApp(null)}
            />
          )}

          {modalEditarInsumo && (
            <ModalEditarInsumo
              insumo={modalEditarInsumo === 'nuevo' ? null : modalEditarInsumo}
              onGuardar={(insumoGuardado) => {
                if (modalEditarInsumo === 'nuevo') {
                  setInsumos([...insumos, insumoGuardado]);
                } else {
                  setInsumos(insumos.map(i => i.id === insumoGuardado.id ? insumoGuardado : i));
                }
                setModalEditarInsumo(null);
              }}
              onClose={() => setModalEditarInsumo(null)}
            />
          )}

          {modalRegistroCompra && (
            <ModalRegistroCompra
              insumo={modalRegistroCompra}
              onGuardar={(insumoActualizado) => {
                setInsumos(insumos.map(i => i.id === insumoActualizado.id ? insumoActualizado : i));
                setModalRegistroCompra(null);
              }}
              onClose={() => setModalRegistroCompra(null)}
            />
          )}

          {modalRegistroMerma && (
            <ModalRegistroMerma
              insumo={modalRegistroMerma}
              onGuardar={(mermaObj, insumoActualizado) => {
                setMermas([mermaObj, ...mermas]);
                setInsumos(insumos.map(i => i.id === insumoActualizado.id ? insumoActualizado : i));
                setModalRegistroMerma(null);
              }}
              onClose={() => setModalRegistroMerma(null)}
            />
          )}

          {modalEditarReceta && (
            <ModalEditarReceta
              receta={modalEditarReceta === 'nuevo' ? null : modalEditarReceta}
              insumos={insumos}
              tarifa_kwh={config.tarifa_kwh}
              onGuardar={(recetaGuardada) => {
                if (modalEditarReceta === 'nuevo') {
                  setRecetas([...recetas, recetaGuardada]);
                } else {
                  setRecetas(recetas.map(r => r.id === recetaGuardada.id ? recetaGuardada : r));
                }
                setModalEditarReceta(null);
              }}
              onClose={() => setModalEditarReceta(null)}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // 1. DASHBOARD
    // ==========================================
    function DashboardView({
      pedidos,
      setPedidos,
      recetas,
      insumos,
      mermas = [],
      calcularCostosReceta,
      setModalNuevoPedido,
      setModalWhatsApp,
      setVista
    }) {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const [periodo, setPeriodo] = useState('historico'); // 'hoy', 'semana', 'mes', 'ano', 'historico'
      const [tipoGrafico, setTipoGrafico] = useState('crecimiento'); // 'crecimiento' | 'ventas_producto' | 'ingresos_ganancia'
      const [metricaProducto, setMetricaProducto] = useState('unidades'); // 'unidades' | 'dinero'
      const [filtroAgendaHoy, setFiltroAgendaHoy] = useState('pendientes'); // 'pendientes' | 'entregados' | 'todos'

      const metricas = useMemo(() => {
        const pedidosActivos = pedidos.filter(p => p.estado === 'pendiente' || p.estado === 'en_preparacion');
        const totalEncargosCOP = pedidosActivos.reduce((sum, p) => sum + p.precio_total, 0);
        const conteoActivos = pedidosActivos.length;

        const saldoPorCobrar = pedidos.filter(p => p.estado !== 'cancelado').reduce((sum, p) => sum + Math.max(0, p.precio_total - p.abono), 0);

        const valorBodega = insumos.reduce((sum, ins) => {
          const unit = ins.gramos_por_empaque > 0 ? (ins.costo_empaque / ins.gramos_por_empaque) : 0;
          return sum + (ins.stock_actual * unit);
        }, 0);

        const totalMermasCOP = (mermas || []).reduce((sum, m) => sum + (m.costo_total || 0), 0);

        return { totalEncargosCOP, conteoActivos, saldoPorCobrar, valorBodega, totalMermasCOP };
      }, [pedidos, insumos, mermas]);

      const hoyStr = new Date().toISOString().split('T')[0];

      // Fecha de mañana en formato YYYY-MM-DD
      const mananaStr = useMemo(() => {
        const m = new Date();
        m.setDate(m.getDate() + 1);
        return m.toISOString().split('T')[0];
      }, []);

      // Todos los pedidos programados para hoy (no cancelados)
      const pedidosHoyTodos = useMemo(() => {
        return pedidos.filter(p => p.fecha_entrega === hoyStr && p.estado !== 'cancelado');
      }, [pedidos, hoyStr]);

      // Pedidos de hoy que faltan por entregar (pendientes o en cocina)
      const pedidosHoyPorEntregar = useMemo(() => {
        return pedidosHoyTodos.filter(p => p.estado !== 'entregado');
      }, [pedidosHoyTodos]);

      // Pedidos de hoy que ya fueron entregados
      const pedidosHoyEntregados = useMemo(() => {
        return pedidosHoyTodos.filter(p => p.estado === 'entregado');
      }, [pedidosHoyTodos]);

      // Lista a mostrar en la Agenda de Hoy según pestaña
      const pedidosHoyAMostrar = useMemo(() => {
        if (filtroAgendaHoy === 'pendientes') return pedidosHoyPorEntregar;
        if (filtroAgendaHoy === 'entregados') return pedidosHoyEntregados;
        return pedidosHoyTodos;
      }, [filtroAgendaHoy, pedidosHoyPorEntregar, pedidosHoyEntregados, pedidosHoyTodos]);

      // SISTEMA ANTI-OLVIDOS:
      // 1. Pedidos para HOY que siguen 'pendiente' (¡aún no se han horneado!)
      const pedidosHoySinHornear = useMemo(() => {
        return pedidosHoyTodos.filter(p => p.estado === 'pendiente');
      }, [pedidosHoyTodos]);

      // 2. Pedidos programados para MAÑANA
      const pedidosManana = useMemo(() => {
        return pedidos.filter(p => p.fecha_entrega === mananaStr && p.estado !== 'cancelado');
      }, [pedidos, mananaStr]);

      // Entregar pedido directamente desde la Agenda de Hoy
      const handleEntregarDesdeAgenda = (id) => {
        const ped = pedidos.find(p => p.id === id);
        if (!ped) return;
        const saldo = Math.max(0, ped.precio_total - ped.abono);
        if (saldo > 0) {
          if (!confirm(`Este encargo de ${ped.cliente_nombre} tiene un saldo pendiente de ${formatCOP(saldo)}. ¿Confirmas entrega y recaudo total?`)) return;
        }
        if (setPedidos) {
          setPedidos(pedidos.map(p => p.id === id ? { ...p, estado: 'entregado', abono: p.precio_total } : p));
        }
      };

      // Filtrar pedidos por periodo seleccionado para la gráfica y estadísticas
      const pedidosEnPeriodo = useMemo(() => {
        const ahora = new Date();
        const hoyIso = ahora.toISOString().split('T')[0];

        return pedidos.filter(p => {
          if (p.estado === 'cancelado') return false;
          if (periodo === 'historico') return true;
          if (!p.fecha_entrega) return true;

          const fEnt = new Date(p.fecha_entrega + 'T12:00:00');
          if (periodo === 'hoy') {
            return p.fecha_entrega === hoyIso;
          }
          if (periodo === 'semana') {
            const diffDias = (ahora.getTime() - fEnt.getTime()) / (1000 * 60 * 60 * 24);
            return diffDias >= -1 && diffDias <= 7;
          }
          if (periodo === 'mes') {
            return fEnt.getMonth() === ahora.getMonth() && fEnt.getFullYear() === ahora.getFullYear();
          }
          if (periodo === 'ano') {
            return fEnt.getFullYear() === ahora.getFullYear();
          }
          return true;
        });
      }, [pedidos, periodo]);

      // Cálculo del Producto Estrella (el más vendido)
      const productoEstrella = useMemo(() => {
        const pool = pedidosEnPeriodo.length > 0 ? pedidosEnPeriodo : pedidos.filter(p => p.estado !== 'cancelado');
        const conteo = {};
        const dinero = {};

        pool.forEach(p => {
          conteo[p.receta_id] = (conteo[p.receta_id] || 0) + p.cantidad;
          dinero[p.receta_id] = (dinero[p.receta_id] || 0) + p.precio_total;
        });

        let topId = null;
        let maxUnidades = -1;
        Object.keys(conteo).forEach(rId => {
          if (conteo[rId] > maxUnidades) {
            maxUnidades = conteo[rId];
            topId = rId;
          }
        });

        if (!topId || maxUnidades <= 0) return null;
        const receta = recetas.find(r => r.id === topId);
        if (!receta) return null;

        const totalGeneral = pool.reduce((sum, p) => sum + p.precio_total, 0);
        const totalCOP = dinero[topId] || 0;
        const porcentaje = totalGeneral > 0 ? Math.round((totalCOP / totalGeneral) * 100) : 0;

        return {
          receta,
          unidades: maxUnidades,
          totalCOP,
          porcentaje
        };
      }, [pedidosEnPeriodo, pedidos, recetas]);

      // Gráfica dinámica y responsiva manteniendo h-[280px]
      useEffect(() => {
        if (typeof Chart !== 'undefined' && chartRef.current) {
          if (chartInstance.current) chartInstance.current.destroy();

          const ctx = chartRef.current.getContext('2d');

          if (tipoGrafico === 'crecimiento') {
            const ingresosPorFecha = {};
            pedidosEnPeriodo.forEach(p => {
              const f = p.fecha_entrega || 'Sin fecha';
              ingresosPorFecha[f] = (ingresosPorFecha[f] || 0) + p.precio_total;
            });

            let fechasOrdenadas = Object.keys(ingresosPorFecha).sort();
            if (fechasOrdenadas.length === 0) {
              fechasOrdenadas = [hoyStr];
              ingresosPorFecha[hoyStr] = 0;
            }

            const labels = fechasOrdenadas.map(f => {
              const partes = f.split('-');
              if (partes.length === 3) return partes[2] + '/' + partes[1];
              return f;
            });
            const dataPuntos = fechasOrdenadas.map(f => ingresosPorFecha[f]);

            chartInstance.current = new Chart(ctx, {
              type: 'line',
              data: {
                labels,
                datasets: [
                  {
                    label: 'Ingresos por Fecha',
                    data: dataPuntos,
                    borderColor: '#f59e0b',
                    backgroundColor: 'rgba(245, 158, 11, 0.15)',
                    fill: true,
                    tension: 0.35,
                    pointBackgroundColor: '#b45309',
                    pointBorderColor: '#ffffff',
                    pointBorderWidth: 2,
                    pointRadius: 5,
                    pointHoverRadius: 7
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { display: false },
                  tooltip: {
                    callbacks: {
                      title: (context) => `Fecha: ${fechasOrdenadas[context[0].dataIndex]}`,
                      label: (context) => `Ingreso: ${formatCOP(context.raw)}`
                    }
                  }
                },
                scales: {
                  y: {
                    beginAtZero: true,
                    ticks: {
                      callback: (val) => '$ ' + (val >= 1000 ? (val / 1000) + 'k' : val)
                    }
                  }
                }
              }
            });
          } else if (tipoGrafico === 'ventas_producto') {
            const ventasPorReceta = {};
            const unidadesPorReceta = {};
            recetas.forEach(r => {
              ventasPorReceta[r.id] = 0;
              unidadesPorReceta[r.id] = 0;
            });

            pedidosEnPeriodo.forEach(p => {
              if (ventasPorReceta[p.receta_id] !== undefined) {
                ventasPorReceta[p.receta_id] += p.precio_total;
                unidadesPorReceta[p.receta_id] += p.cantidad;
              }
            });

            const labels = recetas.map(r => r.nombre.split(' (')[0].substring(0, 16));
            const dataVentas = recetas.map(r => Math.round(ventasPorReceta[r.id] || 0));
            const dataUnidades = recetas.map(r => unidadesPorReceta[r.id] || 0);
            const esUnidades = metricaProducto === 'unidades';

            chartInstance.current = new Chart(ctx, {
              type: 'bar',
              data: {
                labels,
                datasets: [
                  {
                    label: esUnidades ? 'Unidades Horneadas' : 'Ventas en COP',
                    data: esUnidades ? dataUnidades : dataVentas,
                    backgroundColor: esUnidades ? '#6366f1' : '#f59e0b',
                    borderRadius: 8,
                    maxBarThickness: 45
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { display: false },
                  tooltip: {
                    callbacks: {
                      label: (context) => {
                        const idx = context.dataIndex;
                        if (esUnidades) {
                          const val = context.raw;
                          const cop = formatCOP(dataVentas[idx]);
                          return `${val} unidad${val === 1 ? '' : 'es'} (${cop})`;
                        } else {
                          const unids = dataUnidades[idx];
                          return `Ventas: ${formatCOP(context.raw)} (${unids} unid${unids === 1 ? '' : 'es'})`;
                        }
                      }
                    }
                  }
                },
                scales: {
                  y: {
                    beginAtZero: true,
                    ticks: {
                      callback: (val) => {
                        if (esUnidades) return val + ' und';
                        return '$ ' + (val >= 1000 ? (val / 1000) + 'k' : val);
                      }
                    }
                  }
                }
              }
            });
          } else {
            const labels = recetas.map(r => r.nombre.split(' (')[0].substring(0, 16));
            const ingresos = [];
            const ganancias = [];

            recetas.forEach(r => {
              const peds = pedidosEnPeriodo.filter(p => p.receta_id === r.id);
              const totalVenta = peds.reduce((sum, p) => sum + p.precio_total, 0);
              const cantTotal = peds.reduce((sum, p) => sum + p.cantidad, 0);

              const costoUnitario = calcularCostosReceta(r, 1).costoTotal;
              const costoTotalProd = costoUnitario * cantTotal;
              const gananciaLimpia = Math.max(0, totalVenta - costoTotalProd);

              ingresos.push(Math.round(totalVenta));
              ganancias.push(Math.round(gananciaLimpia));
            });

            chartInstance.current = new Chart(ctx, {
              type: 'bar',
              data: {
                labels,
                datasets: [
                  {
                    label: 'Dinero Total',
                    data: ingresos,
                    backgroundColor: '#3b82f6',
                    borderRadius: 6,
                    maxBarThickness: 32
                  },
                  {
                    label: 'Ganancia Limpia',
                    data: ganancias,
                    backgroundColor: '#10b981',
                    borderRadius: 6,
                    maxBarThickness: 32
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  tooltip: {
                    callbacks: {
                      label: (context) => `${context.dataset.label}: ${formatCOP(context.raw)}`
                    }
                  }
                },
                scales: {
                  y: {
                    beginAtZero: true,
                    ticks: {
                      callback: (val) => '$ ' + (val >= 1000 ? (val / 1000) + 'k' : val)
                    }
                  }
                }
              }
            });
          }
        }
        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [recetas, insumos, pedidosEnPeriodo, tipoGrafico, metricaProducto]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Panel Financiero & Agenda en Vivo</h2>
              <p className="text-sm text-slate-500 mt-1">Control integral de entregas de hoy, margen real y radar operativo del taller.</p>
            </div>
            <button
              onClick={() => setModalNuevoPedido(true)}
              className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl shadow-sm transition-colors flex items-center space-x-2 text-sm"
            >
              <span>➕</span>
              <span>Nuevo Encargo</span>
            </button>
          </div>

          {/* 4 TARJETAS KPI PRINCIPALES */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Encargos</span>
              <div className="text-2xl font-extrabold text-slate-900 mt-1">{formatCOP(metricas.totalEncargosCOP)}</div>
              <div className="text-xs text-amber-700 mt-2 font-medium flex items-center space-x-1">
                <span>📋</span>
                <span>{metricas.conteoActivos} {metricas.conteoActivos === 1 ? 'encargo activo' : 'encargos activos'} en agenda</span>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Saldo por Cobrar</span>
              <div className="text-2xl font-extrabold text-blue-600 mt-1">{formatCOP(metricas.saldoPorCobrar)}</div>
              <div className="text-xs text-blue-700 mt-2 font-medium flex items-center space-x-1">
                <span>💵</span>
                <span>Dinero en calle por recaudar</span>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Valor de Bodega</span>
              <div className="text-2xl font-extrabold text-emerald-600 mt-1">{formatCOP(metricas.valorBodega)}</div>
              <div className="text-xs text-emerald-700 mt-2 font-medium flex items-center space-x-1">
                <span>📦</span>
                <span>Inversión física en estantería</span>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Pérdidas por Merma</span>
              <div className="text-2xl font-extrabold text-rose-600 mt-1">{formatCOP(metricas.totalMermasCOP)}</div>
              <div className="text-xs text-rose-700 mt-2 font-medium flex items-center space-x-1">
                <span>📉</span>
                <span>Dinero perdido acumulado</span>
              </div>
            </div>
          </div>

          {/* ESCUDO ANTI-OLVIDOS: ALERTAS OPERATIVAS DEL TALLER */}
          {(pedidosHoySinHornear.length > 0 || pedidosManana.length > 0) && (
            <div className="space-y-3">
              {/* Alerta 1: Entregas de HOY que todavía NO se han horneado */}
              {pedidosHoySinHornear.length > 0 && (
                <div className="bg-rose-50 border-2 border-rose-300 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-xs">
                  <div className="flex items-start sm:items-center space-x-3.5">
                    <div className="w-11 h-11 rounded-xl bg-rose-600 text-white flex items-center justify-center text-xl flex-shrink-0 shadow-sm">
                      🚨
                    </div>
                    <div>
                      <div className="flex items-center space-x-2">
                        <span className="text-xs font-extrabold uppercase tracking-wider bg-rose-200 text-rose-900 px-2.5 py-0.5 rounded-full">
                          ¡Alerta Crítica de Cocina!
                        </span>
                        <span className="text-xs text-rose-700 font-bold">Entrega HOY</span>
                      </div>
                      <h4 className="text-sm font-bold text-slate-900 mt-1">
                        Tienes {pedidosHoySinHornear.length} encargo{pedidosHoySinHornear.length === 1 ? '' : 's'} agendado{pedidosHoySinHornear.length === 1 ? '' : 's'} para entregar HOY que aún están SIN HORNEAR.
                      </h4>
                      <p className="text-xs text-slate-600">
                        {pedidosHoySinHornear.map(p => `${p.cliente_nombre} (${p.hora_entrega || 'Sin hora'})`).join(' • ')}
                      </p>
                    </div>
                  </div>
                  {setVista && (
                    <button
                      type="button"
                      onClick={() => setVista('cocina')}
                      className="self-start sm:self-center bg-rose-600 hover:bg-rose-700 text-white font-extrabold px-4 py-2 rounded-xl text-xs shadow transition-colors flex items-center space-x-1.5 whitespace-nowrap"
                    >
                      <span>👨‍🍳</span>
                      <span>Ir a Hornear Ahora</span>
                    </button>
                  )}
                </div>
              )}

              {/* Alerta 2: Radar del Día de Mañana (Para dejar preparaciones adelantadas hoy) */}
              {pedidosManana.length > 0 && (
                <div className="bg-amber-50/80 border border-amber-300 rounded-2xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div className="flex items-center space-x-3">
                    <span className="text-2xl">👀</span>
                    <div>
                      <span className="text-[11px] font-bold text-amber-900 uppercase tracking-wider block">
                        Radar de Mañana ({mananaStr})
                      </span>
                      <p className="text-xs text-slate-700">
