                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          {rec.ingredientes.map(ing => {
                            const ins = insumos.find(i => i.id === ing.insumo_id);
                            const cant = ing.cantidad * factor;
                            const costoIng = ins && ins.gramos_por_empaque > 0 ? (cant * (ins.costo_empaque / ins.gramos_por_empaque)) : 0;

                            return (
                              <div key={ing.insumo_id} className="p-2.5 bg-white rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                                <span className="font-semibold text-slate-800">{ins?.nombre}</span>
                                <div className="text-right">
                                  <span className="font-bold text-slate-900 block">{cant} {ins?.unidad}</span>
                                  <span className="text-[10px] text-slate-400">{formatCOP(costoIng)}</span>
                                </div>
                              </div>
                            );
                          })}
                        </div>

                        {rec.equipos && rec.equipos.length > 0 && (
                          <div>
                            <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Equipos eléctricos (Horno & Batidora):</h4>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                              {rec.equipos.map((eq, idx) => (
                                <div key={idx} className="p-2 bg-amber-50/60 border border-amber-200/60 rounded-xl flex justify-between">
                                  <span className="text-slate-700">⚡ {eq.nombre} ({eq.potencia_watts}W)</span>
                                  <span className="font-bold text-amber-900">{eq.minutos_uso * factor} min</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-4 flex flex-col justify-between shadow-sm">
                        <div>
                          <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider">Costeo & Retorno Real</h4>
                          
                          <div className="mt-3 space-y-1.5 text-xs text-slate-600 border-b border-slate-200 pb-3">
                            <div className="flex justify-between">
                              <span>Insumos y empaques:</span>
                              <span className="font-semibold text-slate-800">{formatCOP(costos.costoInsumos)}</span>
                            </div>
                            <div className="flex justify-between">
                              <span>Energía Eléctrica (kWh):</span>
                              <span className="font-semibold text-slate-800">{formatCOP(costos.costoEnergia)}</span>
                            </div>
                            <div className="flex justify-between">
                              <span>CIF / Gastos Menores:</span>
                              <span className="font-semibold text-slate-800">{formatCOP(costos.costoCIF)}</span>
                            </div>
                            <div className="flex justify-between font-bold text-slate-900 pt-1 text-sm">
                              <span>Costo Duro Total:</span>
                              <span className="text-amber-700">{formatCOP(costos.costoTotal)}</span>
                            </div>
                          </div>

                          <div className="mt-3 p-3 bg-emerald-50 rounded-xl border border-emerald-200">
                            <span className="text-[11px] font-bold text-emerald-800 uppercase block">⏱️ Pago Real por tu Hora:</span>
                            <div className="text-xl font-extrabold text-emerald-600 mt-0.5">
                              {formatCOP(costos.valorHoraReal)} <span className="text-xs font-normal text-slate-500">/ hora</span>
                            </div>
                            <p className="text-[11px] text-slate-500 mt-1">
                              Remanente neto de {formatCOP(costos.remanenteNeto)} tras {costos.horasTrabajo.toFixed(1)}h de trabajo.
                            </p>
                          </div>
                        </div>

                        {/* SIMULADOR PLEGADO (NO INVASIVO) */}
                        <div className="pt-2 border-t border-slate-100">
                          <button
                            type="button"
                            onClick={() => toggleSimulador(rec.id)}
                            className="w-full text-center text-xs font-bold text-amber-800 bg-amber-50 hover:bg-amber-100 border border-amber-200 py-2 rounded-xl transition-colors flex items-center justify-center space-x-1"
                          >
                            <span>💡</span>
                            <span>{simAbierto ? 'Ocultar Simulador de Meta' : 'Simular Meta Horaria'}</span>
                          </button>

                          {simAbierto && (
                            <div className="mt-3 p-3 bg-amber-50/70 border border-amber-200 rounded-xl text-xs space-y-2">
                              <div className="flex items-center space-x-2">
                                <label className="text-[11px] text-amber-800 whitespace-nowrap">Meta deseada/h:</label>
                                <input
                                  type="number"
                                  step="1000"
                                  value={metaActual}
                                  onChange={e => setMetaHoraria({ ...metaHoraria, [rec.id]: Number(e.target.value) })}
                                  className="w-full px-2 py-1 bg-white border border-amber-300 rounded text-xs font-bold text-slate-800"
                                />
                              </div>
                              <div className="text-[11px] text-slate-600">
                                Para ganar esa meta, deberías vender este producto a: <strong className="text-slate-900">{formatCOP(precioVentaSugerido)}</strong> ({diferenciaPrecio >= 0 ? `+${formatCOP(diferenciaPrecio)}` : formatCOP(diferenciaPrecio)}).
                              </div>
                              {diferenciaPrecio !== 0 && (
                                <button
                                  onClick={() => handleAplicarPrecioSugerido(rec, precioVentaSugerido)}

                                >
                                  Actualizar Precio de Venta a este Valor
                                </button>
                              )}
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. AUDITORÍA E HISTORIAL (CON FIDELIDAD DE CLIENTES)
    // ==========================================
    function HistorialView({ pedidos, mermas, insumos, recetas }) {
      const [pestana, setPestana] = useState('fidelidad');
      const [clienteDetalle, setClienteDetalle] = useState(null);

      const clientesFidelidad = useMemo(() => {
        const mapa = {};

        pedidos.forEach(p => {
          const key = p.cliente_nombre.trim();
          if (!mapa[key]) {
            mapa[key] = {
              nombre: key,
              telefono: p.cliente_telefono,
              pedidos: [],
              totalFacturado: 0,
              completados: 0,
              cancelados: 0,
              activos: 0,
              ultimaFecha: p.fecha_entrega
            };
          }

          mapa[key].pedidos.push(p);
          if (p.estado !== 'cancelado') {
            mapa[key].totalFacturado += p.precio_total;
          }
          if (p.estado === 'entregado') mapa[key].completados++;
          else if (p.estado === 'cancelado') mapa[key].cancelados++;
          else mapa[key].activos++;

          if (p.fecha_entrega > mapa[key].ultimaFecha) {
            mapa[key].ultimaFecha = p.fecha_entrega;
          }
        });

        const lista = Object.values(mapa);
        lista.sort((a, b) => b.totalFacturado - a.totalFacturado);
        return lista;
      }, [pedidos]);

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Auditoría e Historial</h2>
              <p className="text-sm text-slate-500 mt-1">Fidelidad de clientes (LTV), registro histórico de mermas y pedidos pasados.</p>
            </div>

            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
              <button
                onClick={() => setPestana('fidelidad')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${
                  pestana === 'fidelidad' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                👥 Fidelidad de Clientes
              </button>
              <button
                onClick={() => setPestana('pedidos_pasados')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${
                  pestana === 'pedidos_pasados' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                📜 Archivo de Encargos
              </button>
              <button
                onClick={() => setPestana('mermas')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${
                  pestana === 'mermas' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                📉 Mermas & Pérdidas
              </button>
            </div>
          </div>

          {pestana === 'fidelidad' && (
            <div className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {clientesFidelidad.map((cli, idx) => {
                  const ticketPromedio = cli.pedidos.length > 0 ? (cli.totalFacturado / cli.pedidos.length) : 0;

                  return (
                    <div key={idx} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between hover:border-amber-300 transition-colors">
                      <div>
                        <div className="flex items-start justify-between">
                          <div>
                            <h3 className="font-bold text-slate-900 text-base">{cli.nombre}</h3>
                            <p className="text-xs text-slate-500">📞 {cli.telefono}</p>
                          </div>
                          <span className="text-xs font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">
                            {cli.pedidos.length} encargo(s)
                          </span>
                        </div>

                        <div className="mt-4 p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-1.5">
                          <div className="flex justify-between text-xs">
                            <span className="text-slate-500">Valor Acumulado (LTV):</span>
                            <span className="font-extrabold text-emerald-700 text-sm">{formatCOP(cli.totalFacturado)}</span>
                          </div>
                          <div className="flex justify-between text-xs text-slate-500">
                            <span>Ticket Promedio:</span>
                            <span className="font-semibold text-slate-800">{formatCOP(ticketPromedio)}</span>
                          </div>
                          <div className="flex justify-between text-xs text-slate-400">
                            <span>Última compra:</span>
                            <span>{cli.ultimaFecha}</span>
                          </div>
                        </div>

                        <div className="mt-3 flex items-center gap-2 text-[11px] text-slate-500">
                          <span className="text-emerald-600 font-semibold">✓ {cli.completados} entregados</span>
                          <span>•</span>
                          <span className="text-indigo-600 font-semibold">⏳ {cli.activos} en curso</span>
                          {cli.cancelados > 0 && (
                            <>
                              <span>•</span>
                              <span className="text-rose-600 font-semibold">✕ {cli.cancelados} cancelados</span>
                            </>
                          )}
                        </div>
                      </div>

                      <button
                        onClick={() => setClienteDetalle(cli)}
                        className="mt-4 w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-2 rounded-xl text-xs transition-colors"
                      >
                        Ver Historial Completo de este Cliente
                      </button>
                    </div>
                  );
                })}
              </div>

              {clienteDetalle && (
                <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[85vh] flex flex-col">
                    <div className="flex justify-between items-center pb-4 border-b border-slate-200">
                      <div>
                        <h3 className="text-lg font-bold text-slate-900">{clienteDetalle.nombre}</h3>
                        <p className="text-xs text-slate-500">Historial completo • Teléfono: {clienteDetalle.telefono}</p>
                      </div>
                      <button onClick={() => setClienteDetalle(null)} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                    </div>

                    <div className="flex-1 overflow-y-auto mt-4 space-y-3">
                      {clienteDetalle.pedidos.map(p => {
                        const rec = recetas.find(r => r.id === p.receta_id);
                        return (
                          <div key={p.id} className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                            <div className="flex justify-between font-bold">
                              <span className="text-slate-900">{rec?.nombre} (x{p.cantidad})</span>
                              <span className="text-slate-800">{formatCOP(p.precio_total)}</span>
                            </div>
                            <div className="flex justify-between text-slate-500 mt-1">
                              <span>Fecha: {p.fecha_entrega}</span>
                              <span className={`font-bold ${
                                p.estado === 'entregado' ? 'text-emerald-600' :
                                p.estado === 'cancelado' ? 'text-rose-600' : 'text-amber-600'
                              }`}>
                                {p.estado.toUpperCase()}
                              </span>
                            </div>
                            {p.notas && <p className="text-slate-600 italic mt-1">"{p.notas}"</p>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {pestana === 'pedidos_pasados' && (
            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 text-slate-500 uppercase font-bold text-[10px] border-b border-slate-200">
                    <tr>
                      <th className="py-3 px-4">Fecha</th>
                      <th className="py-3 px-3">Cliente</th>
                      <th className="py-3 px-3">Receta</th>
                      <th className="py-3 px-3">Cantidad</th>
                      <th className="py-3 px-3">Valor Total</th>
                      <th className="py-3 px-4">Estado</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-slate-700">
                    {pedidos.map(p => {
                      const rec = recetas.find(r => r.id === p.receta_id);
                      return (
                        <tr key={p.id}>
                          <td className="py-3 px-4 font-semibold text-slate-800">{p.fecha_entrega}</td>
                          <td className="py-3 px-3 font-bold text-slate-900">{p.cliente_nombre}</td>
                          <td className="py-3 px-3">{rec?.nombre}</td>
                          <td className="py-3 px-3">{p.cantidad}</td>
                          <td className="py-3 px-3 font-extrabold text-slate-900">{formatCOP(p.precio_total)}</td>
                          <td className="py-3 px-4">
                            <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${
                              p.estado === 'entregado' ? 'bg-emerald-100 text-emerald-800' :
                              p.estado === 'cancelado' ? 'bg-rose-100 text-rose-800' :
                              'bg-amber-100 text-amber-800'
                            }`}>
                              {p.estado}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {pestana === 'mermas' && (
            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
              <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h3 className="font-bold text-slate-900 text-sm">Historial de Mermas & Pérdidas de Taller</h3>
                <span className="text-xs text-rose-600 font-bold">
                  Total Pérdidas: {formatCOP(mermas.reduce((acc, m) => acc + (m.costo_total || 0), 0))}
                </span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 text-slate-500 uppercase font-bold text-[10px] border-b border-slate-200">
                    <tr>
                      <th className="py-3 px-4">Fecha</th>
                      <th className="py-3 px-3">Insumo</th>
                      <th className="py-3 px-3">Cantidad Perdida</th>
                      <th className="py-3 px-3">Motivo / Causa</th>
                      <th className="py-3 px-4 text-right">Costo Merma (COP)</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-slate-700">
                    {mermas.map(m => {
                      const ins = insumos.find(i => i.id === m.insumo_id);
                      return (
                        <tr key={m.id}>
                          <td className="py-3 px-4 font-semibold text-slate-800">{m.fecha}</td>
                          <td className="py-3 px-3 font-bold text-slate-900">{ins?.nombre || 'Insumo'}</td>
                          <td className="py-3 px-3 text-rose-600 font-bold">{m.cantidad} {ins?.unidad}</td>
                          <td className="py-3 px-3 text-slate-600 italic">"{m.motivo}"</td>
                          <td className="py-3 px-4 text-right font-extrabold text-rose-700">{formatCOP(m.costo_total)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MODALES AUXILIARES
    // ==========================================
    function ModalNuevoPedido({ recetas, onGuardar, onClose }) {
      const [clienteNombre, setClienteNombre] = useState('');
      const [clienteTelefono, setClienteTelefono] = useState('');
      const [recetaId, setRecetaId] = useState(recetas[0]?.id || '');
      const [cantidad, setCantidad] = useState(1);
      const [fechaEntrega, setFechaEntrega] = useState(new Date().toISOString().split('T')[0]);
      const [horaEntrega, setHoraEntrega] = useState('16:00');
      const [notas, setNotas] = useState('');
      const [abono, setAbono] = useState(0);

      const receta = recetas.find(r => r.id === recetaId);
      const precioTotal = (receta?.precio_venta || 0) * cantidad;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!clienteNombre) return alert('Ingresa el nombre del cliente');
        onGuardar({
          id: 'ped_' + Date.now(),
          cliente_nombre: clienteNombre,
          cliente_telefono: clienteTelefono,
          receta_id: recetaId,
          cantidad: Number(cantidad),
          fecha_entrega: fechaEntrega,
          hora_entrega: horaEntrega,
          notas,
          precio_total: precioTotal,
          abono: Number(abono),
          estado: 'pendiente'
        });
      };

      return (
        <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            <div className="flex justify-between items-center pb-3 border-b border-slate-200">
              <h3 className="font-bold text-slate-900 text-lg">Registrar Nuevo Encargo</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="mt-4 space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Nombre del Cliente:</label>
                  <input
                    type="text"
                    required
                    value={clienteNombre}
                    onChange={e => setClienteNombre(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:outline-none"
                    placeholder="Ej. Carolina Pérez"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Teléfono (WhatsApp):</label>
                  <input
                    type="tel"
                    value={clienteTelefono}
                    onChange={e => setClienteTelefono(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:outline-none"
                    placeholder="Ej. 3123456789"
                  />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div className="col-span-2">
                  <label className="font-bold text-slate-700 block mb-1">Receta / Producto:</label>
                  <select
                    value={recetaId}
                    onChange={e => setRecetaId(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold bg-white"
                  >
                    {recetas.map(r => (
                      <option key={r.id} value={r.id}>{r.nombre}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Cantidad:</label>
                  <input
                    type="number"
                    min="1"

    // MODAL PASE A COCINA CON BLOQUEO ESTRICTO (CORRECCIÓN IMPLEMENTADA)
    function ModalPaseCocina({ pedido, recetas, insumos, onConfirmar, onClose, onIrABodega }) {
      const receta = recetas.find(r => r.id === pedido.receta_id);

      const { verificacion, hayFaltantes } = useMemo(() => {
        if (!receta) return { verificacion: [], hayFaltantes: false };

        let faltanteDetectado = false;
        const lista = receta.ingredientes.map(ing => {
          const ins = insumos.find(i => i.id === ing.insumo_id);
          const cantidadRequerida = ing.cantidad * pedido.cantidad;
          const stockActual = ins?.stock_actual || 0;
          const alcanza = stockActual >= cantidadRequerida;

          if (!alcanza) faltanteDetectado = true;

          return {
            insumo: ins,
            cantidadRequerida,
            stockActual,
            alcanza,
            deficit: Math.max(0, cantidadRequerida - stockActual)
          };
        });

        return { verificacion: lista, hayFaltantes: faltanteDetectado };
      }, [receta, insumos, pedido]);

      return (
        <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl">
            <div className="flex justify-between items-center pb-3 border-b border-slate-200">
              <div>
                <h3 className="font-bold text-slate-900 text-lg">Validación de Insumos - Pase a Cocina</h3>
                <p className="text-xs text-slate-500">Para: {pedido.cliente_nombre} • {receta?.nombre} (x{pedido.cantidad})</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            {hayFaltantes ? (
              <div className="mt-4 p-3 bg-rose-50 border border-rose-300 rounded-xl text-xs text-rose-800 space-y-1">
                <div className="font-bold flex items-center space-x-1.5 text-rose-900">
                  <span>⛔</span>
                  <span>Preparación Bloqueada: Materia Prima Insuficiente</span>
                </div>
                <p>
                  No dispones de las existencias necesarias en bodega para completar esta receta. No puedes pasar a cocina sin insumos suficientes. Registra la compra en Bodega antes de continuar.
                </p>
              </div>
            ) : (
              <div className="mt-4 p-3 bg-emerald-50 border border-emerald-300 rounded-xl text-xs text-emerald-800">
                <span className="font-bold">✓ ¡Materia prima disponible al 100%!</span> Al confirmar, se descontarán automáticamente los ingredientes de la bodega y el encargo pasará a preparación.
              </div>
            )}

            <div className="mt-4 max-h-60 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-xl">
              {verificacion.map(item => (
                <div key={item.insumo?.id} className={`p-3 text-xs flex justify-between items-center ${!item.alcanza ? 'bg-rose-50/70' : ''}`}>
                  <div>
                    <span className="font-bold text-slate-800 block">{item.insumo?.nombre}</span>
                    <span className="text-[11px] text-slate-500">
                      Requiere: <strong>{item.cantidadRequerida} {item.insumo?.unidad}</strong> | En Bodega: <strong>{item.stockActual} {item.insumo?.unidad}</strong>
                    </span>
                  </div>

                  <div>
                    {item.alcanza ? (
                      <span className="font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded text-[11px]">Disponible ✓</span>
                    ) : (
                      <div className="flex items-center space-x-2">
                        <span className="font-bold text-rose-700 bg-rose-100 px-2 py-0.5 rounded text-[11px]">
                          Faltan {item.deficit} {item.insumo?.unidad}
                        </span>
                        <button
                          onClick={() => onIrABodega(item.insumo)}
                          className="bg-rose-600 hover:bg-rose-700 text-white font-semibold px-2 py-0.5 rounded text-[10px]"
                        >
                          + Comprar
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>

            <div className="mt-6 pt-3 border-t border-slate-200 flex justify-end space-x-3">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-100 rounded-xl text-xs"
              >
                Cerrar
              </button>

              <button
                type="button"
                disabled={hayFaltantes}
                onClick={onConfirmar}
                className={`px-5 py-2 font-bold rounded-xl text-xs transition-colors shadow-sm flex items-center space-x-1.5 ${
                  hayFaltantes
                    ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                    : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                }`}
              >
                <span>👨‍🍳</span>
                <span>Confirmar y Descontar de Bodega</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

      const receta = recetas.find(r => r.id === pedido.receta_id);

      const mensajeDefault = `Hola ${pedido.cliente_nombre} 👋, te saludamos de GastroFlow Artisan.\n\nQueremos confirmarte que tu encargo de *${receta?.nombre}* (x${pedido.cantidad}) está agendado con éxito para el día *${pedido.fecha_entrega}* a las *${pedido.hora_entrega || 'por acordar'}*.\n\n💰 Total: ${formatCOP(pedido.precio_total)}\n💵 Abono recibido: ${formatCOP(pedido.abono)}\n${saldo > 0 ? `👉 *Saldo pendiente por cancelar:* ${formatCOP(saldo)}` : '🎉 *¡Tu pedido se encuentra totalmente pagado!*'}\n\n¡Quedamos muy atentos y trabajando con mucho amor en tu preparación! 🥐✨`;

        if (cantidad > insumo.stock_actual) {
          return alert('La merma no puede superar el stock actual disponible en bodega.');

        const mermaObj = {
          id: 'mrm_' + Date.now(),

          insumo_id: insumo.id,
          cantidad: Number(cantidad),
          motivo,
          costo_total: Math.round(costoTotalMerma)
        };

        const insumoActualizado = {
          ...insumo,
          stock_actual: Math.max(0, insumo.stock_actual - Number(cantidad))
        };

        e.preventDefault();
        onGuardar({
          id: receta?.id || 'rec_' + Date.now(),
          nombre,
          porciones_base: Number(porcionesBase),
          precio_venta: Number(precioVenta),
          tiempo_minutos: Number(tiempoMinutos),
          cif_porcentaje: Number(cifPorcentaje),
          ingredientes,
          equipos
        });
      };

      return (
        <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[90vh] flex flex-col">
            <div className="flex justify-between items-center pb-3 border-b border-slate-200">
              <h3 className="font-bold text-slate-900 text-lg">{receta ? 'Editar Ficha Técnica' : 'Nueva Receta'}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto mt-4 space-y-4 text-xs pr-1">
              <div>
                <label className="font-bold text-slate-700 block mb-1">Nombre de la Receta:</label>
                <input
                  type="text"
                  required
                  value={nombre}
                  onChange={e => setNombre(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                />
              </div>

              <div className="grid grid-cols-4 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Porciones:</label>
                  <input
                    type="number"
                    value={porcionesBase}
                    onChange={e => setPorcionesBase(Number(e.target.value))}
                    className="w-full px-3 py-2 rounded-xl border border-slate-300"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Tiempo (min):</label>
                  <input
                    type="number"
                    value={tiempoMinutos}
                    onChange={e => setTiempoMinutos(Number(e.target.value))}
                    className="w-full px-3 py-2 rounded-xl border border-slate-300"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">CIF (%):</label>
                  <input
                    type="number"
                    value={cifPorcentaje}
                    onChange={e => setCifPorcentaje(Number(e.target.value))}
                    className="w-full px-3 py-2 rounded-xl border border-slate-300"
                  />
                </div>
                <div>
                  <label className="font-bold text-emerald-700 block mb-1">Precio Venta (COP):</label>
                  <input
                    type="number"
                    step="5000"
                    value={precioVenta}
                    onChange={e => setPrecioVenta(Number(e.target.value))}
                    className="w-full px-3 py-2 rounded-xl border border-emerald-300 font-extrabold text-emerald-800"
                  />
                </div>
              </div>

              <div>
                <div className="flex justify-between items-center mb-2">
                  <h4 className="font-bold text-slate-800">Ingredientes de la Ficha:</h4>
                  <button type="button" onClick={agregarIngrediente} className="text-amber-700 font-bold hover:underline">+ Añadir Ingrediente</button>
                </div>
                <div className="space-y-2">
                  {ingredientes.map((ing, idx) => {
                    const ins = insumos.find(i => i.id === ing.insumo_id);
                    return (
                      <div key={idx} className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                        <select
                          value={ing.insumo_id}
                          onChange={e => actualizarIngrediente(idx, 'insumo_id', e.target.value)}
                          className="flex-1 px-2 py-1.5 rounded-lg border border-slate-300 bg-white"
                        >
                          {insumos.map(i => (
                            <option key={i.id} value={i.id}>{i.nombre} ({i.unidad})</option>
                          ))}
                        </select>
                        <input
                          type="number"
                          value={ing.cantidad}
                          onChange={e => actualizarIngrediente(idx, 'cantidad', Number(e.target.value))}
                          className="w-24 px-2 py-1.5 rounded-lg border border-slate-300 font-bold"
                          placeholder="Cantidad"
                        />
                        <span className="text-slate-500 w-8">{ins?.unidad}</span>
                        <button type="button" onClick={() => quitarIngrediente(idx)} className="text-rose-500 hover:text-rose-700 font-bold px-2">✕</button>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div>
                <div className="flex justify-between items-center mb-2">
                  <h4 className="font-bold text-slate-800">Equipos Eléctricos & Consumo:</h4>
                  <button type="button" onClick={agregarEquipo} className="text-amber-700 font-bold hover:underline">+ Añadir Equipo</button>
                </div>
                <div className="space-y-2">
                  {equipos.map((eq, idx) => (
                    <div key={idx} className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                      <input
                        type="text"
                        value={eq.nombre}
                        onChange={e => actualizarEquipo(idx, 'nombre', e.target.value)}
                        className="flex-1 px-2 py-1.5 rounded-lg border border-slate-300"
                        placeholder="Nombre del equipo"
                      />
                      <input
                        type="number"
                        value={eq.potencia_watts}
                        onChange={e => actualizarEquipo(idx, 'potencia_watts', Number(e.target.value))}
                        className="w-24 px-2 py-1.5 rounded-lg border border-slate-300"
                        placeholder="Watts"
                      />
                      <span className="text-slate-500">W</span>
                      <input
                        type="number"
                        value={eq.minutos_uso}
                        onChange={e => actualizarEquipo(idx, 'minutos_uso', Number(e.target.value))}
                        className="w-20 px-2 py-1.5 rounded-lg border border-slate-300"
                        placeholder="Minutos"
                      />
                      <span className="text-slate-500">min</span>
                      <button type="button" onClick={() => quitarEquipo(idx)} className="text-rose-500 hover:text-rose-700 font-bold px-2">✕</button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="pt-3 border-t border-slate-200 flex justify-end space-x-2">
                <button type="button" onClick={onClose} className="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-100 rounded-xl">Cancelar</button>
                <button type="submit" className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl shadow-sm">Guardar Ficha</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // MODAL AJUSTES & RESPALDO
    function ModalAjustes({ config, setConfig, insumos, recetas, pedidos, mermas, setInsumos, setRecetas, setPedidos, setMermas, onClose }) {
      const [tarifaKwh, setTarifaKwh] = useState(config.tarifa_kwh);

      const handleGuardarConfig = (e) => {
        e.preventDefault();
        setConfig({ ...config, tarifa_kwh: Number(tarifaKwh) });
        alert('Configuración guardada.');
        onClose();
      };

      const handleExportarBackup = () => {
        const data = {
          version: '14.0',
          fecha: new Date().toISOString(),
          insumos,
          recetas,
          pedidos,
          mermas,
          config
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `gastroflow_artisan_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      const handleImportarBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.insumos && data.recetas) {
              setInsumos(data.insumos);
              setRecetas(data.recetas);
              if (data.pedidos) setPedidos(data.pedidos);
              if (data.mermas) setMermas(data.mermas);
              if (data.config) setConfig(data.config);
              alert('¡Copia de seguridad restaurada exitosamente!');
              onClose();
            } else {
              alert('El archivo no tiene el formato válido de GastroFlow.');
            }
          } catch (err) {
            alert('Error al leer el archivo JSON.');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <div className="flex justify-between items-center pb-3 border-b border-slate-200">
              <h3 className="font-bold text-slate-900 text-base">Ajustes & Respaldo</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <form onSubmit={handleGuardarConfig} className="mt-4 space-y-4 text-xs">
              <div>
                <label className="font-bold text-slate-700 block mb-1">Tarifa Energía Eléctrica (COP / kWh):</label>
                <input
                  type="number"
                  value={tarifaKwh}
                  onChange={e => setTarifaKwh(Number(e.target.value))}
                  className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                />
                <p className="text-[11px] text-slate-400 mt-1">Dato de tu factura de energía en Colombia (promedio: $ 800 - $ 950).</p>
              </div>

              <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                <span className="font-bold text-slate-800 block">Copia de Seguridad de tus Datos:</span>
                <p className="text-[11px] text-slate-500">Descarga un archivo con todas tus recetas, pedidos, bodega e historial para no perder nada.</p>
                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    onClick={handleExportarBackup}
                    className="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-1.5 rounded-lg text-xs"
                  >
                    📥 Descargar Copia
                  </button>
                  <label className="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-1.5 rounded-lg text-xs text-center cursor-pointer">
                    📤 Restaurar Copia
                    <input type="file" accept=".json" onChange={handleImportarBackup} className="hidden" />
                  </label>
                </div>
              </div>

              <div className="pt-3 border-t border-slate-200 flex justify-end space-x-2">
                <button type="button" onClick={onClose} className="px-4 py-2 text-slate-600 font-semibold hover:bg-slate-100 rounded-xl">Cerrar</button>
                <button type="submit" className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl shadow-sm">Guardar Ajustes</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // RENDERIZAR EN EL NAVEGADOR
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
